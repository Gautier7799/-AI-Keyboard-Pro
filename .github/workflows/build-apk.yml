          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_mic.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12,14C10.34,14 9,12.66 9,11V5C9,3.34 10.34,2 12,2C13.66,2 15,3.34 15,5V11C15,12.66 13.66,14 12,14ZM11,21V17.9C8.04,17.58 5.76,15.65 5.17,12.78L6.15,12.54C6.63,14.93 8.64,16.81 11.14,16.98V17H12.86V16.98C15.36,16.81 17.37,14.93 17.85,12.54L18.83,12.78C18.24,15.65 15.96,17.58 13,17.9V21Z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_arrow_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_undo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12.5,8C9.85,8 7.45,8.99 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_keyboard_picker.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M20,5H4C2.9,5 2.01,5.9 2.01,7L2,17C2,18.1 2.9,19 4,19H20C21.1,19 22,18.1 22,17V7C22,5.9 21.1,5 20,5ZM11,8H13V10H11V8ZM11,11H13V13H11V11ZM8,8H10V10H8V8ZM8,11H10V13H8V11ZM7,13H5V11H7V13ZM7,10H5V8H7V10ZM16,17H8V15H16V17ZM16,13H14V11H16V13ZM16,10H14V8H16V10ZM19,13H17V11H19V13ZM19,10H17V8H19V10Z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">AI Keyboard</string><string name="ime_name">AI Keyboard (iOS Style)</string></resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AIKeyboard" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowLightStatusBar">?attr/isLightTheme</item></style></resources>
          EOF
