        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase46.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v46.0
          name: "AI Keyboard Pro - Phase 46 (Smart Suggestions Fix)"
          body: "1. 💡 **إصلاح شريط الكلمات:** الكلمة التي تكتبها ستظهر فوراً في منتصف الشريط العلوي بخط عريض، وبمجرد الضغط عليها يتم كتابتها مع ترك مسافة.\n2. 📚 **توسيع القاموس:** إضافة كلمات شائعة فرنسية وعربية للقاموس المدمج لتجربة خاصية الاقتراحات.\n3. 📏 **تحسين بصري:** إضافة فواصل (Dividers) شفافة بين الكلمات المقترحة لتشبه Gboard وكيبورد iOS."
          files: release-output/AI-Keyboard-Pro-Phase46.apk
        env:
