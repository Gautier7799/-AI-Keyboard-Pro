name: Build AI Keyboard Pro Ultimate

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Ultimate Keyboard Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 18; versionName = "18.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro</string>
              <string name="ime_name">iOS 26 Keyboard</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#007AFF" android:pathData="M34,54h40v10h-40zM34,34h40v10h-40zM34,74h20v10h-20z"/></vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_language.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM18.92,8h-2.95c-0.32,-1.25 -0.78,-2.45 -1.38,-3.56 1.84,0.63 3.37,1.91 4.33,3.56zM12,4.04c0.83,1.2 1.48,2.53 1.91,3.96h-3.82c0.43,-1.43 1.08,-2.76 1.91,-3.96zM4.26,14C4.09,13.36 4,12.69 4,12s0.09,-1.36 0.26,-2h3.38c-0.08,0.66 -0.14,1.32 -0.14,2s0.06,1.34 0.14,2H4.26zM5.08,16h2.95c0.32,1.25 0.78,2.45 1.38,3.56 -1.84,-0.63 -3.37,-1.9 -4.33,-3.56zM8.03,8H5.08c0.96,-1.66 2.49,-2.93 4.33,-3.56C8.81,5.55 8.35,6.75 8.03,8zM12,19.96c-0.83,-1.2 -1.48,-2.53 -1.91,-3.96h3.82c-0.43,1.43 -1.08,2.76 -1.91,3.96zM14.34,14H9.66c-0.09,-0.66 -0.16,-1.32 -0.16,-2s0.07,-1.35 0.16,-2h4.68c0.09,0.65 0.16,1.32 0.16,2s-0.07,1.34 -0.16,2zM14.59,19.56c0.6,-1.11 1.06,-2.31 1.38,-3.56h2.95c-0.96,1.65 -2.49,2.93 -4.33,3.56zM16.22,14c0.08,-0.66 0.14,-1.32 0.14,-2s-0.06,-1.34 -0.14,-2h3.38c0.17,0.64 0.26,1.31 0.26,2s-0.09,1.36 -0.26,2h-3.38z"/>
          </vector>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_keyboard_hide.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,3H4C2.9,3 2.01,3.9 2.01,5L2,15c0,1.1 0.89,2 2,2h16c1.1,0 2,-0.9 2,-2V5C22,3.9 21.1,3 20,3zM11,6h2v2h-2V6zM11,9h2v2h-2V9zM8,6h2v2H8V6zM8,9h2v2H8V9zM5,9h2v2H5V9zM5,6h2v2H5V6zM16,15H8v-2h8V15zM15,11h-2V9h2V11zM15,8h-2V6h2V8zM19,11h-2V9h2V11zM19,8h-2V6h2V8zM12,23l4,-4H8L12,23z"/>
          </vector>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="ar_AE" android:imeSubtypeMode="keyboard" />
              <subtype android:imeSubtypeLocale="fr_FR" android:imeSubtypeMode="keyboard" />
          </input-method>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.ColorDrawable
          import android.inputmethodservice.InputMethodService
          import android.media.AudioManager
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.PopupWindow
          import android.widget.TextView
          import android.widget.ImageView
          import android.widget.ScrollView

          class KeyboardService : InputMethodService() {
              private var isDarkMode = true
              private var kbBgColor = Color.BLACK
              private var keyNormalBg = Color.BLACK
              private var keyControlBg = Color.BLACK
              private var txtColor = Color.WHITE
              private val iosActionBlueColor = Color.parseColor("#007AFF")
              
              private var isArabic = false
              private var isShifted = false
              private var keyboardMode = 0 
              private var keyHeightDp = 42f
              
              private lateinit var prefs: SharedPreferences
              private lateinit var vibrator: Vibrator
              private lateinit var audioManager: AudioManager
              private val mainHandler = Handler(Looper.getMainLooper())
              
              private lateinit var rootLayout: LinearLayout
              private lateinit var headerContainer: LinearLayout
              private lateinit var predictionContainer: LinearLayout
              private lateinit var toolbarContainer: LinearLayout
              private lateinit var sliderContainer: View
              private lateinit var keysContainer: LinearLayout
              
              private val keyViews = mutableListOf<View>()
              private var popupWindow: PopupWindow? = null
              private var popupTextView: TextView? = null
              private var altPopupWindow: PopupWindow? = null
              private val altViews = mutableListOf<TextView>()

              private val arabicDict = listOf("مرحبا", "شكرا", "السلام", "عليكم", "نعم", "لا", "كيف", "حالك", "إن", "شاء", "الله")
              private val frenchDict = listOf("bonjour", "merci", "oui", "non", "comment", "ça", "va", "salut", "bien", "pourquoi")
              
              private val emojiList = listOf(
                  "😀","😂","🤣","😍","🥰","😘","😊","😎","😢","😭",
                  "😡","👍","👎","❤️","💔","🔥","✨","🎉","💯","✅",
                  "🤔","🙌","👏","🙏","💪","☕","🚗","✈️","📱","💻",
                  "⭐","🌟","🌙","☀️","🍎","🍔","🍕","⚽","🏀","🏆",
                  "🌹","🌸","🌺","🌻","🌼","🌿","🍀","🐾","🐶","🐱"
              )

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("kb_settings", Context.MODE_PRIVATE)
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
              }

              private fun updateThemeColors() {
                  val currentNightMode = resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                  isDarkMode = currentNightMode == Configuration.UI_MODE_NIGHT_YES
                  
                  if (isDarkMode) {
                      kbBgColor = Color.parseColor("#101010")
                      keyNormalBg = Color.parseColor("#3A3A3C")
                      keyControlBg = Color.parseColor("#2C2C2E")
                      txtColor = Color.parseColor("#FFFFFF")
                  } else {
                      kbBgColor = Color.parseColor("#D1D4D9")
                      keyNormalBg = Color.parseColor("#FFFFFF")
                      keyControlBg = Color.parseColor("#B3B8C3")
                      txtColor = Color.parseColor("#000000")
                  }
              }

              private fun getTopRoundRect(bgColor: Int, radius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      setColor(bgColor)
                      cornerRadii = floatArrayOf(radius, radius, radius, radius, 0f, 0f, 0f, 0f)
                  }
              }

              override fun onCreateInputView(): View {
                  updateThemeColors()
                  try { window?.window?.navigationBarColor = kbBgColor } catch (e: Exception) {}

                  keyViews.clear()
                  keyHeightDp = prefs.getFloat("key_height", 42f)
                  val dp = resources.displayMetrics.density

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = getTopRoundRect(kbBgColor, 16f * dp)
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding((4 * dp).toInt(), (8 * dp).toInt(), (4 * dp).toInt(), (4 * dp).toInt())
                  }

                  headerContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (40 * dp).toInt())
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val toggleBtn = TextView(this).apply {
                      text = "⊞"
                      textSize = 20f
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams((40 * dp).toInt(), (40 * dp).toInt()).apply {
                          setMargins(0, 0, (8 * dp).toInt(), 0)
                      }
                      background = getRoundRect(keyControlBg, 12f * dp)
                      setOnClickListener {
                          vibrate()
                          if (toolbarContainer.visibility == View.VISIBLE) {
                              toolbarContainer.visibility = View.GONE
                              predictionContainer.visibility = View.VISIBLE
                          } else {
                              toolbarContainer.visibility = View.VISIBLE
                              predictionContainer.visibility = View.GONE
                              sliderContainer.visibility = View.GONE
                          }
                      }
                  }

                  val dynamicArea = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }

                  predictionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  
                  toolbarContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER_VERTICAL
                      visibility = View.GONE
                  }
                  
                  toolbarContainer.addView(createQuickSettingPill("😊", "رموز") { 
                      vibrate()
                      keyboardMode = 3
                      renderKeys()
                  })
                  
                  toolbarContainer.addView(createQuickSettingPill("✨", "ذكاء") { 
                      updatePredictionsUi(listOf("🤖 تفكير..."), "") 
                      toolbarContainer.visibility = View.GONE
                      predictionContainer.visibility = View.VISIBLE
                  })
                  toolbarContainer.addView(createQuickSettingPill("🎚️", "حجم") { 
                      toolbarContainer.visibility = View.GONE
                      sliderContainer.visibility = View.VISIBLE
                  })
                  toolbarContainer.addView(createQuickSettingPill("⚙️", "ضبط") { openSettings() })

                  sliderContainer = createMaterialSlider(this, keyHeightDp, 35f, 65f) { newVal ->
                      keyHeightDp = newVal
                      prefs.edit().putFloat("key_height", newVal).apply()
                      val px = (newVal * dp).toInt()
                      keyViews.forEach { 
                          it.layoutParams.height = px
                          it.requestLayout()
                      }
                  }.apply { visibility = View.GONE }

                  dynamicArea.addView(predictionContainer)
                  dynamicArea.addView(toolbarContainer)
                  dynamicArea.addView(sliderContainer)

                  headerContainer.addView(toggleBtn)
                  headerContainer.addView(dynamicArea)
                  rootLayout.addView(headerContainer)
                  rootLayout.addView(Space((8 * dp).toInt()))

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  rootLayout.addView(keysContainer)

                  updateSmartPredictions()
                  renderKeys()

                  return rootLayout
              }

              private fun renderKeys() {
                  keysContainer.removeAllViews()
                  keyViews.clear()
                  val dp = resources.displayMetrics.density

                  if (keyboardMode == 3) {
                      val scrollView = ScrollView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (200 * dp).toInt(), 1f)
                      }
                      val emojiContainer = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      
                      val columns = 8
                      val rows = emojiList.chunked(columns)
                      rows.forEach { rowEmojis ->
                          val rowLayout = LinearLayout(this@KeyboardService).apply {
                              orientation = LinearLayout.HORIZONTAL
                              layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                              setPadding(0, (4 * dp).toInt(), 0, (4 * dp).toInt())
                          }
                          rowEmojis.forEach { emoji ->
                              rowLayout.addView(TextView(this@KeyboardService).apply {
                                  text = emoji
                                  textSize = 28f
                                  gravity = Gravity.CENTER
                                  layoutParams = LinearLayout.LayoutParams(0, (45 * dp).toInt(), 1f)
                                  isClickable = true
                                  background = getRoundRect(Color.TRANSPARENT, 8f * dp)
                                  setOnClickListener {
                                      vibrate()
                                      currentInputConnection?.commitText(emoji, 1)
                                  }
                              })
                          }
                          if (rowEmojis.size < columns) {
                              for (i in 0 until (columns - rowEmojis.size)) {
                                  rowLayout.addView(View(this@KeyboardService).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) })
                              }
                          }
                          emojiContainer.addView(rowLayout)
                      }
                      scrollView.addView(emojiContainer)
                      keysContainer.addView(scrollView)
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(createSpecialKey("ABC", keyControlBg, 1.5f, txtColor).apply {
                          setOnClickListener { vibrate(); keyboardMode = 0; renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", keyNormalBg, 6f, txtColor, 1f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1) }
                      })
                      bottomRow.addView(createBackspaceKey())
                      bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 1.5f, Color.WHITE).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                      })
                      keysContainer.addView(bottomRow)

                  } else if (keyboardMode == 0) { 
                      val r1 = if(isArabic) listOf("ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د") else listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p")
                      val r2 = if(isArabic) listOf("ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط") else listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m")
                      val r3 = if(isArabic) listOf("ظ","ز","و","ة","ى","لا","ر","ء") else listOf("w", "x", "c", "v", "b", "n")

                      val finalR1 = if(isShifted && !isArabic) r1.map { it.uppercase() } else r1
                      val finalR2 = if(isShifted && !isArabic) r2.map { it.uppercase() } else r2
                      val finalR3 = if(isShifted && !isArabic) r3.map { it.uppercase() } else r3

                      keysContainer.addView(createKeysRow(finalR1, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))
                      keysContainer.addView(createKeysRow(finalR2, 0f, if(isArabic) 12 else 16))
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      
                      if (!isArabic) {
                          val shiftBg = if(isShifted) txtColor else keyControlBg
                          val shiftTxtColor = if(isShifted) kbBgColor else txtColor
                          row3Container.addView(createSpecialKey(if(isShifted) "⬆" else "⇧", shiftBg, 1.5f, shiftTxtColor).apply {
                              setOnClickListener { vibrate(); isShifted = !isShifted; renderKeys() }
                          })
                      } else {
                          row3Container.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 0.5f) })
                      }
                      
                      row3Container.addView(createKeysRow(finalR3, finalR3.size.toFloat(), 0))
                      row3Container.addView(createBackspaceKey())
                      
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(createSpecialKey("?123", keyControlBg, 1.5f, txtColor).apply {
                          setOnClickListener { vibrate(); keyboardMode = 1; renderKeys() }
                      })
                      
                      if (isArabic) {
                          val shiftBg = if(isShifted) txtColor else keyControlBg
                          val shiftTxtColor = if(isShifted) kbBgColor else txtColor
                          bottomRow.addView(createSpecialKey(if(isShifted) "⬆" else "⇧", shiftBg, 1.2f, shiftTxtColor).apply {
                              setOnClickListener { vibrate(); isShifted = !isShifted; renderKeys() }
                          })
                      } else {
                          bottomRow.addView(createSpecialKey(",", keyControlBg, 1.2f, txtColor).apply {
                              setOnClickListener { vibrate(); currentInputConnection?.commitText(",", 1); updateSmartPredictions() }
                          })
                      }
                      
                      bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", keyNormalBg, 6f, txtColor, 1f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1); updateSmartPredictions() }
                      })
                      bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 1.5f, Color.WHITE).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                      })
                      keysContainer.addView(bottomRow)
                      
                  } else {
                      val r1 = if(keyboardMode == 1) listOf("1","2","3","4","5","6","7","8","9","0") else listOf("[","]","{","}","#","%","^","*","+","=")
                      val r2 = if(keyboardMode == 1) listOf("-","/",":",";","(",")","$","&","@","\"") else listOf("_","\\","|","~","<",">","€","£","¥","•")
                      val r3 = listOf(".",",","?","!","'")

                      keysContainer.addView(createKeysRow(r1, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))
                      keysContainer.addView(createKeysRow(r2, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      val symToggle = if(keyboardMode == 1) "#+=" else "123"
                      row3Container.addView(createSpecialKey(symToggle, keyControlBg, 1.5f, txtColor).apply {
                          setOnClickListener { vibrate(); keyboardMode = if(keyboardMode == 1) 2 else 1; renderKeys() }
                      })
                      row3Container.addView(createKeysRow(r3, r3.size.toFloat(), 6))
                      row3Container.addView(createBackspaceKey())
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(createSpecialKey("ABC", keyControlBg, 1.5f, txtColor).apply {
                          setOnClickListener { vibrate(); keyboardMode = 0; renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey(",", keyControlBg, 1.5f, txtColor).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(",", 1) }
                      })
                      bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", keyNormalBg, 6f, txtColor, 1f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1) }
                      })
                      bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 1.5f, Color.WHITE).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                      })
                      keysContainer.addView(bottomRow)
                  }

                  if (keyboardMode != 3) {
                      val footerRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (45 * dp).toInt())
