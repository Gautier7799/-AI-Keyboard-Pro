name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/layout app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 12; versionName = "7.2.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard</string>
              <string name="ime_name">AI Keyboard Pro ✨</string>
          </resources>
          EOF
          
          # إصلاح الثيم (ضمان ظهور النصوص والألوان)
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AIKeyboard" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowLightStatusBar">?attr/isLightTheme</item>
                  <item name="colorPrimary">@android:color/holo_blue_dark</item>
                  <item name="colorOnPrimary">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#9ECAFF" android:pathData="M54,20 C54,40 40,54 20,54 C40,54 54,68 54,88 C54,68 68,54 88,54 C68,54 54,40 54,20 Z"/>
              <path android:fillColor="#34D399" android:pathData="M75,25 C75,32 68,37 60,37 C68,37 75,44 75,52 C75,44 82,37 90,37 C82,37 75,32 75,25 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # تصميم الإعدادات باستخدام XML مع فرض ألوان النصوص لتكون واضحة!
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="?android:attr/colorBackground">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="24dp">
                  
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Préférences" android:textSize="32sp" android:textStyle="bold" android:textColor="?android:attr/textColorPrimary" android:layout_marginBottom="24dp"/>

                  <com.google.android.material.button.MaterialButton android:id="@+id/btnActiver" android:layout_width="match_parent" android:layout_height="60dp" text="1. Activer le clavier" android:textColor="?attr/colorOnPrimary" app:cornerRadius="16dp"/>
                  <com.google.android.material.button.MaterialButton android:id="@+id/btnSelect" android:layout_width="match_parent" android:layout_height="60dp" text="2. Sélectionner le clavier" android:textColor="?attr/colorOnPrimary" app:cornerRadius="16dp" android:layout_marginBottom="24dp"/>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Intelligence Artificielle (Gemini)" android:textColor="?android:attr/textColorSecondary" android:layout_marginBottom="8dp"/>
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardCornerRadius="24dp" app:cardElevation="0dp" app:cardBackgroundColor="?attr/colorSurfaceVariant" android:layout_marginBottom="24dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                          <EditText android:id="@+id/apiInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Clé Gemini API..." android:background="@android:color/transparent" android:padding="8dp" android:textColor="?android:attr/textColorPrimary" android:textColorHint="?android:attr/textColorSecondary"/>
                          <com.google.android.material.button.MaterialButton android:id="@+id/btnSaveApi" android:layout_width="match_parent" android:layout_height="50dp" text="Enregistrer la clé" android:textColor="?attr/colorOnPrimary" app:cornerRadius="12dp" android:layout_marginTop="12dp"/>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Apparence et Clavier" android:textColor="?android:attr/textColorSecondary" android:layout_marginBottom="8dp"/>
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardCornerRadius="24dp" app:cardElevation="0dp" app:cardBackgroundColor="?attr/colorSurfaceVariant" android:layout_marginBottom="24dp">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="20dp" android:gravity="center_vertical">
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Vibreur du clavier" android:textSize="16sp" android:textColor="?android:attr/textColorPrimary" android:textStyle="bold"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Émettre une vibration" android:textSize="12sp" android:textColor="?android:attr/textColorSecondary"/>
                              </LinearLayout>
                              <com.google.android.material.materialswitch.MaterialSwitch android:id="@+id/swVibrate" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="20dp" android:gravity="center_vertical">
                              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Pop-up de touche" android:textSize="16sp" android:textColor="?android:attr/textColorPrimary" android:textStyle="bold"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Afficher l'indicateur" android:textSize="12sp" android:textColor="?android:attr/textColorSecondary"/>
                              </LinearLayout>
                              <com.google.android.material.materialswitch.MaterialSwitch android:id="@+id/swPopup" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          </LinearLayout>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" text="Taille du clavier" android:textColor="?android:attr/textColorSecondary" android:layout_marginBottom="8dp"/>
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" app:cardCornerRadius="24dp" app:cardElevation="0dp" app:cardBackgroundColor="?attr/colorSurfaceVariant" android:layout_marginBottom="40dp">
                      <SeekBar android:id="@+id/seekSize" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="30dp" android:max="4"/>
                  </com.google.android.material.card.MaterialCardView>
              </LinearLayout>
          </ScrollView>
          EOF

          # ---- تطبيق الإعدادات (برمجة) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.color.DynamicColors
          import com.google.android.material.materialswitch.MaterialSwitch

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  DynamicColors.applyToActivityIfAvailable(this)
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)

                  findViewById<Button>(R.id.btnActiver).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  findViewById<Button>(R.id.btnSelect).setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }

                  val apiInput = findViewById<EditText>(R.id.apiInput)
                  apiInput.setText(prefs.getString("api_key", ""))
                  findViewById<Button>(R.id.btnSaveApi).setOnClickListener {
                      prefs.edit().putString("api_key", apiInput.text.toString().trim()).apply()
                      Toast.makeText(this, "Clé enregistrée! ✨", Toast.LENGTH_SHORT).show()
                  }

                  val swVibrate = findViewById<MaterialSwitch>(R.id.swVibrate)
                  swVibrate.isChecked = prefs.getBoolean("vibrate", true)
                  swVibrate.setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean("vibrate", isChecked).apply() }

                  val swPopup = findViewById<MaterialSwitch>(R.id.swPopup)
                  swPopup.isChecked = prefs.getBoolean("popup", true)
                  swPopup.setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean("popup", isChecked).apply() }

                  val seekSize = findViewById<SeekBar>(R.id.seekSize)
                  seekSize.progress = prefs.getInt("kb_size", 2)
                  seekSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) { prefs.edit().putInt("kb_size", progress).apply() }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }
          }
          EOF

          # ---- لوحة المفاتيح ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.PopupWindow
          import android.widget.Toast
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "EN"
              private var rootLayout: LinearLayout? = null
              private var keysContainer: LinearLayout? = null
              private var currentPopup: PopupWindow? = null
              private lateinit var vibrator: Vibrator
              
              private var aiButton: TextView? = null
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private val letterKeyViews = mutableListOf<TextView>()

              private var isLight = false
              private var density: Float = 1f

              override fun onCreateInputView(): View {
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  density = resources.displayMetrics.density
                  
                  val uiMode = resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                  isLight = uiMode != Configuration.UI_MODE_NIGHT_YES
                  
                  val bgColor = if (isLight) "#E5E5EA" else "#0A0C10" 
                  window?.window?.navigationBarColor = Color.parseColor(bgColor)

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply { setColor(Color.parseColor(bgColor)) }
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (45 * density).toInt())
                      setPadding((10*density).toInt(), 0, (10*density).toInt(), 0)
                  }
                  
                  fun addToolIcon(icon: String, action: () -> Unit) {
                      val btn = TextView(this).apply {
                          text = icon; textSize = 20f; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          setOnClickListener { vibrate(); action() }
                      }
                      toolbar.addView(btn)
                  }

                  addToolIcon("⚙️") { startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                  addToolIcon("📋") {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val textToPaste = clipboard.primaryClip?.getItemAt(0)?.text
                      if (textToPaste != null) currentInputConnection?.commitText(textToPaste, 1)
                  }
                  addToolIcon("😊") { isEmojiMode = !isEmojiMode; buildKeys() }
                  toolbar.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) })
                  
                  aiButton = TextView(this).apply {
                      text = "✨ AI Reply"
                      setTextColor(Color.parseColor("#0A0C10")); textSize = 14f; paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (32 * density).toInt()).apply { setMargins(0,0,(10*density).toInt(),0) }
                      setPadding((15*density).toInt(), 0, (15*density).toInt(), 0)
                      setOnClickListener { vibrate(); generateAiResponse() }
                  }
                  toolbar.addView(aiButton)
                  rootLayout?.addView(toolbar)

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(10, 10, 10, 10) }
                  }
                  rootLayout?.addView(keysContainer)

                  buildKeys()
                  return rootLayout!!
              }

              private fun buildKeys() {
                  keysContainer?.removeAllViews()
                  letterKeyViews.clear()
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val sizeMultiplier = 0.8f + (prefs.getInt("kb_size", 2) * 0.1f)
                  val baseKeyHeight = (58 * density * sizeMultiplier).toInt()

                  val keyNormalColor = if (isLight) "#FFFFFF" else "#43464D"
                  val keySpecialColor = if (isLight) "#B3B8C1" else "#2C2F36"
                  val textColor = if (isLight) "#000000" else "#FFFFFF"

                  val rows = if (isEmojiMode) {
                      listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍"),
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌"),
                          listOf("ABC", "SPACE", "DEL", "ENTER")
                      )
                  } else if (isSymbols) {
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          "AR" -> if (isCaps) listOf(
                              listOf("َ", "ً", "ُ", "ٌ", "ِ", "ٍ", "ّ", "ْ", "أ", "إ", "آ", "د"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          ) else listOf(
                              listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (rowKeys in rows) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight) }
                      for (key in rowKeys) {
                          val keyView = TextView(this).apply {
                              tag = key
                              val displayText = when (key) {
                                  "SHIFT" -> if (isCaps) "⇪" else "⇧"
                                  "DEL" -> "⌫"
                                  "ENTER" -> "⏎"
                                  else -> if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                              }

                              text = displayText
                              textSize = if (isEmojiMode && key.length == 2) 28f else if (key == "🌐" || key == "?123" || key == "ABC") 15f else 22f
                              gravity = Gravity.CENTER
                              
                              val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              val keyBgColorStr = when (key) { "ENTER" -> "#007AFF"; else -> if (isSpecial) keySpecialColor else keyNormalColor }
                              
                              setTextColor(Color.parseColor(if(key == "ENTER") "#FFFFFF" else textColor))
                              
                              background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 12f * density; setColor(Color.parseColor(keyBgColorStr)) }
                              if (isLight) elevation = 4f * density 

                              val weight = when (key) { "SPACE" -> 4f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "🌐" -> 1.2f; else -> 1f }
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight).apply { setMargins(6, (6*sizeMultiplier).toInt(), 6, (8*sizeMultiplier).toInt()) }
                              layoutParams = lp; isClickable = true

                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> { vibrate(); showPopup(v, text.toString(), keyNormalColor, textColor); (v.background as GradientDrawable).setColor(Color.parseColor(if(isLight) "#B3B8C1" else "#5A5D66")); true }
                                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { currentPopup?.dismiss(); currentPopup = null; (v.background as GradientDrawable).setColor(Color.parseColor(keyBgColorStr)); if (event.action == MotionEvent.ACTION_UP) handleKeyClick(key); true }
                                      else -> false
                                  }
                              }
                          }
                          letterKeyViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keysContainer?.addView(rowLayout)
                  }
              }

              private fun showPopup(keyView: View, text: String, normalColor: String, txtColor: String) {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("popup", true) || text.length > 1 || isEmojiMode) return
                  val popupView = TextView(this).apply {
                      this.text = text; textSize = 36f; setTextColor(Color.parseColor(txtColor)); gravity = Gravity.CENTER
                      background = GradientDrawable().apply { setColor(Color.parseColor(normalColor)); cornerRadius = 16f * density }
                      elevation = 10f
                  }
                  currentPopup = PopupWindow(popupView, (keyView.width * 1.5).toInt(), (keyView.height * 1.5).toInt()).apply { isClippingEnabled = false; showAsDropDown(keyView, -(keyView.width * 0.25).toInt(), -(keyView.height * 2.2).toInt()) }
              }

              private fun updateKeysTextForShift() {
                  for (tv in letterKeyViews) {
                      val key = tv.tag as? String ?: continue
                      if (key.length == 1 && key.first().isLetter()) tv.text = if (isCaps && currentLang != "AR") key.uppercase() else key
                      else if (key == "SHIFT") tv.text = if (isCaps) "⇪" else "⇧"
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)) }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                      "SHIFT" -> { 
                          isCaps = !isCaps
                          if (currentLang == "AR") buildKeys() else updateKeysTextForShift()
                      }
                      "?123" -> { isSymbols = true; isEmojiMode = false; buildKeys() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; buildKeys() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; buildKeys() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }

              private fun vibrate() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vibrate", true)) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(20, 100))
                      else vibrator.vibrate(20)
                  }
              }

              private fun generateAiResponse() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ Veuillez enregistrer votre clé API!", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  aiButton?.text = "⏳ Typing..."; aiButton?.isEnabled = false; aiButton?.alpha = 0.7f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = if (extractedText.isNotBlank()) "You are an AI keyboard assistant. Read the following text and write a natural, friendly, and concise reply in the same language. Text: $extractedText" else "Write a nice short greeting."
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          withContext(Dispatchers.Main) { ic.commitText("\n" + reply.trim() + " ✨\n", 1) }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { ic.commitText("\n[AI Error]\n", 1) } } 
                      finally { aiButton?.text = "✨ AI Reply"; aiButton?.isEnabled = true; aiButton?.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase7.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase7.2.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v7.2
          name: "AI Keyboard Pro - Phase 7.2 (Fix Hidden Text in Material You)"
          body: "إصلاح مشكلة اختفاء النصوص والألوان في الإعدادات بسبب خطأ في توافق Material You."
          files: release-output/AI-Keyboard-Pro-Phase7.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
