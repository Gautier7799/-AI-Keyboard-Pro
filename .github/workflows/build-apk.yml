name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 17; versionName = "10.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- الألوان الأصلية (السر في السرعة والأناقة) ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="keyboard_bg">#E5E5EA</color>
              <color name="key_bg">#FFFFFF</color>
              <color name="key_bg_pressed">#D1D1D6</color>
              <color name="key_special_bg">#B3B8C1</color>
              <color name="key_special_bg_pressed">#9AA0AB</color>
              <color name="key_text">#000000</color>
              <color name="toolbar_bg">#FFFFFF</color>
              <color name="icon_color">#1C1C1E</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="keyboard_bg">#000000</color>
              <color name="key_bg">#2C2C2E</color>
              <color name="key_bg_pressed">#48484A</color>
              <color name="key_special_bg">#1C1C1E</color>
              <color name="key_special_bg_pressed">#2C2C2E</color>
              <color name="key_text">#FFFFFF</color>
              <color name="toolbar_bg">#1C1C1E</color>
              <color name="icon_color">#FFFFFF</color>
          </resources>
          EOF

          # ---- ملفات الرسم (بدون Lag نهائياً) ----
          cat << 'EOF' > app/src/main/res/drawable/bg_toolbar.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/toolbar_bg"/>
              <corners android:radius="24dp"/>
          </shape>
          EOF
          
          cat << 'EOF' > app/src/main/res/drawable/bg_key.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg_pressed"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true" android:drawable="@drawable/bg_key_pressed" />
              <item android:drawable="@drawable/bg_key" />
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_key_special.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_special_bg"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_special_bg_pressed"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_special_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true" android:drawable="@drawable/bg_key_special_pressed" />
              <item android:drawable="@drawable/bg_key_special" />
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#007AFF"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#005BB5"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_enter_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true" android:drawable="@drawable/bg_key_enter_pressed" />
              <item android:drawable="@drawable/bg_key_enter" />
          </selector>
          EOF

          # ---- أيقونات Material 3 الأصلية ----
          cat << 'EOF' > app/src/main/res/drawable/ic_settings.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_color" android:pathData="M19.4,13c0,-0.3 0,-0.7 0,-1s0,-0.7 0,-1l2.1,-1.7c0.2,-0.2 0.2,-0.4 0.1,-0.6l-2,-3.5c-0.1,-0.2 -0.4,-0.3 -0.6,-0.2l-2.5,1c-0.5,-0.4 -1.1,-0.7 -1.7,-1l-0.4,-2.6C14.4,2.2 14.2,2 14,2h-4c-0.2,0 -0.5,0.2 -0.5,0.4l-0.4,2.6c-0.6,0.3 -1.2,0.6 -1.7,1l-2.5,-1c-0.2,-0.1 -0.5,0 -0.6,0.2l-2,3.5c-0.1,0.2 -0.1,0.5 0.1,0.6l2.1,1.7c0,0.3 0,0.7 0,1s0,0.7 0,1l-2.1,1.7c-0.2,0.2 -0.2,0.4 -0.1,0.6l2,3.5c0.1,0.2 0.4,0.3 0.6,0.2l2.5,-1c0.5,0.4 1.1,0.7 1.7,1l0.4,2.6c0,0.2 0.3,0.4 0.5,0.4h4c0.2,0 0.5,-0.2 0.5,-0.4l0.4,-2.6c0.6,-0.3 1.2,-0.6 1.7,-1l2.5,1c0.2,0.1 0.5,0 0.6,-0.2l2,-3.5c0.1,-0.2 0.1,-0.5 -0.1,-0.6L19.4,13zM12,15.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5S13.9,15.5 12,15.5z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_paste.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_color" android:pathData="M19,2h-4.2C14.4,0.8 13.3,0 12,0c-1.3,0 -2.4,0.8 -2.8,2H5C3.9,2 3,2.9 3,4v16c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V4C21,2.9 20.1,2 19,2zM12,2c0.6,0 1,0.4 1,1s-0.4,1 -1,1 -1,-0.4 -1,-1S11.4,2 12,2zM19,20H5V4h2v3h10V4h2V20z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_translate.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_color" android:pathData="M12.9,15.1l-2.5,-2.5c-0.9,1 -2,1.8 -3.4,2.4l-0.7,-1.9c1.1,-0.5 2,-1.2 2.8,-2.1H4v-2h7V7h2v2h6v2h-4.4c-0.4,1 -1,1.9 -1.7,2.8l2,2L12.9,15.1z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">AI Keyboard</string><string name="ime_name">AI Keyboard Pro ✨</string></resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AIKeyboard" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowLightStatusBar">?attr/isLightTheme</item></style></resources>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#9ECAFF" android:pathData="M54,20 C54,40 40,54 20,54 C40,54 54,68 54,88 C54,68 68,54 88,54 C68,54 54,40 54,20 Z"/><path android:fillColor="#34D399" android:pathData="M75,25 C75,32 68,37 60,37 C68,37 75,44 75,52 C75,44 82,37 90,37 C82,37 75,32 75,25 Z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true"><subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" /></input-method>
          EOF

          # ---- تطبيق الإعدادات ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setTheme(R.style.Theme_AIKeyboard)
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val uiMode = resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                  val isLight = uiMode != Configuration.UI_MODE_NIGHT_YES
                  val bgColor = if (isLight) "#F2F2F7" else "#000000"
                  val cardColor = if (isLight) "#FFFFFF" else "#1C1C1E"
                  val textColor = if (isLight) "#1C1C1E" else "#FFFFFF"
                  val subTextColor = if (isLight) "#8E8E93" else "#98989D"
                  window.navigationBarColor = Color.parseColor(bgColor)
                  window.statusBarColor = Color.parseColor(bgColor)

                  val scrollView = ScrollView(this).apply { setBackgroundColor(Color.parseColor(bgColor)) }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 80, 40, 80) }
                  scrollView.addView(root)

                  root.addView(TextView(this).apply { text = "Préférences"; setTextColor(Color.parseColor(textColor)); textSize = 28f; setPadding(20, 0, 0, 60); paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG })
                  fun createButton(textStr: String, action: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = textStr; setTextColor(Color.WHITE); textSize = 16f; isAllCaps = false
                          background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 24f; setColor(Color.parseColor("#007AFF")) }
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 140).apply { setMargins(0, 0, 0, 30) }
                          setOnClickListener { action() }
                      })
                  }
                  createButton("1. Activer le clavier") { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  createButton("2. Sélectionner le clavier") { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }

                  root.addView(TextView(this).apply { text = "Intelligence Artificielle (Gemini)"; setTextColor(Color.parseColor(subTextColor)); textSize = 14f; setPadding(20, 40, 0, 10) })
                  val apiCard = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor(cardColor)) }; setPadding(40, 40, 40, 40) }
                  val apiInput = EditText(this).apply {
                      hint = "Clé API Gemini..."
                      setHintTextColor(Color.parseColor(subTextColor)); setTextColor(Color.parseColor(textColor)); setText(prefs.getString("api_key", "")); textSize = 14f
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 16f; setColor(Color.parseColor(if (isLight) "#F2F2F7" else "#2C2C2E")) }
                      setPadding(30, 30, 30, 30)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 30) }
                  }
                  apiCard.addView(apiInput)
                  apiCard.addView(Button(this).apply {
                      text = "Enregistrer"; setTextColor(Color.parseColor("#0A0C10")); isAllCaps = false; paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 24f; setColor(Color.parseColor("#34D399")) }; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 120)
                      setOnClickListener { prefs.edit().putString("api_key", apiInput.text.toString().trim()).apply(); Toast.makeText(this@MainActivity, "Clé enregistrée! ✨", Toast.LENGTH_SHORT).show() }
                  })
                  root.addView(apiCard)
                  setContentView(scrollView)
              }
          }
          EOF

          # ---- لوحة المفاتيح الأسطورية V10 (سرعة خيالية، أيقونات Material، توزيع مثالي) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.PopupWindow
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "EN"
              private var rootLayout: LinearLayout? = null
              private var keysContainer: LinearLayout? = null
              private var currentPopup: PopupWindow? = null
              private lateinit var vibrator: Vibrator
              private var aiButton: TextView? = null
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private val letterKeyViews = mutableListOf<TextView>()
              private var density: Float = 1f
              private var lastLang = ""; private var lastModeSymbols = false; private var lastModeEmoji = false; private var lastCaps = false

              override fun onCreateInputView(): View {
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  density = resources.displayMetrics.density
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  window?.window?.navigationBarColor = bgColor

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgColor)
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  // 💎 شريط الأدوات الكبسولي الفاخر (iOS / Gboard Style) 💎
                  val toolbarContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { 
                          setMargins((8*density).toInt(), (10*density).toInt(), (8*density).toInt(), (2*density).toInt()) 
                      }
                  }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundResource(R.drawable.bg_toolbar) // تصميم كبسولي نظيف
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (44 * density).toInt())
                      elevation = 3f * density
                      setPadding((12*density).toInt(), 0, (8*density).toInt(), 0)
                  }
                  toolbarContainer.addView(toolbar)
                  rootLayout?.addView(toolbarContainer)
                  
                  fun addToolIcon(iconResId: Int, action: () -> Unit) {
                      val iconContainer = LinearLayout(this).apply {
                          gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      }
                      val img = ImageView(this).apply {
                          setImageResource(iconResId)
                          layoutParams = LinearLayout.LayoutParams((24*density).toInt(), (24*density).toInt())
                          setOnClickListener { vibrate(); action() }
                      }
                      iconContainer.addView(img)
                      toolbar.addView(iconContainer)
                  }

                  // أيقونات Material 3 الفخمة
                  addToolIcon(R.drawable.ic_settings) { startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                  addToolIcon(R.drawable.ic_paste) {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val textToPaste = clipboard.primaryClip?.getItemAt(0)?.text
                      if (textToPaste != null) currentInputConnection?.commitText(textToPaste, 1)
                  }
                  addToolIcon(R.drawable.ic_translate) { isEmojiMode = !isEmojiMode; forceBuildKeys() } // استخدمت الترجمة مؤقتاً للايموجي
                  toolbar.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) })
                  
                  aiButton = TextView(this).apply {
                      text = "✨ AI Reply"
                      setTextColor(Color.WHITE); textSize = 14f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (34 * density).toInt())
                      setPadding((16*density).toInt(), 0, (16*density).toInt(), 0)
                      setOnClickListener { vibrate(); generateAiResponse() }
                  }
                  toolbar.addView(aiButton)

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(6, 6, 6, 12) }
                  }
                  rootLayout?.addView(keysContainer)

                  forceBuildKeys()
                  return rootLayout!!
              }

              private fun checkAndBuildKeys() {
                  if (lastLang == currentLang && lastModeSymbols == isSymbols && lastModeEmoji == isEmojiMode && (currentLang != "AR" || lastCaps == isCaps)) {
                      if (currentLang != "AR") updateKeysTextForShift()
                      return
                  }
                  forceBuildKeys()
              }

              private fun forceBuildKeys() {
                  lastLang = currentLang; lastModeSymbols = isSymbols; lastModeEmoji = isEmojiMode; lastCaps = isCaps
                  keysContainer?.removeAllViews()
                  letterKeyViews.clear()
                  
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val sizeMultiplier = 1.0f + (prefs.getInt("kb_size", 2) * 0.1f) 
                  val baseKeyHeight = (54 * density * sizeMultiplier).toInt() 

                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)

                  val rows = if (isEmojiMode) {
                      listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍"),
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌"),
                          listOf("ABC", "SPACE", "DEL", "ENTER")
                      )
                  } else if (isSymbols) {
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          // 🎯 تصميم حروف عربي مثالي واحترافي 100% مثل أبل و Gboard (12 حرف في كل صف)
                          "AR" -> if (isCaps) listOf(
                              listOf("ذ", "ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط", "د"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          ) else listOf(
                              listOf("ذ", "ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط", "د"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (rowKeys in rows) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight) }
                      for (key in rowKeys) {
                          val keyView = TextView(this).apply {
                              tag = key
                              val displayText = when (key) { "SHIFT" -> if (isCaps) "⇪" else "⇧"; "DEL" -> "⌫"; "ENTER" -> "⏎"; else -> if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key }
                              text = displayText
                              // 👓 خط كبير جداً وواضح للنظارات
                              textSize = if (isEmojiMode && key.length == 2) 30f else if (key == "🌐" || key == "?123" || key == "ABC") 15f else 26f
                              gravity = Gravity.CENTER
                              typeface = Typeface.DEFAULT
                              
                              val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              
                              // 🚀 السرعة القصوى: استخدام XML Native Selectors بدلاً من الكود
                              val bgResource = when {
                                  key == "ENTER" -> R.drawable.key_enter_selector
                                  isSpecial -> R.drawable.key_special_selector
                                  else -> R.drawable.key_selector
                              }
                              setBackgroundResource(bgResource)
                              setTextColor(if(key == "ENTER") Color.WHITE else textColorInt)
                              
                              val weight = when (key) { "SPACE" -> 4.5f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "🌐" -> 1.2f; else -> 1f }
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight).apply { setMargins(5, (6*sizeMultiplier).toInt(), 5, (6*sizeMultiplier).toInt()) }
                              layoutParams = lp; isClickable = true

                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> { vibrate(); showPopup(v, text.toString(), textColorInt); false } 
                                      MotionEvent.ACTION_UP -> { currentPopup?.dismiss(); currentPopup = null; handleKeyClick(key); false }
                                      MotionEvent.ACTION_CANCEL -> { currentPopup?.dismiss(); currentPopup = null; false }
                                      else -> false
                                  }
                              }
                          }
                          letterKeyViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keysContainer?.addView(rowLayout)
                  }
              }

              private fun showPopup(keyView: View, text: String, txtColorInt: Int) {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("popup", true) || text.length > 1 || isEmojiMode) return
                  val popupView = TextView(this).apply {
                      this.text = text; textSize = 40f; setTextColor(txtColorInt); gravity = Gravity.CENTER; setBackgroundResource(R.drawable.bg_key)
                      elevation = 8f * density
                  }
                  currentPopup = PopupWindow(popupView, (keyView.width * 1.5).toInt(), (keyView.height * 1.5).toInt()).apply { isClippingEnabled = false; showAsDropDown(keyView, -(keyView.width * 0.25).toInt(), -(keyView.height * 2.2).toInt()) }
              }

              private fun updateKeysTextForShift() {
                  for (tv in letterKeyViews) {
                      val key = tv.tag as? String ?: continue
                      if (key.length == 1 && key.first().isLetter()) tv.text = if (isCaps && currentLang != "AR") key.uppercase() else key
                      else if (key == "SHIFT") tv.text = if (isCaps) "⇪" else "⇧"
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)) }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                      "SHIFT" -> { isCaps = !isCaps; checkAndBuildKeys() }
                      "?123" -> { isSymbols = true; isEmojiMode = false; checkAndBuildKeys() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; checkAndBuildKeys() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; checkAndBuildKeys() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }

              private fun vibrate() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vibrate", true)) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(20, 100))
                      else vibrator.vibrate(20)
                  }
              }

              private fun generateAiResponse() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ Veuillez enregistrer votre clé API!", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  aiButton?.text = "⏳ Typing..."; aiButton?.isEnabled = false; aiButton?.alpha = 0.7f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = if (extractedText.isNotBlank()) "You are an AI keyboard assistant. Read the following text and write a natural, friendly, and concise reply in the same language. Text: $extractedText" else "Write a nice short greeting."
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          withContext(Dispatchers.Main) { ic.commitText("\n" + reply.trim() + " ✨\n", 1) }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { ic.commitText("\n[AI Error]\n", 1) } } 
                      finally { aiButton?.text = "✨ AI Reply"; aiButton?.isEnabled = true; aiButton?.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase10.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v10.0
          name: "AI Keyboard Pro - Phase 10 (Masterpiece Edition 👑)"
          body: "1. القضاء التام على Lag باستخدام XML Selectors أصلية من الأندرويد.\n2. شريط أدوات كبسولي فاخر.\n3. أيقونات Material 3 للترجمة والإعدادات واللصق.\n4. لوحة عربية مثالية 12 حرف بكل صف تماماً كلوحة الآيفون.\n5. أحرف ضخمة وواضحة جداً لقراءة أسهل."
          files: release-output/AI-Keyboard-Pro-Phase10.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
