              private fun createSpecialKey(label: String, bgColor: Int, weight: Float, textColorParam: Int, textAlpha: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = label
                      textSize = if (label == "return") 14f else 16f
                      setTextColor(Color.argb((255 * textAlpha).toInt(), Color.red(textColorParam), Color.green(textColorParam), Color.blue(textColorParam)))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight).apply {
                          if (label != "?123" && label != "⇧" && label != "ABC" && label != "⬆" && label != "#+=") setMargins((4 * dp).toInt(), 0, 0, 0)
                      }
                      background = getRoundRect(bgColor, 6f * dp)
                      isClickable = true
                      setTypeface(null, if (label == "return") Typeface.BOLD else Typeface.NORMAL)
                      
                      setOnTouchListener { v, event ->
