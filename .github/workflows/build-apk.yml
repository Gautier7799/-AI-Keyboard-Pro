name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate iOS 26 Keyboard Project Files
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 3; versionName = "3.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro</string>
              <string name="ime_name">iOS 26 Keyboard</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/></shape>
          EOF
          
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#007AFF" android:pathData="M34,54h40v10h-40zM34,34h40v10h-40zM34,74h20v10h-20z"/></vector>
          EOF
          
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="fr_FR" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable
          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class KeyboardService : InputMethodService() {
              private val iosDarkCanvasBg = Color.parseColor("#0A0A0A")
              private val iosKeyNormalBg = Color.parseColor("#2C2C2E")
              private val iosKeyControlBg = Color.parseColor("#1C1C1E")
              private val iosActionBlueColor = Color.parseColor("#007AFF")
              private val iosTxtWhiteColor = Color.parseColor("#FFFFFF")

              override fun onCreateInputView(): View {
                  val dp = resources.displayMetrics.density

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(iosDarkCanvasBg)
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding((6 * dp).toInt(), (4 * dp).toInt(), (6 * dp).toInt(), (4 * dp).toInt())
                  }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (40 * dp).toInt())
                      setPadding((12 * dp).toInt(), 0, (12 * dp).toInt(), 0)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  toolbar.addView(createToolbarIcon("✨", 1f))
                  toolbar.addView(createToolbarIcon("🔧", 1f).apply { setOnClickListener { openSettings() } })
                  toolbar.addView(createToolbarIcon("Ia", 1f, isBold = true))
                  toolbar.addView(createToolbarIcon("🌐", 1f))
                  rootLayout.addView(toolbar)
                  
                  rootLayout.addView(Space((6 * dp).toInt()))

                  val predictionBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (35 * dp).toInt())
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  listOf("bonjour", "comment", "merci").forEach { word -> predictionBar.addView(createPredictionText(word)) }
                  rootLayout.addView(predictionBar)

                  rootLayout.addView(Space((10 * dp).toInt()))

                  val row1 = listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p")
                  val row2 = listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m")
                  
                  rootLayout.addView(createKeysRow(row1))
                  rootLayout.addView(Space((12 * dp).toInt()))
                  rootLayout.addView(createKeysRow(row2))
                  rootLayout.addView(Space((12 * dp).toInt()))

                  val row3Container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  row3Container.addView(createSpecialKey("⇧", iosKeyControlBg, 1.5f))
                  row3Container.addView(createKeysRow(listOf("w", "x", "c", "v", "b", "n"), 6f, isSubRow = true))
                  row3Container.addView(createSpecialKey("⌫", iosKeyControlBg, 1.5f).apply {
                      setOnClickListener { currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)) }
                  })
                  rootLayout.addView(row3Container)
                  rootLayout.addView(Space((12 * dp).toInt()))

                  val bottomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          setMargins(0, 0, 0, (8 * dp).toInt())
                      }
                  }
                  bottomRow.addView(createSpecialKey("?123", iosKeyControlBg, 2f))
                  bottomRow.addView(createSpecialKey("المسافة", iosKeyNormalBg, 5f, 0.4f).apply {
                      setOnClickListener { currentInputConnection?.commitText(" ", 1) }
                  })
                  bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 2f).apply {
                      setOnClickListener { currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                  })
                  rootLayout.addView(bottomRow)

                  val safeArea = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (48 * dp).toInt())
                      setPadding((32 * dp).toInt(), 0, (32 * dp).toInt(), 0)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  safeArea.addView(createToolbarIcon("😊", 1f, gravity = Gravity.START))
                  safeArea.addView(createToolbarIcon("🎙️", 1f, gravity = Gravity.END))
                  rootLayout.addView(safeArea)

                  return rootLayout
              }

              // هنا تم إصلاح الخلل الذي أخفى الصفوف العلوية!
              private fun createKeysRow(keys: List<String>, weightSum: Float = 10f, isSubRow: Boolean = false): LinearLayout {
                  val dp = resources.displayMetrics.density
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = if (isSubRow) {
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, weightSum)
                      } else {
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                  }
                  keys.forEachIndexed { index, char ->
                      row.addView(createKey(char))
                      if (index < keys.size - 1) row.addView(Space((6 * dp).toInt(), true))
                  }
                  if(isSubRow){ row.setPadding((6 * dp).toInt(), 0, (6 * dp).toInt(), 0) }
                  return row
              }

              private fun createKey(char: String): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = char
                      textSize = 20f
                      setTextColor(iosTxtWhiteColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (42 * dp).toInt(), 1f)
                      background = getRoundRect(iosKeyNormalBg, 5f * dp)
                      isClickable = true
                      setOnClickListener { currentInputConnection?.commitText(char, 1) }
                  }
              }

              private fun createSpecialKey(label: String, bgColor: Int, weight: Float, textAlpha: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = label
                      textSize = 15f
                      setTextColor(Color.argb((255 * textAlpha).toInt(), 255, 255, 255))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (42 * dp).toInt(), weight).apply {
                          if (label != "?123" && label != "⇧") setMargins((6 * dp).toInt(), 0, 0, 0)
                      }
                      background = getRoundRect(bgColor, 5f * dp)
                      isClickable = true
                      setTypeface(null, if (label == "return") Typeface.BOLD else Typeface.NORMAL)
                  }
              }

              private fun createToolbarIcon(icon: String, weight: Float, isBold: Boolean = false, gravity: Int = Gravity.CENTER): TextView {
                  return TextView(this).apply {
                      text = icon
                      textSize = 16f
                      setTextColor(iosTxtWhiteColor)
                      this.gravity = gravity or Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight)
                      if (isBold) setTypeface(null, Typeface.BOLD)
                  }
              }

              private fun createPredictionText(word: String): TextView {
                  return TextView(this).apply {
                      text = word
                      textSize = 15f
                      setTextColor(Color.argb((255 * 0.8f).toInt(), 255, 255, 255))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }
              }

              private fun getRoundRect(bgColor: Int, radius: Float): StateListDrawable {
                  val normal = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(bgColor); cornerRadius = radius }
                  val pressed = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(Color.parseColor("#4C4C4E")); cornerRadius = radius }
                  return StateListDrawable().apply {
                      addState(intArrayOf(android.R.attr.state_pressed), pressed)
                      addState(intArrayOf(), normal)
                  }
              }

              private fun Space(size: Int, isHorizontal: Boolean = false): View {
                  return View(this).apply { layoutParams = if (isHorizontal) LinearLayout.LayoutParams(size, 1) else LinearLayout.LayoutParams(1, size) }
              }
              
              private fun openSettings() {
                  startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import android.graphics.Color
          import android.view.Gravity
          import android.graphics.drawable.GradientDrawable

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dp = resources.displayMetrics.density
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0A0A0A"))
                      setPadding((20*dp).toInt(), (40*dp).toInt(), (20*dp).toInt(), (20*dp).toInt())
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  root.addView(TextView(this).apply {
                      text = "AI Keyboard Pro"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, (30*dp).toInt())
                  })
                  root.addView(Button(this).apply {
                      text = "1. تفعيل الكيبورد"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#2C2C2E")); cornerRadius = 24f }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (60*dp).toInt()).apply { setMargins(0,0,0,(16*dp).toInt()) }
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. اختيار الكيبورد كافتراضي"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#007AFF")); cornerRadius = 24f }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (60*dp).toInt())
                      setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  })
                  setContentView(root)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".KeyboardService" android:exported="true" android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          
          gradle wrapper

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean

      - name: Build APK
        run: |
          ./gradlew assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro-APK
          path: release-output/AI-Keyboard-Pro.apk
          retention-days: 5
