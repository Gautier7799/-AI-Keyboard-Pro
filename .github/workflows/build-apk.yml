              private fun toggleToolbar() {
                  if (defaultToolbarView.visibility == View.VISIBLE) { defaultToolbarView.visibility = View.GONE; aiToolsView.visibility = View.VISIBLE } 
                  else { defaultToolbarView.visibility = View.VISIBLE; aiToolsView.visibility = View.GONE }
              }

              private fun getLayoutRows(): List<List<KeyDef>> {
                  if (isSymbols) {
                      val nums = listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0")
                      return listOf(
                          nums.map { KeyDef(it, 1f) },
                          listOf("-", "/", ":", ";", "(", ")", "€", "&", "@", "\"").map { KeyDef(it, 1f) },
                          listOf(KeyDef("ABC", 1.3f)) + listOf(".", ",", "?", "!", "'").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1.3f)),
                          listOf(KeyDef("GLOBE", 1f), KeyDef("ABC", 1.5f), KeyDef("SPACE", 5.0f), KeyDef("ENTER", 1.5f), KeyDef("MIC", 1f)) 
                      )
                  }
                  return when (currentLang) {
                      "AR" -> listOf(
                          "ض ص ث ق ف غ ع ه خ ح ج د".split(" ").map { KeyDef(it, 1f) }, 
                          listOf(KeyDef("SPACER", 0.5f)) + "ش س ي ب ل ا ت ن م ك ط".split(" ").map { KeyDef(it, 1f) } + listOf(KeyDef("SPACER", 0.5f)),
                          listOf(KeyDef("SHIFT", 1.3f)) + "ذ ر ى ة و ز ظ".split(" ").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1.3f)),
                          listOf(KeyDef("GLOBE", 1.0f), KeyDef("?123", 1.5f), KeyDef("SPACE", 5.0f), KeyDef("ENTER", 1.5f), KeyDef("MIC", 1.0f)) 
                      )
                      else -> listOf(
                          "q w e r t y u i o p".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("q","a").replace("w","z"), 1f) },
                          "a s d f g h j k l m".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("a","q"), 1f) },
                          listOf(KeyDef("SHIFT", 1.3f)) + "z x c v b n".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("z","w"), 1f) } + listOf(KeyDef("'", 1f), KeyDef("DEL", 1.3f)),
                          listOf(KeyDef("GLOBE", 1.0f), KeyDef("?123", 1.5f), KeyDef("SPACE", 5.0f), KeyDef("ENTER", 1.5f), KeyDef("MIC", 1.0f)) 
                      )
                  }
              }

              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) { super.onStartInputView(info, restarting); currentTypedWord.clear(); updateSuggestions(); rebuildKeysLayout() }

              private fun showAltMenu(anchor: View, chars: List<String>) {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; setBackgroundResource(R.drawable.bg_popup_bubble)
                      elevation = 8f * density; setPadding((8*density).toInt(), (4*density).toInt(), (8*density).toInt(), (4*density).toInt())
                  }
                  val popup = PopupWindow(container, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, true)
                  for (c in chars) {
                      val btn = TextView(this).apply {
                          text = c; textSize = 26f; setTextColor(ContextCompat.getColor(this@KeyboardService, R.color.key_text))
                          gravity = Gravity.CENTER; setPadding((14*density).toInt(), (10*density).toInt(), (14*density).toInt(), (10*density).toInt())
                          typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                          setOnClickListener { 
                              currentInputConnection?.commitText(c, 1); currentTypedWord.append(c); updateSuggestions(); popup.dismiss() 
                          }
                      }
                      container.addView(btn)
                  }
                  val loc = IntArray(2)
                  anchor.getLocationOnScreen(loc)
                  popup.showAtLocation(anchor, Gravity.NO_GRAVITY, loc[0] - (40*density).toInt(), loc[1] - (60 * density).toInt())
              }

              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  val rows = getLayoutRows()
                  val baseKeyHeight = (42 * density).toInt() 
                  val keyMarginH = (3f * density).toInt() 
                  val keyMarginV = (6f * density).toInt() 
                  
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val textReturnColorInt = ContextCompat.getColor(this, R.color.key_text_return)
                  val iconColorInt = ContextCompat.getColor(this, R.color.toolbar_icon)
                  val handler = Handler(Looper.getMainLooper())

                  for (row in rows) {
                      val rowLayout = LinearLayout(this).apply { 
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight).apply { setMargins((2*density).toInt(), keyMarginV/2, (2*density).toInt(), keyMarginV/2) }
                      }
                      for (keyDef in row) {
                          val label = keyDef.label
                          if (label == "SPACER") {
                              rowLayout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, keyDef.weight) })
                          } else {
                              val keyView = FrameLayout(this).apply {
                                  layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, keyDef.weight).apply { setMargins(keyMarginH, 0, keyMarginH, 0) }
                                  
                                  val isSpecial = label == "DEL" || label == "SHIFT" || label == "?123" || label == "ABC"
                                  val isEnter = label == "ENTER"
                                  val isTransparentBtn = label == "GLOBE" || label == "MIC"
                                  
                                  if (!isTransparentBtn) {
                                      setBackgroundResource(if (isEnter) R.drawable.key_return_selector else if (isSpecial) R.drawable.key_special_selector else R.drawable.key_selector)
                                  }
                                  isClickable = true
                                  
                                  if (label == "SHIFT" || label == "DEL" || label == "ENTER" || label == "GLOBE" || label == "MIC") {
                                      if (label == "MIC") {
                                          val micLayout = LinearLayout(this@KeyboardService).apply { 
                                              orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                                              layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                                          }
                                          micLayout.addView(ImageView(this@KeyboardService).apply {
                                              setImageResource(R.drawable.ic_mic); setColorFilter(iconColorInt)
                                              layoutParams = LinearLayout.LayoutParams((26*density).toInt(), (26*density).toInt())
                                          })
                                          micLayout.addView(ImageView(this@KeyboardService).apply {
                                              setImageResource(R.drawable.ic_keyboard_picker); setColorFilter(iconColorInt)
                                              layoutParams = LinearLayout.LayoutParams((16*density).toInt(), (16*density).toInt()).apply { setMargins((4*density).toInt(),0,0,0) }
                                              alpha = 0.5f
                                              setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                                          })
                                          addView(micLayout)
                                      } else {
                                          val iconView = ImageView(this@KeyboardService).apply {
                                              layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER)
                                              val iconRes = when (label) { "SHIFT" -> R.drawable.ic_shift; "DEL" -> R.drawable.ic_delete; "ENTER" -> R.drawable.ic_enter; "GLOBE" -> R.drawable.ic_globe; else -> R.drawable.ic_enter }
                                              setImageResource(iconRes)
                                              if (label == "GLOBE") {
                                                  setColorFilter(iconColorInt)
                                                  layoutParams = FrameLayout.LayoutParams((28*density).toInt(), (28*density).toInt(), Gravity.CENTER)
                                              } else {
                                                  setColorFilter(if (isEnter) textReturnColorInt else textColorInt)
                                              }
                                              if(label == "SHIFT" && isCaps) alpha = 1.0f else if(label == "SHIFT") alpha = 0.6f
                                          }
                                          addView(iconView)
                                      }
                                  } else {
                                      val textView = TextView(this@KeyboardService).apply {
                                          text = when (label) { "SPACE" -> ""; else -> label }
                                          val baseSize = if (isSpecial) 16f else 22f 
                                          textSize = baseSize; gravity = Gravity.CENTER; setTextColor(textColorInt)
                                          typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                                          layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                                      }
                                      addView(textView)
                                  }

                                  var longPressRunnable: Runnable? = null
                                  var isLongPressTriggered = false

                                  setOnTouchListener { v, event ->
                                      when (event.action) {
                                          MotionEvent.ACTION_DOWN -> { 
                                              if(!isTransparentBtn) v.isPressed = true 
                                              isLongPressTriggered = false; v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                              if (label.length == 1 && label != " ") {
                                                  val keyX = v.x + rowLayout.x; val keyY = v.y + rowLayout.y + keysContainer.y + (44*density) 
                                                  keyPreviewBubble.text = label.uppercase()
                                                  keyPreviewBubble.x = keyX - (keyPreviewBubble.layoutParams.width - v.width) / 2f
                                                  keyPreviewBubble.y = keyY - keyPreviewBubble.layoutParams.height; keyPreviewBubble.visibility = View.VISIBLE
                                                  val alternates = altChars[label.lowercase()]
                                                  if (alternates != null) {
                                                      longPressRunnable = Runnable { isLongPressTriggered = true; keyPreviewBubble.visibility = View.GONE; v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); showAltMenu(v, alternates) }
                                                      handler.postDelayed(longPressRunnable!!, 400)
                                                  }
                                              }
                                              true 
                                          }
                                          MotionEvent.ACTION_UP -> { 
                                              v.isPressed = false; keyPreviewBubble.visibility = View.GONE; if (longPressRunnable != null) handler.removeCallbacks(longPressRunnable!!)
                                              if (!isLongPressTriggered) { handleKeyClick(label) }; true 
                                          }
                                          MotionEvent.ACTION_CANCEL -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; if (longPressRunnable != null) handler.removeCallbacks(longPressRunnable!!); true }
                                          else -> false
                                      }
                                  }
                              }
                              rowLayout.addView(keyView)
                          }
                      }
                      keysContainer.addView(rowLayout)
                  }
              }

              override fun onFinishInput() { super.onFinishInput(); currentTypedWord.clear(); updateSuggestions() }

              private fun updateSuggestions() {
                  if(!this::sug1.isInitialized) return
                  val word = currentTypedWord.toString().trim()
                  val dict = when(currentLang) { "AR" -> arDict; else -> frDict }
                  
                  if (word.isEmpty() || isSymbols) { 
                      sug1.text = dict[0]; sug2.text = dict[1]; sug3.text = dict[2]; return 
                  }
                  
                  val matches = mutableListOf<String>()
                  for (item in dict) { if (item.length > word.length && item.startsWith(word, ignoreCase = true)) { matches.add(item) } }
                  
                  sug1.text = if (matches.size > 0) matches[0] else ""
                  sug2.text = word 
                  sug3.text = if (matches.size > 1) matches[1] else ""
              }

              private fun applySuggestion(sug: String) {
                  if (sug.isEmpty()) return
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(currentTypedWord.length, 0); ic.commitText(sug + " ", 1); currentTypedWord.clear(); updateSuggestions()
              }

              private fun handleKeyClick(key: String) {
                  if (aiToolsView.visibility == View.VISIBLE) toggleToolbar()
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)); if (currentTypedWord.isNotEmpty()) currentTypedWord.deleteCharAt(currentTypedWord.length - 1) }
                      "SPACE", "ENTER" -> { if (key == "SPACE") ic.commitText(" ", 1) else { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }; currentTypedWord.clear() }
                      "SHIFT" -> { isCaps = !isCaps; rebuildKeysLayout() }
                      "?123" -> { isSymbols = true; rebuildKeysLayout(); updateSuggestions() }
                      "ABC" -> { isSymbols = false; rebuildKeysLayout(); updateSuggestions() }
                      "GLOBE" -> { currentLang = if(currentLang == "FR") "AR" else "FR"; currentTypedWord.clear(); updateSuggestions(); rebuildKeysLayout() }
                      "MIC" -> { /* Voice typing placeholder */ }
                      else -> { val letter = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key; ic.commitText(letter, 1); if (isCaps) { isCaps = false; rebuildKeysLayout() }; if (key.length == 1 && !isSymbols) { currentTypedWord.append(letter) } }
                  }
                  updateSuggestions()
              }
              
              private fun performAiAction(actionType: String, btn: TextView, originalTitle: String) {
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ ضع المفتاح", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  if (extractedText.isBlank() && actionType != "REPLY") { Toast.makeText(this, "لا يوجد نص", Toast.LENGTH_SHORT).show(); return }
                  btn.text = "⏳..."; btn.isEnabled = false; btn.alpha = 0.5f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = when (actionType) { "FIX" -> "صحح هذا النص إملائياً ولغوياً فقط وأعده بدون إضافات: $extractedText"; "REPLY" -> "اكتب رداً قصيراً وذكياً ومناسباً على هذا النص: $extractedText"; else -> "ترجم هذا النص للغة الأخرى (إن كان فرنسي ترجمه لعربي والعكس) ترجمة دقيقة: $extractedText" }
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                          withContext(Dispatchers.Main) { if(actionType == "REPLY") ic.commitText("\n$reply\n", 1) else { ic.deleteSurroundingText(extractedText.length, 0); ic.commitText(reply, 1) }; toggleToolbar() }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { Toast.makeText(this@KeyboardService, "خطأ بالاتصال", Toast.LENGTH_SHORT).show() } } 
                      finally { btn.text = originalTitle; btn.isEnabled = true; btn.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase50.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase50.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v50.1.1
          name: "AI Keyboard Pro - Phase 50.1.1 (Fully Fixed ✅)"
          body: "1. 🛠️ **إصلاح شاشة الإعدادات:** تمت كتابة كود MainActivity بالكامل لتمكين الأزرار وحفظ مفتاح API.\n2. 🔙 **إصلاح أيقونة الرجوع:** تمت إضافة ic_arrow_back لضمان عمل شريط الذكاء الاصطناعي بشكل سليم.\n3. 📱 **جاهز للاستخدام:** التطبيق يعمل الآن بدون أي أخطاء في الـ Build."
          files: release-output/AI-Keyboard-Pro-Phase50.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
