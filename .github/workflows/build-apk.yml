          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.inputmethod.InputMethodManager
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.HorizontalScrollView
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.widget.PopupWindow
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.HapticFeedbackConstants
          import android.text.TextUtils
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.lang.StringBuilder
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var currentLang = "AR" 
              
              private lateinit var rootFrame: FrameLayout
              private lateinit var mainLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var keyPreviewBubble: TextView
              
              private lateinit var defaultToolbarView: LinearLayout
              private lateinit var aiToolsView: HorizontalScrollView
              
              private lateinit var sug1: TextView
              private lateinit var sug2: TextView
              private lateinit var sug3: TextView
              
              private lateinit var prefs: SharedPreferences
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              private val currentTypedWord = StringBuilder()

              // قواميس تجريبية موسعة
              private val arDict = arrayOf("السلام", "عليكم", "مرحبا", "كيف", "حالك", "شكرا", "صباح", "الخير", "مساء", "اليوم", "غدا", "الآن", "مشروع", "تطبيق", "جميل", "جدا", "ممتاز", "نعم", "لا", "ماذا", "لماذا", "هذا", "هذه", "أنا", "أنت", "نحن", "إن", "شاء", "الله")
              private val frDict = arrayOf("bonjour", "comment", "merci", "oui", "non", "salut", "bien", "avec", "pour", "projet", "application", "dynamic", "island", "keyboard", "clavier", "très", "beau", "bon", "jour", "nuit", "demain", "aujourd'hui")

              private val altChars = mapOf(
                  "ا" to listOf("أ", "إ", "آ", "ء"), "ي" to listOf("ئ", "ى"), "و" to listOf("ؤ"), "ل" to listOf("لا", "لأ", "لإ", "لآ"),
                  "e" to listOf("é", "è", "ê", "ë"), "a" to listOf("à", "â", "æ", "á"), "c" to listOf("ç"), "u" to listOf("ù", "û", "ü"),
                  "i" to listOf("î", "ï"), "o" to listOf("ô", "œ")
              )

              data class KeyDef(val label: String, val weight: Float)

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  density = resources.displayMetrics.density
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val sugColorInt = ContextCompat.getColor(this, R.color.suggestion_text)
                  val iconColorInt = ContextCompat.getColor(this, R.color.toolbar_icon)
                  window?.window?.navigationBarColor = bgColor

                  rootFrame = FrameLayout(this).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }

                  val toolbarWrapper = FrameLayout(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (42 * density).toInt()) }
                  
                  defaultToolbarView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  }
                  
                  val toolbarToggleBtn = ImageView(this).apply {
                      setImageResource(R.drawable.ic_grid)
                      setColorFilter(iconColorInt)
                      layoutParams = LinearLayout.LayoutParams((48 * density).toInt(), ViewGroup.LayoutParams.MATCH_PARENT)
                      setPadding((12*density).toInt(), (12*density).toInt(), (12*density).toInt(), (12*density).toInt())
                      scaleType = ImageView.ScaleType.CENTER_INSIDE
                      setOnClickListener { toggleToolbar() }
                  }
                  defaultToolbarView.addView(toolbarToggleBtn)
                  
                  // ==========================================
                  // شريط الاقتراحات المطور (Version 46)
                  // ==========================================
                  val suggestionContainer = LinearLayout(this).apply { 
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      gravity = Gravity.CENTER 
                  }
                  
                  fun createSugView(isCenter: Boolean = false): TextView { 
                      return TextView(this).apply { 
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          gravity = Gravity.CENTER; textSize = 16f; setTextColor(sugColorInt); isClickable = true
                          maxLines = 1; ellipsize = TextUtils.TruncateAt.END
                          if (isCenter) setTypeface(null, Typeface.BOLD) // الكلمة الحالية دائماً بخط عريض
                          setOnClickListener { applySuggestion(this.text.toString()) } 
                      } 
                  }
                  fun createDivider(): View {
                      return View(this).apply {
                          layoutParams = LinearLayout.LayoutParams(1, (24 * density).toInt())
                          setBackgroundColor(Color.parseColor("#44888888")) // خط فاصل شفاف
                      }
                  }
                  
                  sug1 = createSugView()
                  sug2 = createSugView(isCenter = true)
                  sug3 = createSugView()
                  
                  suggestionContainer.addView(sug1)
                  suggestionContainer.addView(createDivider())
                  suggestionContainer.addView(sug2)
                  suggestionContainer.addView(createDivider())
                  suggestionContainer.addView(sug3)
                  
                  defaultToolbarView.addView(suggestionContainer)
                  // ==========================================

                  aiToolsView = HorizontalScrollView(this).apply { visibility = View.GONE; isHorizontalScrollBarEnabled = false; layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT) }
                  val toolsLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val closeBtn = ImageView(this).apply { 
                      setImageResource(R.drawable.ic_arrow_back); setColorFilter(iconColorInt)
                      layoutParams = LinearLayout.LayoutParams((48 * density).toInt(), ViewGroup.LayoutParams.MATCH_PARENT)
                      setPadding((12*density).toInt(), (12*density).toInt(), (12*density).toInt(), (12*density).toInt())
                      scaleType = ImageView.ScaleType.CENTER_INSIDE
                      setOnClickListener { toggleToolbar() } 
                  }
                  toolsLayout.addView(closeBtn)
                  
                  val shortcutBgColor = ContextCompat.getColor(this@KeyboardService, R.color.shortcut_bg)
                  val chipBg = GradientDrawable().apply { setColor(shortcutBgColor); cornerRadius = 24f * density }
                  fun createToolBtn(icon: String, title: String, action: (TextView) -> Unit): TextView {
                      return TextView(this).apply {
                          text = "$icon $title"; textSize = 14f; setTextColor(textColorInt); gravity = Gravity.CENTER; background = chipBg
                          setPadding((16*density).toInt(), (8*density).toInt(), (16*density).toInt(), (8*density).toInt())
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins((4*density).toInt(), 0, (4*density).toInt(), 0) }
                          setOnClickListener { action(this) }
                      }
                  }
                  
                  toolsLayout.addView(createToolBtn("✨", "رد ذكي") { performAiAction("REPLY", it, it.text.toString()) })
                  toolsLayout.addView(createToolBtn("📝", "تصحيح") { performAiAction("FIX", it, it.text.toString()) })
                  toolsLayout.addView(createToolBtn("🌍", "ترجمة") { performAiAction("TRANSLATE", it, it.text.toString()) })
                  
                  aiToolsView.addView(toolsLayout)
                  toolbarWrapper.addView(defaultToolbarView)
                  toolbarWrapper.addView(aiToolsView)
                  mainLayout.addView(toolbarWrapper)

                  keysContainer = LinearLayout(this).apply { 
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  mainLayout.addView(keysContainer)
                  
                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (38 * density).toInt())
                      setPadding((12*density).toInt(), 0, (12*density).toInt(), 0)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  
                  val globeBtn = ImageView(this).apply {
                      setImageResource(R.drawable.ic_globe); setColorFilter(iconColorInt); scaleType = ImageView.ScaleType.CENTER_INSIDE
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setPadding(0, (8*density).toInt(), 0, (8*density).toInt())
                      setOnClickListener { 
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          currentLang = if(currentLang == "FR") "AR" else "FR"; currentTypedWord.clear(); updateSuggestions(); rebuildKeysLayout() 
                      }
                  }

                  val undoBtn = ImageView(this).apply {
                      setImageResource(R.drawable.ic_undo); setColorFilter(iconColorInt); scaleType = ImageView.ScaleType.CENTER_INSIDE
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setPadding(0, (8*density).toInt(), 0, (8*density).toInt())
                      setOnClickListener { 
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          val ic = currentInputConnection ?: return@setOnClickListener
                          val time = SystemClock.uptimeMillis()
                          ic.sendKeyEvent(KeyEvent(time, time, KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_Z, 0, KeyEvent.META_CTRL_ON))
                          ic.sendKeyEvent(KeyEvent(time, time, KeyEvent.ACTION_UP, KeyEvent.KEYCODE_Z, 0, KeyEvent.META_CTRL_ON))
                      }
                  }
                  
                  val micBtn = ImageView(this).apply {
                      setImageResource(R.drawable.ic_mic); setColorFilter(iconColorInt); scaleType = ImageView.ScaleType.CENTER_INSIDE
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setPadding(0, (8*density).toInt(), 0, (8*density).toInt())
                      setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP) }
                  }

                  val pickerBtn = ImageView(this).apply {
                      setImageResource(R.drawable.ic_keyboard_picker); setColorFilter(iconColorInt); scaleType = ImageView.ScaleType.CENTER_INSIDE
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setPadding(0, (8*density).toInt(), 0, (8*density).toInt())
                      setOnClickListener { 
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  }

                  bottomBar.addView(globeBtn); bottomBar.addView(undoBtn); bottomBar.addView(micBtn); bottomBar.addView(pickerBtn)
                  mainLayout.addView(bottomBar)
                  
                  keyPreviewBubble = TextView(this).apply {
                      textSize = 34f; setTextColor(textColorInt); gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                      setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 12f * density; visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams((52 * density).toInt(), (58 * density).toInt())
                  }
                  rootFrame.addView(mainLayout); rootFrame.addView(keyPreviewBubble)

                  rebuildKeysLayout()
