name: Build Android APK (Keyboard Pro iOS 26)

# تفعيل السير التلقائي عند الدفع بكود جديد إلى الفروع الرئيسية
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود المصدري المحدث لكيبورد Pro من المستودع
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا (تم التحديث إلى JDK 17 المتوافق تماماً مع مستودعات Compose الحديثة)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # تسريع البناء عبر تخزين ملفات الكاش

    # 3. إعطاء الصلاحيات لملف التحكم وتهيئة نظام أندرويد
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 4. خطوة التحديث والإصلاح: تنظيف المشروع (Clean) لحذف أي واجهات ومقاسات قديمة مشوهة
    - name: Clean Project Cache
      run: ./gradlew clean

    # 5. بدء بناء تطبيق الكيبورد الفعلي وتوليد ملف الـ APK بالهندسة الجديدة
    - name: Build New Layout APK
      run: ./gradlew assembleDebug

    # 6. استخراج وتصدير ملف الـ APK النهائي لتتمكن من تحميله على هاتفك مباشرة
    - name: Upload Keyboard Pro APK
      uses: actions/upload-artifact@v4
      with:
        name: Keyboard-Pro-iOS26-Fixed
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 5 # الاحتفاظ بالملف صالحاً للتحميل لمدة 5 أيام
