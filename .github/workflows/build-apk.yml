name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/layout app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 59; versionName = "50.1.1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- الألوان الرسمية من المستند (Apple HIG Hex Codes) ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="keyboard_bg">#D1D3D9</color>
              <color name="key_bg">#FFFFFF</color>
              <color name="key_shadow">#898A8D</color>
              <color name="key_bg_pressed">#BEC3CB</color>
              <color name="key_special_bg">#A9AEB8</color>
              <color name="key_special_shadow">#898A8D</color>
              <color name="key_special_bg_pressed">#FFFFFF</color>
              <color name="key_return_bg">#007AFF</color>
              <color name="key_return_pressed">#005BB5</color>
              <color name="key_text">#000000</color>
              <color name="key_text_return">#FFFFFF</color>
              <color name="suggestion_text">#000000</color>
              <color name="toolbar_icon">#8E8E93</color> 
              <color name="shortcut_bg">#FFFFFF</color>
              <color name="ios_blue">#007AFF</color>
              <color name="slider_track">#E0E0E0</color>
              <color name="slider_progress">#00796B</color>
              <color name="btn_bg">#212121</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="keyboard_bg">#0D0D0D</color> 
              <color name="key_bg">#636366</color> 
              <color name="key_shadow">#000000</color>
              <color name="key_bg_pressed">#48484A</color>
              <color name="key_special_bg">#2C2C2E</color> 
              <color name="key_special_shadow">#000000</color>
              <color name="key_special_bg_pressed">#48484A</color>
              <color name="key_return_bg">#007AFF</color>
              <color name="key_return_pressed">#005BB5</color>
              <color name="key_text">#FFFFFF</color>
              <color name="key_text_return">#FFFFFF</color>
              <color name="suggestion_text">#FFFFFF</color>
              <color name="toolbar_icon">#98989D</color> 
              <color name="shortcut_bg">#2C2C2E</color>
              <color name="ios_blue">#0A84FF</color>
              <color name="slider_track">#424242</color>
