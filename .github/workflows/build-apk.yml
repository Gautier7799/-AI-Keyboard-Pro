          EOF

          cat << 'EOF' > app/src/main/res/drawable/slider_track_bg.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background" android:gravity="center_vertical"><shape><corners android:radius="6dp"/><solid android:color="@color/slider_track"/><size android:height="12dp"/></shape></item>
              <item android:id="@android:id/progress" android:gravity="center_vertical"><scale android:scaleWidth="100%"><shape><corners android:radius="6dp"/><solid android:color="@color/slider_progress"/><size android:height="12dp"/></shape></scale></item>
          </layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/slider_thumb.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="2dp"/><solid android:color="@color/slider_progress"/><size android:width="4dp" android:height="26dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/slider_tick.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><size android:width="6dp" android:height="6dp"/><solid android:color="@color/slider_progress"/></shape>
