name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 9; versionName = "6.1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard</string>
              <string name="ime_name">AI Keyboard Pro ✨</string>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AIKeyboard" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#9ECAFF" android:pathData="M54,20 C54,40 40,54 20,54 C40,54 54,68 54,88 C54,68 68,54 88,54 C68,54 54,40 54,20 Z"/>
              <path android:fillColor="#34D399" android:pathData="M75,25 C75,32 68,37 60,37 C68,37 75,44 75,52 C75,44 82,37 90,37 C82,37 75,32 75,25 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # ---- تطبيق الإعدادات ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setTheme(R.style.Theme_AIKeyboard)
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  val scrollView = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F2F2F7")) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 80)
                  }
                  scrollView.addView(root)

                  val title = TextView(this).apply { text = "Préférences"; setTextColor(Color.parseColor("#1C1C1E")); textSize = 28f; setPadding(20, 0, 0, 60); paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG }
                  root.addView(title)
                  
                  fun createButton(textStr: String, action: () -> Unit) {
                      val btn = Button(this).apply {
                          text = textStr; setTextColor(Color.WHITE); textSize = 16f; isAllCaps = false
                          background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 24f; setColor(Color.parseColor("#007AFF")) }
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 140).apply { setMargins(0, 0, 0, 30) }
                          setOnClickListener { action() }
                      }
                      root.addView(btn)
                  }

                  createButton("1. Activer le clavier") { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  createButton("2. Sélectionner le clavier") { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }

                  // --- قسم إعداد Gemini API ---
                  val apiTitle = TextView(this).apply { text = "Intelligence Artificielle (Gemini)"; setTextColor(Color.parseColor("#6E6E73")); textSize = 14f; setPadding(20, 40, 0, 10) }
                  root.addView(apiTitle)

                  val apiCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.WHITE) }
                      setPadding(40, 40, 40, 40)
                  }
                  
                  val apiInput = EditText(this).apply {
                      hint = "Collez votre clé Gemini API ici..."
                      setText(prefs.getString("api_key", ""))
                      textSize = 14f
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 16f; setColor(Color.parseColor("#F2F2F7")) }
                      setPadding(30, 30, 30, 30)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 30) }
                  }
                  apiCard.addView(apiInput)

                  val saveApiBtn = Button(this).apply {
                      text = "Enregistrer la clé API"; setTextColor(Color.WHITE); isAllCaps = false
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 24f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 120)
                      setOnClickListener {
                          prefs.edit().putString("api_key", apiInput.text.toString().trim()).apply()
                          Toast.makeText(this@MainActivity, "Clé enregistrée avec succès! ✨", Toast.LENGTH_SHORT).show()
                      }
                  }
                  apiCard.addView(saveApiBtn)
                  root.addView(apiCard)
                  // ------------------------------

                  val settingsTitle = TextView(this).apply { text = "Apparence et Clavier"; setTextColor(Color.parseColor("#6E6E73")); textSize = 14f; setPadding(20, 40, 0, 10) }
                  root.addView(settingsTitle)

                  val settingsCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.WHITE) }
                  }

                  fun createSwitch(title: String, subtitle: String, key: String, default: Boolean, isLast: Boolean = false) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(40, 30, 40, 30) }
                      val textLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                      val tvTitle = TextView(this).apply { text = title; setTextColor(Color.parseColor("#1C1C1E")); textSize = 16f }
                      val tvSub = TextView(this).apply { text = subtitle; setTextColor(Color.parseColor("#8E8E93")); textSize = 12f }
                      textLayout.addView(tvTitle); textLayout.addView(tvSub)
                      val sw = Switch(this).apply {
                          isChecked = prefs.getBoolean(key, default)
                          setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean(key, isChecked).apply() }
                      }
                      row.addView(textLayout); row.addView(sw); settingsCard.addView(row)
                      if(!isLast) settingsCard.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 2).apply{ setMargins(40,0,0,0) }; setBackgroundColor(Color.parseColor("#E5E5EA")) })
                  }

                  createSwitch("Thème Clair", "Utiliser les couleurs claires", "light_theme", false)
                  createSwitch("Vibreur du clavier", "Émettre une vibration", "vibrate", true)
                  createSwitch("Pop-up de touche", "Afficher l'indicateur", "popup", true, true)
                  root.addView(settingsCard)

                  val sizeTitle = TextView(this).apply { text = "Taille de la police / Clavier"; setTextColor(Color.parseColor("#6E6E73")); textSize = 14f; setPadding(20, 50, 0, 10) }
                  root.addView(sizeTitle)

                  val sizeCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.WHITE) }; setPadding(40, 40, 40, 40)
                  }
                  
                  val sizeSeekBar = SeekBar(this).apply {
                      max = 4; progress = prefs.getInt("kb_size", 2)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) { prefs.edit().putInt("kb_size", progress).apply() }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  sizeCard.addView(sizeSeekBar)
                  root.addView(sizeCard)

                  setContentView(scrollView)
              }
          }
          EOF

          # ---- لوحة المفاتيح ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.HorizontalScrollView
          import android.widget.PopupWindow
          import android.widget.Toast
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "EN"
              private var rootLayout: LinearLayout? = null
              private var keysContainer: LinearLayout? = null
              private var currentPopup: PopupWindow? = null
              private lateinit var vibrator: Vibrator
              
              private var aiButton: TextView? = null
              private val scope = CoroutineScope(Dispatchers.Main + Job())

              private val letterKeyViews = mutableListOf<TextView>()

              private var isLight = false
              private var bgColor = ""
              private var keyNormalColor = ""
              private var keySpecialColor = ""
              private var textColor = ""
              private var density: Float = 1f

              override fun onCreateInputView(): View {
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  density = resources.displayMetrics.density
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  isLight = prefs.getBoolean("light_theme", false)
                  bgColor = if (isLight) "#D1D4D9" else "#0A0C10"
                  keyNormalColor = if (isLight) "#FFFFFF" else "#43464D"
                  keySpecialColor = if (isLight) "#B3B8C1" else "#2C2F36"
                  textColor = if (isLight) "#000000" else "#FFFFFF"

                  window?.window?.navigationBarColor = Color.parseColor(bgColor)

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE; setColor(Color.parseColor(bgColor))
                          cornerRadii = floatArrayOf(24f*density, 24f*density, 24f*density, 24f*density, 0f, 0f, 0f, 0f)
                      }
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (45 * density).toInt())
                      setPadding((10*density).toInt(), 0, (10*density).toInt(), 0)
                  }
                  
                  fun addToolIcon(icon: String, weight: Float, action: () -> Unit) {
                      val btn = TextView(this).apply {
                          text = icon; textSize = 20f; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight)
                          setOnClickListener { vibrate(); action() }
                      }
                      toolbar.addView(btn)
                  }

                  addToolIcon("⚙️", 1f) { startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                  addToolIcon("📋", 1f) {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val textToPaste = clipboard.primaryClip?.getItemAt(0)?.text
                      if (textToPaste != null) currentInputConnection?.commitText(textToPaste, 1)
                  }
                  addToolIcon("😊", 1f) { isEmojiMode = !isEmojiMode; buildKeys() }
                  
                  toolbar.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) })
                  
                  aiButton = TextView(this).apply {
                      text = "✨ AI Reply"
                      setTextColor(Color.parseColor("#0A0C10")); textSize = 14f; paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (32 * density).toInt()).apply { setMargins(0,0,(10*density).toInt(),0) }
                      setPadding((15*density).toInt(), 0, (15*density).toInt(), 0)
                      setOnClickListener { 
                          vibrate()
                          generateAiResponse()
                      }
                  }
                  toolbar.addView(aiButton)
                  rootLayout?.addView(toolbar)

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(10, 10, 10, 10) }
                  }
                  rootLayout?.addView(keysContainer)

                  buildKeys()
                  return rootLayout!!
              }

              private fun generateAiResponse() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("api_key", "")
                  
                  if (apiKey.isNullOrEmpty()) {
                      Toast.makeText(this, "⚠️ Please enter your API Key in settings!", Toast.LENGTH_LONG).show()
                      return
                  }

                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""

                  aiButton?.text = "⏳ Typing..."
                  aiButton?.isEnabled = false
                  aiButton?.alpha = 0.7f

                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey")
                              val conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("Content-Type", "application/json")
                              conn.doOutput = true

                              val prompt = if (extractedText.isNotBlank()) {
                                  "You are an AI keyboard assistant. Read the following text and write a natural, friendly, and concise reply in the same language. Text: $extractedText"
                              } else {
                                  "Write a nice short greeting or icebreaker."
                              }

                              val payload = JSONObject().apply {
                                  put("contents", org.json.JSONArray().apply {
                                      put(JSONObject().apply {
                                          put("parts", org.json.JSONArray().apply {
                                              put(JSONObject().apply { put("text", prompt) })
                                          })
                                      })
                                  })
                              }

                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }

                          val reply = JSONObject(responseStr)
                              .getJSONArray("candidates")
                              .getJSONObject(0)
                              .getJSONObject("content")
                              .getJSONArray("parts")
                              .getJSONObject(0)
                              .getString("text")

                          withContext(Dispatchers.Main) {
                              ic.commitText("\n" + reply.trim() + " ✨\n", 1)
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              ic.commitText("\n[AI Error: Check API Key or Connection]\n", 1)
                          }
                      } finally {
                          aiButton?.text = "✨ AI Reply"
                          aiButton?.isEnabled = true
                          aiButton?.alpha = 1.0f
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }

              private fun vibrate() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vibrate", true)) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(20, 100))
                      else vibrator.vibrate(20)
                  }
              }

              private fun showPopup(keyView: View, text: String) {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("popup", true) || text.length > 1 || isEmojiMode) return
                  val popupView = TextView(this).apply {
                      this.text = text; textSize = 36f; setTextColor(Color.parseColor(textColor)); gravity = Gravity.CENTER
                      background = GradientDrawable().apply { setColor(Color.parseColor(keyNormalColor)); cornerRadius = 16f * density }
                      elevation = 10f
                  }
                  currentPopup = PopupWindow(popupView, (keyView.width * 1.5).toInt(), (keyView.height * 1.5).toInt()).apply {
                      isClippingEnabled = false
                      showAsDropDown(keyView, -(keyView.width * 0.25).toInt(), -(keyView.height * 2.2).toInt())
                  }
              }

              private fun updateKeysTextForShift() {
                  for (tv in letterKeyViews) {
                      val key = tv.tag as? String ?: continue
                      if (key.length == 1 && key.first().isLetter()) tv.text = if (isCaps && currentLang != "AR") key.uppercase() else key
                      else if (key == "SHIFT") tv.text = if (isCaps) "⇪" else "⇧"
                  }
              }

              private fun buildKeys() {
                  keysContainer?.removeAllViews()
                  letterKeyViews.clear()
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  val sizeMultiplier = 0.8f + (prefs.getInt("kb_size", 2) * 0.1f)
                  val baseKeyHeight = (62 * density * sizeMultiplier).toInt()

                  val rows = if (isEmojiMode) {
                      listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍"),
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌"),
                          listOf("ABC", "SPACE", "DEL", "ENTER")
                      )
                  } else if (isSymbols) {
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          "AR" -> listOf(
                              listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (rowKeys in rows) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight)
                      }
                      for (key in rowKeys) {
                          val keyView = TextView(this).apply {
                              tag = key
                              val displayText = when (key) {
                                  "SHIFT" -> if (isCaps) "⇪" else "⇧"
                                  "DEL" -> "⌫"
                                  "ENTER" -> "⏎"
                                  else -> if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                              }

                              text = displayText
                              textSize = if (isEmojiMode && key.length == 2) 28f else if (key == "🌐" || key == "?123" || key == "ABC") 15f else 24f
                              gravity = Gravity.CENTER
                              
                              val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              val keyBgColorStr = when (key) { "ENTER" -> "#007AFF"; else -> if (isSpecial) keySpecialColor else keyNormalColor }
                              val keyBgColor = Color.parseColor(keyBgColorStr)

                              setTextColor(Color.parseColor(if(key == "ENTER") "#FFFFFF" else textColor))
                              background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 12f * density; setColor(keyBgColor) }

                              val weight = when (key) { "SPACE" -> 4f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "🌐" -> 1.2f; else -> 1f }
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight)
                              lp.setMargins(6, (8*sizeMultiplier).toInt(), 6, (8*sizeMultiplier).toInt()); layoutParams = lp; isClickable = true

                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> {
                                          vibrate(); showPopup(v, text.toString())
                                          (v.background as GradientDrawable).setColor(Color.parseColor(if(isLight) "#B3B8C1" else "#5A5D66"))
                                          true
                                      }
                                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                          currentPopup?.dismiss(); currentPopup = null
                                          (v.background as GradientDrawable).setColor(keyBgColor)
                                          if (event.action == MotionEvent.ACTION_UP) handleKeyClick(key)
                                          true
                                      }
                                      else -> false
                                  }
                              }
                          }
                          letterKeyViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keysContainer?.addView(rowLayout)
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)) }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                      "SHIFT" -> { isCaps = !isCaps; updateKeysTextForShift() }
                      "?123" -> { isSymbols = true; isEmojiMode = false; buildKeys() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; buildKeys() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; buildKeys() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase6.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase6.1.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v6.1
          name: "AI Keyboard Pro - Phase 6.1 (Bug Fix)"
          body: "إصلاح خطأ استدعاء المكتبة View. التطبيق جاهز الآن مع عقل الذكاء الاصطناعي."
          files: release-output/AI-Keyboard-Pro-Phase6.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
