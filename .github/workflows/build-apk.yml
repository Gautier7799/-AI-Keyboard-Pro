name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Dynamic Island Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/layout app/src/main/java/com/dynamicisland/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.pro"; minSdk = 28; targetSdk = 34; versionCode = 66; versionName = "4.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- Colors ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="IosDarkCanvas">#121212</color>       
              <color name="IosDarkKeyNormal">#2C2C2E</color>    
              <color name="IosDarkKeyNormalPressed">#4C4C4E</color> 
              <color name="IosDarkKeyControl">#1C1C1E</color>   
              <color name="IosDarkKeyControlPressed">#3C3C3E</color>
              <color name="IosBlueAction">#007AFF</color>       
              <color name="IosBlueActionPressed">#005BB5</color>
              <color name="IosTextColor">#FFFFFF</color>        
              <color name="toolbar_bg">#2C2C2E</color>
              <color name="btn_bg">#2C2C2E</color>
              <color name="island_bg">#000000</color>
          </resources>
          EOF

          # ---- Drawables لواجهة التطبيق الجديدة المنظمة ----
          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/><corners android:radius="16dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_btn_primary.xml
