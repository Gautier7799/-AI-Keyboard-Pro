name: Build AI Keyboard Pro Ultimate

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Ultimate Keyboard Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 8; versionName = "8.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro</string>
              <string name="ime_name">iOS 26 Keyboard</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#007AFF" android:pathData="M34,54h40v10h-40zM34,34h40v10h-40zM34,74h20v10h-20z"/></vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/kb_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#101010" />
              <corners android:topLeftRadius="16dp" android:topRightRadius="16dp" />
          </shape>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="ar_AE" android:imeSubtypeMode="keyboard" />
              <subtype android:imeSubtypeLocale="fr_FR" android:imeSubtypeMode="keyboard" />
          </input-method>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.PopupWindow
          import android.widget.TextView

          class KeyboardService : InputMethodService() {
              private val iosKeyNormalBg = Color.parseColor("#3A3A3C") // لون خلفية الحروف أكثر وضوحاً
              private val iosKeyControlBg = Color.parseColor("#2C2C2E")
              private val iosActionBlueColor = Color.parseColor("#007AFF")
              private val iosTxtWhiteColor = Color.parseColor("#FFFFFF")
              
              private var isArabic = false
              private var keyHeightDp = 42f
              private lateinit var prefs: SharedPreferences
              private lateinit var vibrator: Vibrator
              
              private lateinit var headerContainer: FrameLayout
              private lateinit var predictionContainer: LinearLayout
              private lateinit var sliderContainer: View
              
              private val keyViews = mutableListOf<View>()
              private var popupWindow: PopupWindow? = null
              private var popupTextView: TextView? = null

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("kb_settings", Context.MODE_PRIVATE)
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              }

              override fun onCreateInputView(): View {
                  keyViews.clear()
                  keyHeightDp = prefs.getFloat("key_height", 42f)
                  val dp = resources.displayMetrics.density

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundResource(R.drawable.kb_background)
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding((4 * dp).toInt(), (8 * dp).toInt(), (4 * dp).toInt(), (8 * dp).toInt())
                  }

                  // شريط الأدوات بتصميم Material You (نفس فكرة Quick Settings بالصورة 3)
                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding((4 * dp).toInt(), 0, (4 * dp).toInt(), 0)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  
                  toolbar.addView(createQuickSettingPill("😊", "رموز") {})
                  toolbar.addView(createQuickSettingPill("✨", "ذكاء") { 
                      updatePredictions(listOf("🤖 جاري التفكير...", "تحليل...")) 
                  })
                  toolbar.addView(createQuickSettingPill("🎚️", "حجم") { 
                      toggleSlider() 
                  })
                  toolbar.addView(createQuickSettingPill("⚙️", "ضبط") { 
                      openSettings() 
                  })
                  rootLayout.addView(toolbar)
                  rootLayout.addView(Space((8 * dp).toInt())) // مسافة هندسية صريحة لمنع التداخل

                  // مساحة الهيدر التي ستحتوي إما الكلمات المقترحة أو شريط التكبير
                  headerContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (40 * dp).toInt())
                  }

                  predictionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  updatePredictions(if(isArabic) listOf("مرحبا", "نعم", "شكرا") else listOf("bonjour", "merci", "oui"))
                  
                  sliderContainer = createMaterialSlider(this, keyHeightDp, 35f, 65f) { newVal ->
                      keyHeightDp = newVal
                      prefs.edit().putFloat("key_height", newVal).apply()
                      val px = (newVal * dp).toInt()
                      keyViews.forEach { 
                          it.layoutParams.height = px
                          it.requestLayout()
                      }
                  }.apply { visibility = View.GONE }

                  headerContainer.addView(predictionContainer)
                  headerContainer.addView(sliderContainer)
                  rootLayout.addView(headerContainer)
                  rootLayout.addView(Space((8 * dp).toInt())) // مسافة صريحة قبل الحروف

                  val row1 = if(isArabic) listOf("ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د") else listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p")
                  val row2 = if(isArabic) listOf("ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط") else listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m")
                  val row3 = if(isArabic) listOf("ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ") else listOf("w", "x", "c", "v", "b", "n")
                  
                  rootLayout.addView(createKeysRow(row1))
                  rootLayout.addView(Space((10 * dp).toInt()))
                  rootLayout.addView(createKeysRow(row2, isSubRow = true))
                  rootLayout.addView(Space((10 * dp).toInt()))

                  val row3Container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  row3Container.addView(createSpecialKey("⇧", iosKeyControlBg, 1.2f))
                  row3Container.addView(createKeysRow(row3, isSubRow = true, weightSum = row3.size.toFloat()))
                  row3Container.addView(createSpecialKey("⌫", iosKeyControlBg, 1.2f).apply {
                      setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)) }
                  })
                  rootLayout.addView(row3Container)
                  rootLayout.addView(Space((10 * dp).toInt()))

                  val bottomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  bottomRow.addView(createSpecialKey("?123", iosKeyControlBg, 1.5f))
                  
                  bottomRow.addView(createSpecialKey("🌐", iosKeyControlBg, 1.2f).apply {
                      setOnClickListener { vibrate(); isArabic = !isArabic; setInputView(onCreateInputView()) }
                  })

                  bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", iosKeyNormalBg, 4f, 0.4f).apply {
                      setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1) }
                  })
                  bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 2f).apply {
                      setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                  })
                  rootLayout.addView(bottomRow)

                  return rootLayout
              }

              private fun vibrate() {
                  try { vibrator.vibrate(VibrationEffect.createOneShot(15, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }
              
              private fun toggleSlider() {
                  vibrate()
                  if (sliderContainer.visibility == View.VISIBLE) {
                      sliderContainer.visibility = View.GONE
                      predictionContainer.visibility = View.VISIBLE
                  } else {
                      sliderContainer.visibility = View.VISIBLE
                      predictionContainer.visibility = View.GONE
                      sliderContainer.requestLayout()
                  }
              }

              // تصميم كبسولات الأزرار مطابق للصورة 3
              private fun createQuickSettingPill(icon: String, text: String, onClick: () -> Unit): View {
                  val dp = resources.displayMetrics.density
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      background = getRoundRect(Color.parseColor("#2D322F"), 100f * dp)
                      layoutParams = LinearLayout.LayoutParams(0, (36 * dp).toInt(), 1f).apply {
                          setMargins((4*dp).toInt(), 0, (4*dp).toInt(), 0)
                      }
                      setPadding((8*dp).toInt(), 0, (8*dp).toInt(), 0)
                      
                      addView(TextView(context).apply {
                          this.text = icon
                          textSize = 14f
                          setTextColor(Color.parseColor("#BCEBCE"))
                      })
                      addView(Space((6*dp).toInt(), true))
                      addView(TextView(context).apply {
                          this.text = text
                          textSize = 12f
                          setTextColor(Color.parseColor("#E0E3E0"))
                          setTypeface(null, Typeface.BOLD)
                      })
                      setOnClickListener { onClick() }
                  }
              }

              private fun showPopup(view: View, char: String) {
                  val dp = resources.displayMetrics.density
                  if (popupWindow == null) {
                      popupTextView = TextView(this).apply {
                          textSize = 32f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          background = getRoundRect(Color.parseColor("#5A5A5C"), 8f * dp)
                          setPadding(0, 0, 0, (8 * dp).toInt())
                      }
                      popupWindow = PopupWindow(popupTextView, (view.width * 1.5).toInt(), (view.height * 1.8).toInt()).apply {
                          isClippingEnabled = false
                      }
                  }
                  popupTextView?.text = char
                  val location = IntArray(2)
                  view.getLocationOnScreen(location)
                  popupWindow?.showAtLocation(view, Gravity.NO_GRAVITY, location[0] - view.width/4, location[1] - (view.height * 1.2).toInt())
              }

              private fun dismissPopup() { popupWindow?.dismiss() }

              private fun updatePredictions(words: List<String>) {
                  predictionContainer.removeAllViews()
                  words.forEach { word ->
                      predictionContainer.addView(TextView(this).apply {
                          text = word
                          textSize = 16f
                          setTextColor(Color.argb((255 * 0.9f).toInt(), 255, 255, 255))
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      })
                  }
              }

              private fun createKeysRow(keys: List<String>, weightSum: Float = keys.size.toFloat(), isSubRow: Boolean = false): LinearLayout {
                  val dp = resources.displayMetrics.density
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = if (isSubRow) LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, weightSum)
                                     else LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  keys.forEachIndexed { index, char ->
                      row.addView(createKey(char))
                      if (index < keys.size - 1) row.addView(Space((4 * dp).toInt(), true))
                  }
                  if(isSubRow){ row.setPadding((12 * dp).toInt(), 0, (12 * dp).toInt(), 0) }
                  return row
              }

              private fun createKey(char: String): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = char
                      textSize = 21f
                      setTextColor(iosTxtWhiteColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), 1f)
                      background = getRoundRect(iosKeyNormalBg, 6f * dp)
                      isClickable = true
                      
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  vibrate()
                                  showPopup(v, char)
                                  v.background = getRoundRect(Color.LTGRAY, 6f * dp)
                                  (v as TextView).setTextColor(Color.BLACK)
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  dismissPopup()
                                  v.background = getRoundRect(iosKeyNormalBg, 6f * dp)
                                  (v as TextView).setTextColor(iosTxtWhiteColor)
                                  if (event.action == MotionEvent.ACTION_UP) currentInputConnection?.commitText(char, 1)
                              }
                          }
                          true
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun createSpecialKey(label: String, bgColor: Int, weight: Float, textAlpha: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = label
                      textSize = 16f
                      setTextColor(Color.argb((255 * textAlpha).toInt(), 255, 255, 255))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight).apply {
                          if (label != "?123" && label != "⇧") setMargins((4 * dp).toInt(), 0, 0, 0)
                      }
                      background = getRoundRect(bgColor, 6f * dp)
                      isClickable = true
                      setTypeface(null, if (label == "return") Typeface.BOLD else Typeface.NORMAL)
                      
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { vibrate(); v.alpha = 0.5f }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.alpha = 1f }
                          }
                          false
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun getRoundRect(bgColor: Int, radius: Float): GradientDrawable {
                  return GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(bgColor); cornerRadius = radius }
              }
              
              private fun createMaterialSlider(context: Context, currentVal: Float, min: Float, max: Float, onUpdate: (Float) -> Unit): View {
                  val dp = context.resources.displayMetrics.density
                  val containerHeight = (36 * dp).toInt()
                  
                  val bgCol = Color.parseColor("#2D322F")
                  val fillCol = Color.parseColor("#BCEBCE")
                  val iconCol = Color.parseColor("#102015")

                  val container = FrameLayout(context).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, containerHeight).apply {
                          setMargins((8*dp).toInt(), 0, (8*dp).toInt(), 0)
                      }
                      background = getRoundRect(bgCol, containerHeight / 2f)
                  }
                  
                  val fillView = View(context).apply {
                      layoutParams = FrameLayout.LayoutParams(containerHeight, ViewGroup.LayoutParams.MATCH_PARENT)
                      background = getRoundRect(fillCol, containerHeight / 2f)
                  }
                  
                  // تم إضافة نص توضيحي داخل الشريط
                  val textLabel = TextView(context).apply {
                      text = "الحجم: ${currentVal.toInt()}"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setTypeface(null, Typeface.BOLD)
                  }

                  val icon = TextView(context).apply {
                      text = "↔"
                      textSize = 18f
                      setTextColor(iconCol)
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(containerHeight, ViewGroup.LayoutParams.MATCH_PARENT)
                  }

                  container.addView(fillView)
                  container.addView(textLabel)
                  container.addView(icon)

                  var currentWidth = currentVal

                  fun updateFillWidth(totalWidth: Int) {
                      if (totalWidth <= 0) return
                      val progress = ((currentWidth - min) / (max - min)).coerceIn(0f, 1f)
                      val fillWidth = (containerHeight + progress * (totalWidth - containerHeight)).toInt()
                      fillView.layoutParams = FrameLayout.LayoutParams(fillWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                      textLabel.text = "الحجم: ${currentWidth.toInt()}"
                  }

                  container.addOnLayoutChangeListener { _, left, _, right, _, oldLeft, _, oldRight, _ ->
                      val width = right - left
                      val oldWidth = oldRight - oldLeft
                      if (width > 0 && width != oldWidth) {
                          updateFillWidth(width)
                      }
                  }
                  container.post { updateFillWidth(container.width) }

                  container.setOnTouchListener { v, event ->
                      val totalWidth = v.width
                      if (totalWidth <= 0) return@setOnTouchListener false
                      var newWidth = event.x.toInt()
                      if (newWidth < containerHeight) newWidth = containerHeight
                      if (newWidth > totalWidth) newWidth = totalWidth
                      
                      fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                      
                      val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                      currentWidth = min + (progress * (max - min))
                      textLabel.text = "الحجم: ${currentWidth.toInt()}"
                      onUpdate(currentWidth)
                      true
                  }
                  return container
              }

              private fun Space(size: Int, isHorizontal: Boolean = false): View {
                  return View(this).apply { layoutParams = if (isHorizontal) LinearLayout.LayoutParams(size, 1) else LinearLayout.LayoutParams(1, size) }
              }
              
              private fun openSettings() {
                  startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import android.graphics.Color
          import android.view.Gravity
          import android.graphics.drawable.GradientDrawable
          import android.view.ViewGroup
          import android.view.View
          import android.widget.FrameLayout

          class MainActivity : AppCompatActivity() {
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("kb_settings", Context.MODE_PRIVATE)
                  val dp = resources.displayMetrics.density

                  val isS = android.os.Build.VERSION.SDK_INT >= 31
                  val bgDarkGreen = if(isS) resources.getColor(android.R.color.system_neutral1_900, theme) else Color.parseColor("#171C18")
                  val pillLightGreen = if(isS) resources.getColor(android.R.color.system_accent1_200, theme) else Color.parseColor("#BCEBCE")
                  val pillDarkGray = if(isS) resources.getColor(android.R.color.system_neutral2_800, theme) else Color.parseColor("#2E322F")
                  val textOnLight = if(isS) resources.getColor(android.R.color.system_accent1_900, theme) else Color.parseColor("#102015")
                  val textOnDark = if(isS) resources.getColor(android.R.color.system_neutral1_100, theme) else Color.parseColor("#E0E3E0")

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgDarkGreen)
                      setPadding((24*dp).toInt(), (48*dp).toInt(), (24*dp).toInt(), (24*dp).toInt())
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  root.addView(TextView(this).apply { 
                      text = "AI Keyboard"
                      textSize = 36f
                      setTextColor(textOnDark)
                      setPadding(0, 0, 0, (40*dp).toInt())
                      typeface = android.graphics.Typeface.DEFAULT_BOLD 
                  })
                  
                  val heightLabel = TextView(this).apply { 
                      text = "حجم الكيبورد: ${prefs.getFloat("key_height", 42f).toInt()} dp"
                      textSize = 18f
                      setTextColor(textOnDark)
                      gravity = Gravity.START
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                          setMargins(0, 0, 0, (8*dp).toInt())
                      }
                  }
                  root.addView(heightLabel)
                  
                  val slider = createMaterialSlider(this, prefs.getFloat("key_height", 42f), 35f, 65f, pillDarkGray, pillLightGreen, textOnLight) { newVal ->
                      heightLabel.text = "حجم الكيبورد: ${newVal.toInt()} dp"
                      prefs.edit().putFloat("key_height", newVal).apply()
                  }
                  root.addView(slider)

                  fun createMaterialPill(icon: String, text: String, isActive: Boolean, onClick: () -> Unit): LinearLayout {
                      val pill = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          background = GradientDrawable().apply { setColor(if(isActive) pillLightGreen else pillDarkGray); cornerRadius = 100f * dp }
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (72*dp).toInt()).apply { setMargins(0,0,0,(16*dp).toInt()) }
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding((24*dp).toInt(), 0, (24*dp).toInt(), 0)
                          setOnClickListener { onClick() }
                      }
                      pill.addView(TextView(this).apply { 
                          this.text = icon
                          textSize = 28f
                          setTextColor(if(isActive) textOnLight else textOnDark)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0,0,(16*dp).toInt(),0) } 
                      })
                      pill.addView(TextView(this).apply { 
                          this.text = text
                          textSize = 20f
                          setTextColor(if(isActive) textOnLight else textOnDark)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD 
                      })
                      return pill
                  }

                  root.addView(createMaterialPill("⌨️", "1. تفعيل الكيبورد", false) { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) })
                  root.addView(createMaterialPill("✅", "2. اختياره كافتراضي", true) { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() })
                  
                  setContentView(root)
              }
              
              private fun createMaterialSlider(context: Context, currentVal: Float, min: Float, max: Float, bgCol: Int, fillCol: Int, iconCol: Int, onUpdate: (Float) -> Unit): View {
                  val dp = context.resources.displayMetrics.density
                  val containerHeight = (64 * dp).toInt()
                  val container = FrameLayout(context).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, containerHeight).apply {
                          setMargins(0, 0, 0, (40*dp).toInt())
                      }
                      background = GradientDrawable().apply { setColor(bgCol); cornerRadius = containerHeight / 2f }
                  }
                  
                  val fillView = View(context).apply {
                      layoutParams = FrameLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT)
                      background = GradientDrawable().apply { setColor(fillCol); cornerRadius = containerHeight / 2f }
                  }
                  
                  val icon = TextView(context).apply {
                      text = "↔"
                      textSize = 24f
                      setTextColor(iconCol)
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(containerHeight, ViewGroup.LayoutParams.MATCH_PARENT)
                  }

                  container.addView(fillView)
                  container.addView(icon)

                  var currentWidth = currentVal

                  fun updateFillWidth(totalWidth: Int) {
                      if (totalWidth <= 0) return
                      val progress = ((currentWidth - min) / (max - min)).coerceIn(0f, 1f)
                      val fillWidth = (containerHeight + progress * (totalWidth - containerHeight)).toInt()
                      fillView.layoutParams = FrameLayout.LayoutParams(fillWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                  }

                  container.addOnLayoutChangeListener { _, left, _, right, _, oldLeft, _, oldRight, _ ->
                      val width = right - left
                      val oldWidth = oldRight - oldLeft
                      if (width > 0 && width != oldWidth) {
                          updateFillWidth(width)
                      }
                  }
                  container.post { updateFillWidth(container.width) }

                  container.setOnTouchListener { v, event ->
                      val totalWidth = v.width
                      if (totalWidth <= 0) return@setOnTouchListener false
                      var newWidth = event.x.toInt()
                      if (newWidth < containerHeight) newWidth = containerHeight
                      if (newWidth > totalWidth) newWidth = totalWidth
                      
                      fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                      
                      val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                      currentWidth = min + (progress * (max - min))
                      onUpdate(currentWidth)
                      true
                  }
                  return container
              }
          }
