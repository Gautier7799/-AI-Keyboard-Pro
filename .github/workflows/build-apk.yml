          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_special_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_special_pressed" /><item android:drawable="@drawable/bg_key_special" /></selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_key_return.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="@color/key_special_shadow"/><corners android:radius="5dp"/></shape></item><item android:bottom="1dp"><shape><solid android:color="@color/key_return_bg"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_return_pressed.xml
