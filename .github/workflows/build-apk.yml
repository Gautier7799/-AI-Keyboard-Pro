name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 3; versionName = "2.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro</string>
              <string name="ime_name">AI Keyboard Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0A0C10"))
                      setPadding(60, 60, 60, 60)
                  }

                  val title = TextView(this).apply {
                      text = "AI Keyboard Pro ✨\n(iOS Style & Languages)"
                      setTextColor(Color.WHITE)
                      textSize = 24f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 100)
                  }
                  
                  fun createButton(textStr: String, action: () -> Unit): Button {
                      return Button(this).apply {
                          text = textStr
                          setTextColor(Color.parseColor("#003258"))
                          textSize = 16f
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              cornerRadius = 100f
                              setColor(Color.parseColor("#9ECAFF"))
                          }
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 160).apply {
                              setMargins(0, 0, 0, 40)
                          }
                          setOnClickListener { action() }
                      }
                  }

                  val btnEnable = createButton("1. تفعيل لوحة المفاتيح") { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  val btnSelect = createButton("2. اختيار اللوحة الآن") { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }

                  root.addView(title); root.addView(btnEnable); root.addView(btnSelect)
                  setContentView(root)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.widget.HorizontalScrollView

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var currentLang = "EN" // EN, AR, FR
              private var rootLayout: LinearLayout? = null
              private var keysContainer: LinearLayout? = null

              override fun onCreateInputView(): View {
                  val density = resources.displayMetrics.density

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      // تصميم iOS: زوايا علوية دائرية فقط، وأسفل مسطح
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(Color.parseColor("#0A0C10"))
                          cornerRadii = floatArrayOf(
                              50f * density, 50f * density, // أعلى اليسار
                              50f * density, 50f * density, // أعلى اليمين
                              0f, 0f, // أسفل اليمين
                              0f, 0f  // أسفل اليسار
                          )
                      }
                      // إزالة المسافة السفلية ليلتصق بالشاشة
                      setPadding(0, 20, 0, 0) 
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  // شريط الاقتراحات (Suggestions Bar) شفاف ومندمج
                  val suggestionsBar = HorizontalScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (45 * density).toInt())
                      isFillViewport = true
                      isHorizontalScrollBarEnabled = false
                      setBackgroundColor(Color.TRANSPARENT)
                  }
                  
                  val suggestionsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setPadding(20, 0, 20, 0)
                  }
                  
                  val dummySuggestions = listOf("مرحباً", "كيف حالك؟", "أنا قادم", "✨ AI Reply")
                  for (word in dummySuggestions) {
                      val tv = TextView(this).apply {
                          text = word
                          setTextColor(Color.parseColor("#F0F3FA"))
                          textSize = 15f
                          setPadding(40, 0, 40, 0)
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          isClickable = true
                          setOnClickListener {
                              currentInputConnection?.commitText("$word ", 1)
                              it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          }
                      }
                      if(word.contains("✨")) tv.setTextColor(Color.parseColor("#34D399"))
                      suggestionsContainer.addView(tv)
                      
                      if (word != dummySuggestions.last()) {
                          val divider = View(this).apply {
                              layoutParams = LinearLayout.LayoutParams((1 * density).toInt(), (20 * density).toInt()).apply { setMargins(10, 0, 10, 0) }
                              setBackgroundColor(Color.parseColor("#222731"))
                          }
                          suggestionsContainer.addView(divider)
                      }
                  }
                  suggestionsBar.addView(suggestionsContainer)
                  rootLayout?.addView(suggestionsBar)

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          setMargins(10, 20, 10, 10)
                      }
                  }
                  rootLayout?.addView(keysContainer)

                  buildKeys()
                  return rootLayout!!
              }

              private fun buildKeys() {
                  keysContainer?.removeAllViews()
                  val density = resources.displayMetrics.density

                  val rows = if (isSymbols) {
                      // لوحة الأرقام والرموز
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          "AR" -> listOf(
                              listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf( // AZERTY
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                          else -> listOf( // EN QWERTY
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (rowKeys in rows) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                          // تكبير حجم الأزرار (أطول قليلاً)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (62 * density).toInt())
                      }
                      for (key in rowKeys) {
                          val keyView = TextView(this).apply {
                              text = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key
                              textSize = if (key.length > 1 || key == "🌐") 15f else 22f
                              gravity = Gravity.CENTER
                              
                              val isSpecial = key.length > 1 || key == "🌐"
                              val keyBgColor = when (key) {
                                  "AI ✨" -> Color.parseColor("#1C202B")
                                  "ENTER" -> Color.parseColor("#007AFF") // أزرق ساطع مثل iOS
                                  else -> if (isSpecial) Color.parseColor("#2C2F36") else Color.parseColor("#43464D")
                              }
                              val keyTextColor = when (key) {
                                  "AI ✨" -> Color.parseColor("#34D399")
                                  else -> Color.parseColor("#FFFFFF")
                              }

                              setTextColor(keyTextColor)
                              background = GradientDrawable().apply {
                                  shape = GradientDrawable.RECTANGLE
                                  // حواف مربعة ناعمة (12dp) مثل iOS بدلاً من الحبوب
                                  cornerRadius = 12f * density
                                  setColor(keyBgColor)
                              }

                              val weight = when (key) {
                                  "SPACE" -> 4f
                                  "ENTER" -> 1.8f
                                  "SHIFT", "DEL", "?123", "ABC" -> 1.5f
                                  "AI ✨", "🌐" -> 1.2f
                                  else -> 1f
                              }
                              
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight)
                              lp.setMargins(6, 8, 6, 8) 
                              layoutParams = lp
                              isClickable = true

                              setOnClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  handleKeyClick(key)
                              }
                          }
                          rowLayout.addView(keyView)
                      }
                      keysContainer?.addView(rowLayout)
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> ic.deleteSurroundingText(1, 0)
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> {
                          ic.performEditorAction(android.view.inputmethod.EditorInfo.IME_ACTION_GO)
                          ic.commitText("\n", 1)
                      }
                      "SHIFT" -> { isCaps = !isCaps; buildKeys() }
                      "?123" -> { isSymbols = true; buildKeys() }
                      "ABC" -> { isSymbols = false; buildKeys() }
                      "🌐" -> {
                          currentLang = when(currentLang) {
                              "EN" -> "AR"
                              "AR" -> "FR"
                              else -> "EN"
                          }
                          buildKeys() // إعادة بناء اللوحة باللغة الجديدة
                      }
                      "AI ✨" -> { ic.commitText(" [AI Magic!] ", 1) }
                      else -> {
                          val letter = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase2.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v2.0
          name: "AI Keyboard Pro - Phase 2 (iOS Style)"
          body: "1. زوايا علوية دائرية وأسفل مسطح.\n2. أزرار مستطيلة بحواف ناعمة (12dp) وتكبير حجم اللوحة.\n3. إضافة لغات (عربية، فرنسية AZERTY، إنجليزية).\n4. إضافة لوحة الأرقام والرموز (?123)."
          files: release-output/AI-Keyboard-Pro-Phase2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
