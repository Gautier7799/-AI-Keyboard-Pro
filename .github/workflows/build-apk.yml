          # ---- الأيقونات ----
          cat << 'EOF' > app/src/main/res/drawable/ic_globe.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12.01,2C6.48,2 2,6.48 2,12s4.48,10 10.01,10C17.52,22 22,17.52 22,12S17.52,2 12.01,2ZM18.94,8H15.61c-0.27,-1.59 -0.74,-3.09 -1.37,-4.43C16.14,4.28 17.81,5.88 18.94,8ZM12.01,4.04c0.82,1.38 1.45,2.95 1.77,4.64h-3.53C10.57,6.99 11.19,5.42 12.01,4.04ZM4.26,14c-0.15,-0.64 -0.25,-1.31 -0.25,-2s0.1,-1.36 0.25,-2h3.9c-0.06,0.65 -0.1,1.32 -0.1,2s0.04,1.35 0.1,2H4.26ZM5.06,16h3.32c0.27,1.59 0.74,3.09 1.37,4.43C7.86,19.72 6.19,18.12 5.06,16ZM5.06,8h3.32c0.27,-1.59 0.74,-3.09 1.37,-4.43C7.86,4.28 6.19,5.88 5.06,8ZM12.01,19.96c-0.82,-1.38 -1.45,-2.95 -1.77,-4.64h3.53C13.44,17.01 12.82,18.58 12.01,19.96ZM14.07,14H9.94c-0.06,-0.65 -0.1,-1.32 -0.1,-2s0.04,-1.35 0.1,-2h4.13c0.06,0.65 0.1,1.32 0.1,2S14.13,13.35 14.07,14ZM14.25,20.43c0.63,-1.34 1.1,-2.84 1.37,-4.43h3.32C17.81,18.12 16.14,19.72 14.25,20.43ZM15.84,14c0.06,-0.65 0.1,-1.32 0.1,-2s-0.04,-1.35 -0.1,-2h3.9c0.15,0.64 0.25,1.31 0.25,2s-0.1,1.36 -0.25,2H15.84Z"/></vector>
