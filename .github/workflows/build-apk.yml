          # ---- Dashboard Activity (Fixed Opening Lag by removing ObjectAnimator) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  findViewById<Button>(R.id.btn_enable).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  findViewById<Button>(R.id.btn_select).setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  
                  val inputApi = findViewById<EditText>(R.id.input_api_key)
                  inputApi.setText(prefs.getString("api_key", ""))
                  findViewById<Button>(R.id.btn_save_api).setOnClickListener { 
                      prefs.edit().putString("api_key", inputApi.text.toString()).apply()
                      Toast.makeText(this, "تم حفظ المفتاح بنجاح! ✨", Toast.LENGTH_SHORT).show() 
                  }
                  
                  val switchVibrate = findViewById<Switch>(R.id.switch_vibrate)
                  switchVibrate.isChecked = prefs.getBoolean("vibrate", true)
                  switchVibrate.setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean("vibrate", isChecked).apply() }
              }
          }
          EOF

          # ---- Keyboard Service (Zero-Allocation Prediction Engine) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.widget.ScrollView
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "AR"
              
              private lateinit var rootFrame: FrameLayout
              private lateinit var mainLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var menuContainer: ScrollView
              private lateinit var keyPreviewBubble: TextView
              
              private lateinit var sug1: TextView
              private lateinit var sug2: TextView
              private lateinit var sug3: TextView
              
              private lateinit var prefs: SharedPreferences
              private lateinit var vibrator: Vibrator
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              
              private val keyViews = ArrayList<ArrayList<TextView>>()

              // القاموس الذكي المدمج
              private val arDict = arrayOf("السلام", "عليكم", "مرحبا", "كيف", "حالك", "شكرا", "صباح", "الخير", "مساء", "الحمد", "لله", "اليوم", "غدا", "الآن", "ممكن", "عفوا", "جميل", "جدا", "رائع", "إن", "شاء", "الله", "نعم", "لا")
              private val enDict = arrayOf("hello", "how", "are", "you", "good", "morning", "night", "thanks", "thank", "please", "what", "time", "this", "that", "there", "their", "have", "been", "would", "could", "should")
              private val frDict = arrayOf("bonjour", "comment", "merci", "salut", "bien", "très", "avec", "pour", "dans", "faire", "dire", "aller", "voir", "vouloir", "venir", "devoir", "pouvoir")

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  density = resources.displayMetrics.density
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val sugColorInt = ContextCompat.getColor(this, R.color.suggestion_text)
                  window?.window?.navigationBarColor = bgColor

                  rootFrame = FrameLayout(this).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.TRANSPARENT) 
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (48 * density).toInt())
                      setPadding((4*density).toInt(), 0, (4*density).toInt(), 0)
                  }
                  mainLayout.addView(toolbar)
                  
                  fun addMaterialIcon(iconResId: Int, bgResId: Int, action: () -> Unit) {
                      val img = ImageView(this).apply {
                          setImageResource(iconResId); setBackgroundResource(bgResId)
                          val size = (26 * density).toInt() 
                          layoutParams = LinearLayout.LayoutParams(size, size).apply { setMargins(0, 0, (6*density).toInt(), 0) }
                          val p = (5 * density).toInt()
                          setPadding(p, p, p, p)
                          setOnClickListener { vibrate(); action() }
                      }
                      toolbar.addView(img)
                  }

                  addMaterialIcon(R.drawable.ic_gear_colored, R.drawable.bg_icon_settings) { toggleMenu() }
                  addMaterialIcon(R.drawable.ic_smile_colored, R.drawable.bg_icon_emoji) { isEmojiMode = !isEmojiMode; refreshKeysData() }
                  
                  val suggestionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      gravity = Gravity.CENTER
                  }
                  
                  fun createSugView(): TextView {
                      return TextView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          gravity = Gravity.CENTER
                          textSize = 15f
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(sugColorInt)
                          isClickable = true
                          setOnClickListener { applySuggestion(this.text.toString()); vibrate() }
                      }
                  }
                  
                  sug1 = createSugView()
                  sug2 = createSugView()
                  sug3 = createSugView()
                  
                  suggestionContainer.addView(sug1)
                  suggestionContainer.addView(sug2)
                  suggestionContainer.addView(sug3)
                  toolbar.addView(suggestionContainer)
                  
                  val aiButton = TextView(this).apply {
                      text = "AI✨"
                      setTextColor(Color.WHITE); textSize = 12f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (30 * density).toInt()).apply { setMargins((6*density).toInt(), 0, 0, 0) }
                      setPadding((12*density).toInt(), 0, (12*density).toInt(), 0)
                      setOnClickListener { vibrate(); generateAiResponse(this) }
                  }
                  toolbar.addView(aiButton)

                  keysContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(6, 6, 6, (12*density).toInt()) } }
                  menuContainer = ScrollView(this).apply { visibility = View.GONE; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  
                  val menuGrid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding((20*density).toInt(), (10*density).toInt(), (20*density).toInt(), (20*density).toInt()) }
                  fun addMenuOption(title: String, iconRes: Int, action: () -> Unit) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          setBackgroundResource(R.drawable.bg_menu_pill)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (52 * density).toInt()).apply { setMargins(0, 0, 0, (12 * density).toInt()) }
                          setPadding((16 * density).toInt(), 0, (16 * density).toInt(), 0)
                          setOnClickListener { vibrate(); action() }
                      }
                      row.addView(ImageView(this).apply { setImageResource(iconRes); setColorFilter(textColorInt); layoutParams = LinearLayout.LayoutParams((24 * density).toInt(), (24 * density).toInt()).apply { setMargins(0, 0, (16 * density).toInt(), 0) } })
                      row.addView(TextView(this).apply { text = title; textSize = 16f; setTextColor(textColorInt); typeface = Typeface.DEFAULT_BOLD })
                      menuGrid.addView(row)
                  }
                  
                  addMenuOption("لصق نص من الحافظة", R.drawable.ic_paste_colored) { 
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val textToPaste = clipboard.primaryClip?.getItemAt(0)?.text
                      if (textToPaste != null) currentInputConnection?.commitText(textToPaste, 1)
                      toggleMenu()
                  }
                  addMenuOption("تكبير الكيبورد", R.drawable.ic_menu_size_up) { var s = prefs.getInt("kb_size", 2); if(s<4) s++; prefs.edit().putInt("kb_size", s).apply(); rebuildKeysLayout() }
                  addMenuOption("تصغير الكيبورد", R.drawable.ic_menu_size_down) { var s = prefs.getInt("kb_size", 2); if(s>0) s--; prefs.edit().putInt("kb_size", s).apply(); rebuildKeysLayout() }
                  addMenuOption("الرجوع للوحة", R.drawable.ic_menu_back) { toggleMenu() }
                  menuContainer.addView(menuGrid)
                  
                  mainLayout.addView(keysContainer)
                  mainLayout.addView(menuContainer)
                  
                  keyPreviewBubble = TextView(this).apply {
                      textSize = 36f; setTextColor(textColorInt); gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 6f * density; visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams((55 * density).toInt(), (65 * density).toInt())
                  }

                  rootFrame.addView(mainLayout)
                  rootFrame.addView(keyPreviewBubble)

                  rebuildKeysLayout()
                  return rootFrame
              }

              // ---- دالة ذكية خفيفة جداً بدون Regex لاستخراج الكلمة الحالية ----
              private fun extractCurrentWord(): String {
                  val ic = currentInputConnection ?: return ""
                  val textBefore = ic.getTextBeforeCursor(30, 0)?.toString() ?: return ""
                  var lastSpaceIndex = -1
                  for (i in textBefore.indices.reversed()) {
                      val c = textBefore[i]
                      if (c == ' ' || c == '\n' || c == '.' || c == '،' || c == '!' || c == '؟' || c == ',') {
                          lastSpaceIndex = i
                          break
                      }
                  }
                  return if (lastSpaceIndex == -1) textBefore else textBefore.substring(lastSpaceIndex + 1)
              }

              // ---- تحديث الاقتراحات بدون استهلاك ذاكرة (Zero Allocation Array Search) ----
              private fun updateSuggestions() {
                  if(!this::sug1.isInitialized) return
                  val word = extractCurrentWord()
                  if (word.length < 2 || isEmojiMode) {
                      sug1.text = ""; sug2.text = ""; sug3.text = ""
                      return
                  }
                  
                  val dict = when(currentLang) { "AR" -> arDict; "FR" -> frDict; else -> enDict }
                  var count = 0
                  val matches = arrayOf("", "", "")
                  
                  for (item in dict) {
                      if (item.length > word.length && item.startsWith(word, ignoreCase = true)) {
                          matches[count] = item
                          count++
                          if (count == 3) break
                      }
                  }
                  
                  sug1.text = matches[0]; sug2.text = matches[1]; sug3.text = matches[2]
              }

              private fun applySuggestion(sug: String) {
                  if (sug.isEmpty()) return
                  val word = extractCurrentWord()
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(word.length, 0)
                  ic.commitText(sug + " ", 1)
                  updateSuggestions()
              }

              private fun toggleMenu() {
                  if (keysContainer.visibility == View.VISIBLE) { keysContainer.visibility = View.GONE; menuContainer.visibility = View.VISIBLE } 
                  else { keysContainer.visibility = View.VISIBLE; menuContainer.visibility = View.GONE }
              }

              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  keyViews.clear()
                  val sizeMultiplier = 1.0f + (prefs.getInt("kb_size", 2) * 0.1f) 
                  val baseKeyHeight = (50 * density * sizeMultiplier).toInt() 
                  
                  for (r in 0 until 4) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight) }
                      val rowViews = ArrayList<TextView>()
                      for (c in 0 until 12) {
                          val keyView = TextView(this).apply {
                              gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { setMargins(4, (4*sizeMultiplier).toInt(), 4, (4*sizeMultiplier).toInt()) }
                              layoutParams = lp; isClickable = true; elevation = 1f * density
                              
                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> { 
                                          v.isPressed = true; vibrate()
                                          val txt = (v as TextView).text.toString()
                                          if (txt.length == 1 && !isEmojiMode) {
                                              val loc = IntArray(2); v.getLocationInWindow(loc)
                                              val rootLoc = IntArray(2); rootFrame.getLocationInWindow(rootLoc)
                                              keyPreviewBubble.text = txt
                                              keyPreviewBubble.x = (loc[0] - rootLoc[0]).toFloat() - (keyPreviewBubble.layoutParams.width - v.width) / 2f
                                              keyPreviewBubble.y = (loc[1] - rootLoc[1]).toFloat() - keyPreviewBubble.layoutParams.height + (8*density)
                                              keyPreviewBubble.visibility = View.VISIBLE
                                          }
                                          true 
                                      }
                                      MotionEvent.ACTION_UP -> { 
                                          v.isPressed = false; keyPreviewBubble.visibility = View.GONE
                                          handleKeyClick(tag as String); true 
                                      }
                                      MotionEvent.ACTION_CANCEL -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; true }
                                      else -> false
                                  }
                              }
                          }
                          rowViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keyViews.add(rowViews)
                      keysContainer.addView(rowLayout)
                  }
                  refreshKeysData()
              }

              private fun refreshKeysData() {
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val rowsData = if (isEmojiMode) {
                      listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍"),
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌"),
                          listOf("ABC", "SPACE", "DEL", "ENTER")
                      )
                  } else if (isSymbols) {
                      if (currentLang == "AR") {
                          listOf(
                              listOf("١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "٠"),
                              listOf("@", "#", "﷼", "_", "&", "-", "+", "(", ")", "/"),
                              listOf("=", "*", "\"", "'", ":", "؛", "!", "؟", "DEL"),
                              listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                          )
                      } else {
                          listOf(
                              listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                              listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                              listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                              listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  } else {
                      when (currentLang) {
                          "AR" -> if (isCaps) listOf(
                                  listOf("َ", "ً", "ُ", "ٌ", "ِ", "ٍ", "ّ", "ْ", "ه", "خ", "ح", "ج"),
                                  listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط", "د"),
                                  listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                                  listOf("?123", "🌐", "SPACE", ".", "ENTER")
                              ) else listOf(
                                  listOf("ذ", "ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج"),
                                  listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط", "د"),
                                  listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                                  listOf("?123", "🌐", "SPACE", ".", "ENTER")
                              )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (r in 0 until 4) {
                      val dataRow = if (r < rowsData.size) rowsData[r] else emptyList()
                      val viewRow = keyViews[r]
                      for (c in 0 until 12) {
                          val view = viewRow[c]
                          if (c < dataRow.size) {
                              val key = dataRow[c]
                              view.visibility = View.VISIBLE
                              view.tag = key
                              val displayText = when (key) { "SHIFT" -> if (isCaps) "⇪" else "⇧"; "DEL" -> "⌫"; "ENTER" -> "⏎"; else -> if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key }
                              view.text = displayText
                              view.textSize = if (isEmojiMode && key.length == 2) 28f else if (key == "🌐" || key == "?123" || key == "ABC") 14f else 22f
                              
                              val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              view.setBackgroundResource(when { key == "ENTER" -> R.drawable.key_enter_selector; isSpecial -> R.drawable.key_special_selector; else -> R.drawable.key_selector })
                              view.setTextColor(if(key == "ENTER") Color.WHITE else textColorInt)
                              
                              val weight = when (key) { "SPACE" -> 4.5f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "🌐" -> 1.2f; else -> 1f }
                              (view.layoutParams as LinearLayout.LayoutParams).weight = weight
                          } else {
                              view.visibility = View.GONE
                          }
                      }
                  }
                  // تحديث الاقتراحات فقط عند تغيير اللغة
                  updateSuggestions()
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)) }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                      "SHIFT" -> { isCaps = !isCaps; refreshKeysData() }
                      "?123" -> { isSymbols = true; isEmojiMode = false; refreshKeysData() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; refreshKeysData() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; refreshKeysData() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                          if (isCaps) { isCaps = false; refreshKeysData() }
                      }
                  }
                  
                  // الكود السحري: نحدث الاقتراحات فقط عند الضغط على زر جديد أو المسح بدلاً من طوال الوقت!
                  if (key == "DEL" || key.length == 1) {
                      updateSuggestions()
                  }
              }

              private fun vibrate() {
                  if (!prefs.getBoolean("vibrate", true)) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) { vibrator.vibrate(VibrationEffect.createOneShot(12, VibrationEffect.DEFAULT_AMPLITUDE)) } 
                      else { @Suppress("DEPRECATION") vibrator.vibrate(12) }
                  } catch (e: Exception) {}
              }

              private fun generateAiResponse(btn: TextView) {
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ ضع المفتاح في الإعدادات أولاً", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  btn.text = "⏳"; btn.isEnabled = false; btn.alpha = 0.7f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = if (extractedText.isNotBlank()) "You are an AI keyboard assistant. Reply naturally to: $extractedText" else "Write a short greeting."
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          withContext(Dispatchers.Main) { ic.commitText("\n" + reply.trim() + " ✨\n", 1) }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { ic.commitText("\n[AI Error]\n", 1) } } 
                      finally { btn.text = "AI✨"; btn.isEnabled = true; btn.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase22.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase22.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v22.0
          name: "AI Keyboard Pro - Phase 22 (Zero-Lag Prediction Fix ⚡)"
          body: "1. إصلاح مشكلة اللاج الخطيرة التي ظهرت في التنبؤات (عبر إزالة الـ Regex واستخدام خوارزمية Zero-Allocation).\n2. إيقاف تحديث الكلمات المستمر بدون داعٍ، وجعل الكيبورد يقرأ الحروف فقط عند الضغط عليها لضمان صفر استهلاك للمعالج.\n3. إزالة التأثيرات الجمالية الثقيلة من واجهة التطبيق لضمان سرعة خرافية في فتح التطبيق."
          files: release-output/AI-Keyboard-Pro-Phase22.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
