              // هيكل البيانات الجديد للتحكم بأحجام الفراغات بدقة متناهية
              data class KeyDef(val label: String, val weight: Float)
              data class LayoutData(val weightSum: Float, val rows: List<List<KeyDef>>)

              override fun onCreate() {
                  super.onCreate()
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.addPrimaryClipChangedListener {
                      val clip = clipboard.primaryClip
                      if (clip != null && clip.itemCount > 0) {
                          val text = clip.getItemAt(0).text?.toString()
                          if (!text.isNullOrEmpty()) {
                              val p = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                              val historyStr = p.getString("clip_history", "") ?: ""
                              val history = historyStr.split("|||").filter { it.isNotBlank() }.toMutableList()
                              history.remove(text)
                              history.add(0, text)
                              if (history.size > 10) history.removeAt(history.size - 1)
                              p.edit().putString("clip_history", history.joinToString("|||")).apply()
                          }
                      }
                  }
              }

