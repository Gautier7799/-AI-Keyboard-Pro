name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/layout app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 45; versionName = "38.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- الألوان (مطابقة لـ iOS 100%) ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="keyboard_bg">#D1D5DB</color>
              <color name="key_bg">#FFFFFF</color>
              <color name="key_shadow">#898A8D</color>
              <color name="key_bg_pressed">#E5E5EA</color>
              <color name="key_special_bg">#B3B8C2</color>
              <color name="key_special_shadow">#898A8D</color>
              <color name="key_special_bg_pressed">#9AA0AB</color>
              <color name="key_text">#000000</color>
              <color name="suggestion_text">#3C3C43</color>
              <color name="ios_blue">#007AFF</color>
              <color name="toolbar_icon">#555555</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="keyboard_bg">#1C1C1E</color>
              <color name="key_bg">#48484A</color>
              <color name="key_shadow">#000000</color>
              <color name="key_bg_pressed">#2C2C2E</color>
              <color name="key_special_bg">#2C2C2E</color>
              <color name="key_special_shadow">#000000</color>
              <color name="key_special_bg_pressed">#1C1C1E</color>
              <color name="key_text">#FFFFFF</color>
              <color name="suggestion_text">#EBEBF5</color>
              <color name="ios_blue">#0A84FF</color>
              <color name="toolbar_icon">#AAAAAA</color>
          </resources>
          EOF

          # ---- تصميم الأزرار (مطابقة للآيفون) ----
          cat << 'EOF' > app/src/main/res/drawable/bg_key.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="@color/key_shadow"/><corners android:radius="5dp"/></shape></item><item android:bottom="1dp"><shape><solid android:color="@color/key_bg"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_pressed.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><shape><solid android:color="@color/key_bg_pressed"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_pressed" /><item android:drawable="@drawable/bg_key" /></selector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="@color/key_special_shadow"/><corners android:radius="5dp"/></shape></item><item android:bottom="1dp"><shape><solid android:color="@color/key_special_bg"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special_pressed.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><shape><solid android:color="@color/key_special_bg_pressed"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_special_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_special_pressed" /><item android:drawable="@drawable/bg_key_special" /></selector>
          EOF
          
          # شكل الـ Popup (نسخة طبق الأصل)
          cat << 'EOF' > app/src/main/res/drawable/bg_popup_bubble.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg"/><corners android:radius="10dp"/><stroke android:width="0.5dp" android:color="#33000000"/></shape>
          EOF

          # ---- ملفات النظام ----
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1C1C1E" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#007AFF" android:pathData="M30,40 h48 v30 h-48 z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">AI Keyboard</string><string name="ime_name">AI Keyboard (iOS Style)</string></resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AIKeyboard" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowLightStatusBar">?attr/isLightTheme</item></style></resources>
          EOF
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true"><subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" /></input-method>
          EOF

          # ---- واجهة الإعدادات ----
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:fillViewport="true">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:layout_marginBottom="24dp" android:text="إعدادات الكيبورد" android:textSize="28sp" android:textStyle="bold" />
                  <Button android:id="@+id/btn_enable" android:layout_width="match_parent" android:layout_height="50dp" android:text="1. تفعيل الكيبورد" />
                  <Button android:id="@+id/btn_select" android:layout_width="match_parent" android:layout_height="50dp" android:layout_marginTop="8dp" android:layout_marginBottom="24dp" android:text="2. اختيار الكيبورد" />
                  <EditText android:id="@+id/input_api_key" android:layout_width="match_parent" android:layout_height="50dp" android:hint="الصق مفتاح Gemini API هنا..." android:inputType="textPassword" />
                  <Button android:id="@+id/btn_save_api" android:layout_width="match_parent" android:layout_height="50dp" android:layout_marginTop="8dp" android:layout_marginBottom="24dp" android:text="حفظ المفتاح" />
                  
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="المظهر (ملاحظة: أغلق الكيبورد وافتحه ليتم التغيير)" android:textColor="@color/ios_blue" android:textSize="14sp" android:textStyle="bold" android:layout_marginBottom="16dp" />
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="حجم الكيبورد (الارتفاع)" android:textSize="16sp" android:textStyle="bold" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:layout_marginTop="8dp" android:layout_marginBottom="24dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="T" android:textSize="14sp" android:textStyle="bold"/>
                      <SeekBar android:id="@+id/seek_kb_size" style="@style/Widget.AppCompat.SeekBar.Discrete" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:max="6" android:progress="3" />
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="T" android:textSize="22sp" android:textStyle="bold"/>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  findViewById<Button>(R.id.btn_enable).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  findViewById<Button>(R.id.btn_select).setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  
                  val inputApi = findViewById<EditText>(R.id.input_api_key)
                  inputApi.setText(prefs.getString("api_key", ""))
                  findViewById<Button>(R.id.btn_save_api).setOnClickListener { 
                      prefs.edit().putString("api_key", inputApi.text.toString()).apply()
                      Toast.makeText(this, "تم الحفظ!", Toast.LENGTH_SHORT).show() 
                  }

                  val seekKbSize = findViewById<SeekBar>(R.id.seek_kb_size)
                  seekKbSize.progress = prefs.getInt("kb_scale_step", 3)
                  seekKbSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) { prefs.edit().putInt("kb_scale_step", progress).apply() }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }
          }
          EOF

          # ---- كود الكيبورد الرئيسي (فرنسي + عربي + أبعاد iOS الدقيقة) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.HorizontalScrollView
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.view.HapticFeedbackConstants
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.lang.StringBuilder
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var currentLang = "FR" // اللغة الافتراضية أصبحت الفرنسية لتحدي Kimi
              
              private lateinit var rootFrame: FrameLayout
              private lateinit var mainLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var keyPreviewBubble: TextView
              
              private lateinit var defaultToolbarView: LinearLayout
              private lateinit var aiToolsView: HorizontalScrollView
              
              private lateinit var sug1: TextView
              private lateinit var sug2: TextView
              private lateinit var sug3: TextView
              
              private lateinit var prefs: SharedPreferences
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              private val currentTypedWord = StringBuilder()

              private val arDict = arrayOf("السلام", "عليكم", "مرحبا", "كيف", "حالك", "شكرا", "صباح", "الخير", "إن", "شاء", "الله")
              private val frDict = arrayOf("bonjour", "comment", "merci", "oui", "non", "salut", "bien", "avec", "pour") // قاموس فرنسي

              data class KeyDef(val label: String, val weight: Float)

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  density = resources.displayMetrics.density
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val sugColorInt = ContextCompat.getColor(this, R.color.suggestion_text)
                  val iconColorInt = ContextCompat.getColor(this, R.color.toolbar_icon)
                  window?.window?.navigationBarColor = bgColor

                  rootFrame = FrameLayout(this).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }

                  // ==========================================
                  // 1. الشريط العلوي (AI & Suggestions)
                  // ==========================================
                  val toolbarWrapper = FrameLayout(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (44 * density).toInt()) }
                  
                  defaultToolbarView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setPadding((4*density).toInt(), 0, (4*density).toInt(), 0)
                  }
                  
                  val toolbarToggleBtn = TextView(this).apply {
                      text = "⊞"; textSize = 22f; gravity = Gravity.CENTER; setTextColor(iconColorInt)
                      layoutParams = LinearLayout.LayoutParams((44 * density).toInt(), ViewGroup.LayoutParams.MATCH_PARENT)
                      setOnClickListener { toggleToolbar() }
                  }
                  defaultToolbarView.addView(toolbarToggleBtn)
                  
                  val suggestionContainer = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f); gravity = Gravity.CENTER }
                  fun createSugView(): TextView { return TextView(this).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f); gravity = Gravity.CENTER; textSize = 15f; setTextColor(sugColorInt); isClickable = true; setOnClickListener { applySuggestion(this.text.toString()) } } }
                  sug1 = createSugView(); sug2 = createSugView(); sug3 = createSugView()
                  suggestionContainer.addView(sug1); suggestionContainer.addView(sug2); suggestionContainer.addView(sug3)
                  defaultToolbarView.addView(suggestionContainer)

                  aiToolsView = HorizontalScrollView(this).apply {
                      visibility = View.GONE; isHorizontalScrollBarEnabled = false
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  }
                  val toolsLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding((4*density).toInt(), 0, 0, 0) }
                  val closeBtn = TextView(this).apply { text = "⬅"; textSize = 20f; gravity = Gravity.CENTER; setTextColor(iconColorInt); layoutParams = LinearLayout.LayoutParams((44 * density).toInt(), ViewGroup.LayoutParams.MATCH_PARENT); setOnClickListener { toggleToolbar() } }
                  toolsLayout.addView(closeBtn)
                  
                  val chipBg = GradientDrawable().apply { setColor(ContextCompat.getColor(this@KeyboardService, R.color.key_bg)); cornerRadius = 16f * density }
                  fun createToolBtn(icon: String, title: String, action: (TextView) -> Unit): TextView {
                      return TextView(this).apply {
                          text = "$icon $title"; textSize = 13f; setTextColor(textColorInt); gravity = Gravity.CENTER; background = chipBg
                          setPadding((12*density).toInt(), (6*density).toInt(), (12*density).toInt(), (6*density).toInt())
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins((4*density).toInt(), 0, (4*density).toInt(), 0) }
                          setOnClickListener { action(this) }
                      }
                  }
                  
                  toolsLayout.addView(createToolBtn("✨", "رد ذكي") { performAiAction("REPLY", it, it.text.toString()) })
                  toolsLayout.addView(createToolBtn("📝", "تصحيح") { performAiAction("FIX", it, it.text.toString()) })
                  toolsLayout.addView(createToolBtn("🌍", "ترجمة") { performAiAction("TRANSLATE", it, it.text.toString()) })
                  toolsLayout.addView(createToolBtn("⚙️", "إعدادات") { startActivity(Intent(this@KeyboardService, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) })
                  
                  aiToolsView.addView(toolsLayout)
                  toolbarWrapper.addView(defaultToolbarView)
                  toolbarWrapper.addView(aiToolsView)
                  mainLayout.addView(toolbarWrapper)

                  // ==========================================
                  // 2. منطقة المفاتيح
                  // ==========================================
                  keysContainer = LinearLayout(this).apply { 
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setPadding(0, (4*density).toInt(), 0, 0) } 
                  }
                  mainLayout.addView(keysContainer)
                  
                  // ==========================================
                  // 3. الشريط السفلي (iOS Style Bottom Bar)
                  // ==========================================
                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (48 * density).toInt())
                      setPadding((16*density).toInt(), 0, (16*density).toInt(), (8*density).toInt())
                  }
                  val globeBtn = TextView(this).apply {
                      text = "🌐"; textSize = 26f; gravity = Gravity.CENTER_VERTICAL or Gravity.START
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setOnClickListener { view ->
                          view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          currentLang = if(currentLang == "FR") "AR" else "FR"; currentTypedWord.clear(); rebuildKeysLayout() 
                      }
                  }
                  val micBtn = TextView(this).apply {
                      text = "🎤"; textSize = 26f; gravity = Gravity.CENTER_VERTICAL or Gravity.END
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP) }
                  }
                  bottomBar.addView(globeBtn); bottomBar.addView(micBtn)
                  mainLayout.addView(bottomBar)
                  
                  // الفقاعة المنبثقة
                  keyPreviewBubble = TextView(this).apply {
                      textSize = 34f; setTextColor(textColorInt); gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                      setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 12f * density; visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams((52 * density).toInt(), (58 * density).toInt())
                  }
                  rootFrame.addView(mainLayout); rootFrame.addView(keyPreviewBubble)

                  rebuildKeysLayout()
                  return rootFrame
              }

              private fun toggleToolbar() {
                  if (defaultToolbarView.visibility == View.VISIBLE) { defaultToolbarView.visibility = View.GONE; aiToolsView.visibility = View.VISIBLE } 
                  else { defaultToolbarView.visibility = View.VISIBLE; aiToolsView.visibility = View.GONE }
              }

              // التوزيعات الجديدة للفرنسية AZERTY والعربية المطابقة تماماً لـ iOS
              private fun getLayoutRows(): List<List<KeyDef>> {
                  if (isSymbols) {
                      val nums = listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0")
                      return listOf(
                          nums.map { KeyDef(it, 1f) },
                          listOf("-", "/", ":", ";", "(", ")", "€", "&", "@", "\"").map { KeyDef(it, 1f) },
                          listOf(KeyDef("ABC", 1.5f)) + listOf(".", ",", "?", "!", "'").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1.5f)),
                          listOf(KeyDef("ABC", 2.0f), KeyDef("SPACE", 5.0f), KeyDef("ENTER", 2.0f))
                      )
                  }
                  return when (currentLang) {
                      "AR" -> listOf(
                          "ض ص ث ق ف غ ع ه خ ح ج د".split(" ").map { KeyDef(it, 1f) }, 
                          listOf(KeyDef("SPACER", 0.5f)) + "ش س ي ب ل ا ت ن م ك ط".split(" ").map { KeyDef(it, 1f) } + listOf(KeyDef("SPACER", 0.5f)),
                          listOf(KeyDef("SHIFT", 1.5f)) + "ذ ئ ء ؤ ر لا ى ة و ز ظ".split(" ").map { KeyDef(it, 0.9f) } + listOf(KeyDef("DEL", 1.5f)),
                          listOf(KeyDef("?123", 2.5f), KeyDef("SPACE", 6.0f), KeyDef("ENTER", 2.5f))
                      )
                      else -> listOf(
                          // الفرنسية AZERTY
                          "q w e r t y u i o p".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("q","a").replace("w","z"), 1f) }, // AZERTY row 1
                          "a s d f g h j k l m".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("a","q"), 1f) }, // AZERTY row 2 (M at end)
                          listOf(KeyDef("SHIFT", 1.5f)) + "z x c v b n".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("z","w"), 1f) } + listOf(KeyDef("'", 1f), KeyDef("DEL", 1.5f)), // AZERTY row 3
                          listOf(KeyDef("?123", 2.5f), KeyDef("SPACE", 6.0f), KeyDef("ENTER", 2.5f))
                      )
                  }
              }

              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) { super.onStartInputView(info, restarting); rebuildKeysLayout() }

              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  val rows = getLayoutRows()
                  
                  val kbStep = prefs.getInt("kb_scale_step", 3)
                  val kbScale = 0.8f + (kbStep * 0.1f) 
                  val baseKeyHeight = (46 * density * kbScale).toInt() 
                  
                  val keyMarginH = (2.5f * density).toInt() 
                  val keyMarginV = (5 * density).toInt()
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)

                  for (row in rows) {
                      val rowLayout = LinearLayout(this).apply { 
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight).apply { setMargins(0, keyMarginV/2, 0, keyMarginV/2) }
                      }
                      for (keyDef in row) {
                          val label = keyDef.label
                          if (label == "SPACER") {
                              rowLayout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, keyDef.weight) })
                          } else {
                              val keyView = TextView(this).apply {
                                  text = when (label) { "SHIFT" -> if (isCaps) "⇪" else "⇧"; "DEL" -> "⌫"; "ENTER" -> if(currentLang=="AR") "إدخال" else "retour"; "SPACE" -> if(currentLang=="AR") "مسافة" else "espace"; else -> label }
                                  val baseSize = if (label == "SHIFT" || label == "DEL" || label == "ENTER" || label == "?123" || label == "ABC") 15f else 22f
                                  textSize = baseSize
                                  gravity = Gravity.CENTER; isClickable = true
                                  typeface = Typeface.DEFAULT
                                  
                                  val isSpecial = label.length > 2 || label == "DEL" || label == "SHIFT" || label == "ENTER"
                                  setBackgroundResource(if (isSpecial) R.drawable.key_special_selector else R.drawable.key_selector)
                                  setTextColor(textColorInt) 
                                  
                                  layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, keyDef.weight).apply { setMargins(keyMarginH, 0, keyMarginH, 0) }
                                  
                                  setOnTouchListener { v, event ->
                                      when (event.action) {
                                          MotionEvent.ACTION_DOWN -> { 
                                              v.isPressed = true
                                              v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                              if (label.length == 1 && label != " ") {
                                                  val keyX = v.x + rowLayout.x
                                                  val keyY = v.y + rowLayout.y + keysContainer.y + (44*density) // Toolbar offset
                                                  keyPreviewBubble.text = (v as TextView).text.toString()
                                                  keyPreviewBubble.x = keyX - (keyPreviewBubble.layoutParams.width - v.width) / 2f
                                                  keyPreviewBubble.y = keyY - keyPreviewBubble.layoutParams.height
                                                  keyPreviewBubble.visibility = View.VISIBLE
                                              }
                                              true 
                                          }
                                          MotionEvent.ACTION_UP -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; handleKeyClick(label); true }
                                          MotionEvent.ACTION_CANCEL -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; true }
                                          else -> false
                                      }
                                  }
                              }
                              rowLayout.addView(keyView)
                          }
                      }
                      keysContainer.addView(rowLayout)
                  }
              }

              override fun onFinishInput() { super.onFinishInput(); currentTypedWord.clear(); if(this::sug1.isInitialized) { sug1.text = ""; sug2.text = ""; sug3.text = "" } }

              private fun updateSuggestions() {
                  if(!this::sug1.isInitialized) return
                  val word = currentTypedWord.toString()
                  if (word.length < 2 || isSymbols) { sug1.text = ""; sug2.text = ""; sug3.text = ""; return }
                  val dict = when(currentLang) { "AR" -> arDict; else -> frDict }
                  var count = 0; val matches = arrayOf("", "", "")
                  for (item in dict) { if (item.length > word.length && item.startsWith(word, ignoreCase = true)) { matches[count] = item; count++; if (count == 3) break } }
                  sug1.text = matches[0]; sug2.text = matches[1]; sug3.text = matches[2]
              }

              private fun applySuggestion(sug: String) {
                  if (sug.isEmpty()) return
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(currentTypedWord.length, 0); ic.commitText(sug + " ", 1); currentTypedWord.clear(); updateSuggestions()
              }

              private fun handleKeyClick(key: String) {
                  if (aiToolsView.visibility == View.VISIBLE) toggleToolbar()
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)); if (currentTypedWord.isNotEmpty()) currentTypedWord.deleteCharAt(currentTypedWord.length - 1) }
                      "SPACE", "ENTER" -> { 
                          if (key == "SPACE") ic.commitText(" ", 1) else { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                          currentTypedWord.clear() 
                      }
                      "SHIFT" -> { isCaps = !isCaps; rebuildKeysLayout() }
                      "?123" -> { isSymbols = true; rebuildKeysLayout() }
                      "ABC" -> { isSymbols = false; rebuildKeysLayout() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1); if (isCaps) { isCaps = false; rebuildKeysLayout() }
                          if (key.length == 1 && !isSymbols) { currentTypedWord.append(letter) }
                      }
                  }
                  updateSuggestions()
              }
              
              private fun performAiAction(actionType: String, btn: TextView, originalTitle: String) {
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ ضع المفتاح", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  if (extractedText.isBlank() && actionType != "REPLY") { Toast.makeText(this, "لا يوجد نص", Toast.LENGTH_SHORT).show(); return }
                  btn.text = "⏳..."; btn.isEnabled = false; btn.alpha = 0.5f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = when (actionType) { 
                                  "FIX" -> "صحح هذا النص إملائياً ولغوياً فقط وأعده بدون إضافات: $extractedText" 
                                  "REPLY" -> "اكتب رداً قصيراً وذكياً ومناسباً على هذا النص: $extractedText"
                                  else -> "ترجم هذا النص للغة الأخرى (إن كان فرنسي ترجمه لعربي والعكس) ترجمة دقيقة: $extractedText" 
                              }
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                          withContext(Dispatchers.Main) { 
                              if(actionType == "REPLY") ic.commitText("\n$reply\n", 1) else { ic.deleteSurroundingText(extractedText.length, 0); ic.commitText(reply, 1) }
                              toggleToolbar() 
                          }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { Toast.makeText(this@KeyboardService, "خطأ بالاتصال", Toast.LENGTH_SHORT).show() } } 
                      finally { btn.text = originalTitle; btn.isEnabled = true; btn.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase38.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase38.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v38.0
          name: "AI Keyboard Pro - Phase 38 (The Ultimate Kimi Challenge)"
          body: "التحدي قُبل وتم التنفيذ:\n1. 🇫🇷 تم دمج اللغة الفرنسية بتوزيعة AZERTY الأصلية للآيفون (A Z E R T Y).\n2. 📏 تم ضبط الأبعاد والمسافات (Padding) وزوايا الأزرار (Radius) لتطابق مليمرات كيبورد الآيفون بالكامل بدون أوزان مزعجة.\n3. 💬 المربع المنبثق (Popup) عند لمس الحروف أصبح مطابقاً لشكل الآيفون الكلاسيكي المرتفع والمنحني.\n4. 📱 الشريط السفلي المعزول (كرة أرضية + ميكروفون) تم وضعه في الأسفل تماماً كما في شاشات iPhone X فأحدث.\n5. ✨ شريط الـ AI المخفي يعمل بسلاسة كعنصر Gboard إضافي ذكي يحافظ على المظهر الأصلي للكيبورد."
          files: release-output/AI-Keyboard-Pro-Phase38.apk
