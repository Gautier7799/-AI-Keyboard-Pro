          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:fillViewport="true">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="24dp">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="30dp" android:layout_marginBottom="30dp" android:text="إعدادات الكيبورد" android:textSize="32sp" android:textStyle="bold" android:gravity="center" />
                  <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn_enable" android:layout_width="match_parent" android:layout_height="60dp" android:text="1. تفعيل الكيبورد" android:textColor="#FFFFFF" android:background="@drawable/bg_button" android:textSize="18sp" android:layout_marginBottom="16dp"/>
                  <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn_select" android:layout_width="match_parent" android:layout_height="60dp" android:text="2. اختيار الكيبورد" android:textColor="#FFFFFF" android:background="@drawable/bg_button" android:textSize="18sp" android:layout_marginBottom="40dp"/>
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="إعدادات الذكاء الاصطناعي:" android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="12dp" />
                  <EditText android:id="@+id/input_api_key" android:layout_width="match_parent" android:layout_height="60dp" android:hint="الصق مفتاح Gemini API هنا..." android:inputType="textPassword" android:background="@drawable/bg_popup_bubble" android:padding="16dp" android:layout_marginBottom="16dp" />
                  <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn_save_api" android:layout_width="match_parent" android:layout_height="60dp" android:text="حفظ المفتاح" android:textColor="#FFFFFF" android:background="@drawable/bg_button" android:textSize="18sp" android:layout_marginBottom="40dp"/>
              </LinearLayout>
          </ScrollView>
          EOF

          # ---- إضافة ملف الإعدادات (MainActivity) الذي كان ناقصاً ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)

                  findViewById<Button>(R.id.btn_enable).setOnClickListener {
                      val intent = Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)
                      startActivity(intent)
                  }

                  findViewById<Button>(R.id.btn_select).setOnClickListener {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showInputMethodPicker()
                  }

                  val inputApiKey = findViewById<EditText>(R.id.input_api_key)
                  inputApiKey.setText(prefs.getString("api_key", ""))

                  findViewById<Button>(R.id.btn_save_api).setOnClickListener {
                      val key = inputApiKey.text.toString().trim()
                      prefs.edit().putString("api_key", key).apply()
                      Toast.makeText(this, "تم حفظ المفتاح بنجاح!", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # ---- ملف الكيبورد الرئيسي ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.inputmethod.InputMethodManager
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.HorizontalScrollView
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.widget.PopupWindow
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.HapticFeedbackConstants
          import android.text.TextUtils
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.lang.StringBuilder
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
