              private fun createBackspaceKey(): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = "⌫"
                      textSize = 18f
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), 1.5f).apply {
                          setMargins((4 * dp).toInt(), 0, 0, 0)
                      }
                      background = getRoundRect(keyControlBg, 6f * dp)
                      isClickable = true
                      
                      var deleteRunnable: Runnable? = null

                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  vibrate()
                                  v.alpha = 0.5f
                                  currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL))
                                  
                                  deleteRunnable = object : Runnable {
                                      override fun run() {
                                          currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL))
                                          mainHandler.postDelayed(this, 50) 
                                      }
                                  }
                                  mainHandler.postDelayed(deleteRunnable!!, 400) 
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  v.alpha = 1f
                                  deleteRunnable?.let { mainHandler.removeCallbacks(it) }
                                  updateSmartPredictions()
                              }
                          }
                          true
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun updateSmartPredictions() {
                  val textBeforeCursor = currentInputConnection?.getTextBeforeCursor(30, 0)?.toString() ?: ""
                  val lastWord = textBeforeCursor.split(Regex("\\s+")).lastOrNull() ?: ""

                  val suggestions = if (lastWord.isEmpty()) {
                      if (isArabic) listOf("مرحبا", "نعم", "شكرا") else listOf("bonjour", "merci", "oui")
                  } else {
                      val dict = if (isArabic) arabicDict else frenchDict
                      val matches = dict.filter { it.startsWith(lastWord, ignoreCase = true) }.take(3)
                      if (matches.isEmpty()) listOf(lastWord) else matches
                  }
                  updatePredictionsUi(suggestions, lastWord)
              }

              private fun updatePredictionsUi(words: List<String>, wordToReplace: String) {
                  predictionContainer.removeAllViews()
                  val dp = resources.displayMetrics.density
                  words.forEach { word ->
                      predictionContainer.addView(TextView(this).apply {
                          text = word
                          textSize = 16f
                          setTextColor(txtColor)
                          alpha = 0.9f
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          isClickable = true
                          background = getRoundRect(Color.TRANSPARENT, 8f * dp)
                          
                          setOnClickListener {
                              vibrate()
                              if (wordToReplace.isNotEmpty()) {
                                  currentInputConnection?.deleteSurroundingText(wordToReplace.length, 0)
                              }
                              currentInputConnection?.commitText("$word ", 1)
                              updateSmartPredictions()
                          }
                      })
                  }
              }

              private fun getAltChars(base: String): List<String> {
                  val lower = base.lowercase()
                  val map = mapOf(
                      "د" to listOf("ذ", "د"),
                      "و" to listOf("ؤ", "و"),
                      "ى" to listOf("ئ", "ى"),
                      "ي" to listOf("ئ", "ي"),
                      "ا" to listOf("أ", "إ", "آ", "ا"),
                      "ه" to listOf("ة", "ه"),
                      "a" to listOf("à", "â", "æ", "ä", "a"),
                      "e" to listOf("é", "è", "ê", "ë", "e"),
                      "i" to listOf("î", "ï", "i"),
                      "o" to listOf("ô", "œ", "ö", "o"),
                      "u" to listOf("ù", "û", "ü", "u"),
                      "c" to listOf("ç", "c")
                  )
                  val list = map[lower] ?: emptyList()
                  if (base.isNotEmpty() && base[0].isUpperCase()) {
                      return list.map { it.uppercase() }
                  }
                  return list
              }

              private fun showAltPopup(view: View, alts: List<String>) {
                  val dp = resources.displayMetrics.density
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = getRoundRect(keyControlBg, 12f * dp)
                      setPadding((6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt())
                  }
                  altViews.clear()
                  alts.forEach { char ->
                      val tv = TextView(this).apply {
                          text = char
                          textSize = 24f
                          setTextColor(txtColor)
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams((44*dp).toInt(), (50*dp).toInt()).apply {
                              setMargins((2*dp).toInt(), 0, (2*dp).toInt(), 0)
                          }
                          background = getRoundRect(keyNormalBg, 8f * dp)
                      }
                      altViews.add(tv)
                      container.addView(tv)
                  }
                  altPopupWindow = PopupWindow(container, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      isClippingEnabled = false
                      isTouchable = false 
                      setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  }
                  val loc = IntArray(2)
                  view.getLocationOnScreen(loc)
                  val popupWidth = alts.size * (48 * dp) + (12 * dp)
                  val xOffset = loc[0] - (popupWidth / 2) + (view.width / 2)
                  altPopupWindow?.showAtLocation(view, Gravity.NO_GRAVITY, xOffset.toInt(), loc[1] - (70 * dp).toInt())
              }

              private fun createKey(char: String): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = char
                      textSize = 21f
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), 1f)
                      background = getRoundRect(keyNormalBg, 6f * dp)
                      isClickable = true
                      
                      var isLongPressing = false
                      var hoveredIndex = -1
                      var longPressRunnable: Runnable? = null

                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  vibrate()
                                  isLongPressing = false
                                  hoveredIndex = -1
                                  
                                  showPopup(v, char)
                                  v.background = getRoundRect(if(isDarkMode) Color.LTGRAY else Color.parseColor("#E5E5EA"), 6f * dp)
                                  (v as TextView).setTextColor(Color.BLACK)

                                  val alts = getAltChars(char)
                                  if (alts.isNotEmpty()) {
                                      longPressRunnable = Runnable {
                                          isLongPressing = true
                                          dismissPopup()
                                          showAltPopup(v, alts)
                                      }
                                      mainHandler.postDelayed(longPressRunnable!!, 350)
                                  }
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  if (isLongPressing && altPopupWindow != null) {
                                      val rawX = event.rawX
                                      altViews.forEachIndexed { index, tv ->
                                          val loc = IntArray(2)
                                          tv.getLocationOnScreen(loc)
                                          if (rawX >= loc[0] && rawX <= loc[0] + tv.width) {
                                              tv.setBackgroundColor(if(isDarkMode) Color.LTGRAY else Color.parseColor("#E5E5EA"))
                                              tv.setTextColor(Color.BLACK)
                                              hoveredIndex = index
                                          } else {
                                              tv.background = getRoundRect(keyNormalBg, 8f * dp)
                                              tv.setTextColor(txtColor)
                                          }
                                      }
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  longPressRunnable?.let { mainHandler.removeCallbacks(it) }
                                  v.background = getRoundRect(keyNormalBg, 6f * dp)
                                  (v as TextView).setTextColor(txtColor)

                                  if (isLongPressing) {
                                      if (hoveredIndex != -1 && event.action == MotionEvent.ACTION_UP) {
                                          currentInputConnection?.commitText(altViews[hoveredIndex].text.toString(), 1)
                                      } else if (event.action == MotionEvent.ACTION_UP) {
                                          val alts = getAltChars(char)
                                          if (alts.isNotEmpty()) currentInputConnection?.commitText(alts[0], 1)
                                      }
                                      altPopupWindow?.dismiss()
                                      altPopupWindow = null
                                  } else {
                                      dismissPopup()
                                      if (event.action == MotionEvent.ACTION_UP) {
                                          currentInputConnection?.commitText(char, 1)
                                          if (isShifted) {
                                              isShifted = false
                                              renderKeys()
                                          }
                                      }
                                  }
                                  if (event.action == MotionEvent.ACTION_UP) {
                                      updateSmartPredictions()
                                  }
                              }
                          }
                          true
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun createKeysRow(keys: List<String>, weightInParent: Float = 0f, sidePaddingDp: Int = 0): LinearLayout {
                  val dp = resources.displayMetrics.density
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = if (weightInParent > 0f) {
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, weightInParent)
                      } else {
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      if (sidePaddingDp > 0) {
                          val padding = (sidePaddingDp * dp).toInt()
                          setPadding(padding, 0, padding, 0)
                      }
                  }
                  keys.forEachIndexed { index, char ->
                      row.addView(createKey(char))
                      if (index < keys.size - 1) row.addView(Space((4 * dp).toInt(), true))
                  }
                  return row
              }

              private fun vibrate() {
                  try { 
                      vibrator.vibrate(VibrationEffect.createOneShot(15, VibrationEffect.DEFAULT_AMPLITUDE)) 
                      audioManager.playSoundEffect(AudioManager.FX_KEYPRESS_STANDARD, 1.0f)
                  } catch (e: Exception) {}
              }
              
