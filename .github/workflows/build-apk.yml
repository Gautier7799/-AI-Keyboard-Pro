name: Build AI Keyboard Pro (V26 Zero Lag)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate iOS Clone Keyboard V26
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keyboard Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 26; versionName = "26.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Keyboard Pro iOS</string>
              <string name="ime_name">iOS Keyboard V26</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="ar_AE" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.graphics.drawable.StateListDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.SoundEffectConstants
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class KeyboardService : InputMethodService() {
              
              private val kbBgColor = Color.parseColor("#D1D4D9")
              private val keyNormalFace = Color.parseColor("#FFFFFF")
              private val keyNormalPressed = Color.parseColor("#B3B8C3")
              private val keyControlFace = Color.parseColor("#B3B8C3")
              private val keyControlPressed = Color.parseColor("#FFFFFF")
              private val keyShadow = Color.parseColor("#898A8D")
              private val txtColor = Color.parseColor("#000000")
              private val predictionBgColor = Color.parseColor("#D1D4D9")
              
              private var currentLanguage = 0 
              private var isShifted = false
              private var keyboardMode = 0 
              private var keyHeightDp = 52f 
              
              private lateinit var absoluteRoot: FrameLayout
              private lateinit var rootLayout: LinearLayout
              private lateinit var predictionContainer: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var popupView: TextView
              
              private val predictionViews = mutableListOf<TextView>()
              private val handler = Handler(Looper.getMainLooper())

              private val dictionaryAr = listOf("مرحبا", "شكرا", "السلام", "عليكم", "نعم", "لا", "كيف", "حالك", "إن", "شاء", "الله")
              private val dictionaryFr = listOf("bonjour", "merci", "oui", "non", "comment", "ça", "va", "bien", "salut", "je")

              override fun onCreateInputView(): View {
                  val dp = resources.displayMetrics.density

                  absoluteRoot = FrameLayout(this).apply {
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(kbBgColor)
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(0, 0, 0, (4 * dp).toInt()) // إلغاء الهوامش السفلية تقريباً
                  }

                  // 3. & 4. Toolbar Plus AI & Settings
                  predictionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (44 * dp).toInt())
                      setBackgroundColor(predictionBgColor)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  
                  // أيقونة الإعدادات (Settings)
                  predictionContainer.addView(TextView(this).apply {
                      text = "⚙️"
                      textSize = 20f
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams((44 * dp).toInt(), ViewGroup.LayoutParams.MATCH_PARENT)
                      isClickable = true
                      setOnTouchListener { v, event -> if(event.action==MotionEvent.ACTION_DOWN) vibrateAndSound(v); true }
                  })

                  // قسم التنبؤات في المنتصف
                  val wordsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }
                  
                  for (i in 0..2) {
                      val tv = TextView(this).apply {
                          text = ""
                          textSize = 17f
                          setTextColor(txtColor)
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      }
                      predictionViews.add(tv)
                      wordsLayout.addView(tv)
                      
                      if (i < 2) {
                          wordsLayout.addView(View(this).apply {
                              layoutParams = LinearLayout.LayoutParams((1*dp).toInt(), (24 * dp).toInt()).apply { gravity = Gravity.CENTER_VERTICAL }
                              setBackgroundColor(Color.parseColor("#B4B8C1"))
                          })
                      }
                  }
                  predictionContainer.addView(wordsLayout)

                  // أيقونة الذكاء الاصطناعي (AI Plus)
                  predictionContainer.addView(TextView(this).apply {
                      text = "✨"
                      textSize = 20f
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams((44 * dp).toInt(), ViewGroup.LayoutParams.MATCH_PARENT)
                      isClickable = true
                      setOnTouchListener { v, event -> if(event.action==MotionEvent.ACTION_DOWN) vibrateAndSound(v); true }
                  })
                  
                  rootLayout.addView(predictionContainer)
                  rootLayout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (1*dp).toInt()); setBackgroundColor(Color.parseColor("#B4B8C1")) })
                  
                  // 1. تكميل الكيبورد للأخير بدون زيادة (إلغاء الهوامش الجانبية بالكامل)
                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(0, (6 * dp).toInt(), 0, 0) // صفر هامش يمين ويسار
                  }
                  rootLayout.addView(keysContainer)
                  absoluteRoot.addView(rootLayout)

                  // 5. الأيقونة المنبثقة (صغيرة لربح المساحة)
                  popupView = TextView(this).apply {
                      visibility = View.GONE
                      textSize = 30f // تصغير الخط قليلا
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      
                      val popupShape = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(keyNormalFace)
                          cornerRadius = 6f * dp // حواف ناعمة
                      }
                      val shadowShape = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(keyShadow)
                          cornerRadius = 6f * dp
                      }
                      val popupLayer = LayerDrawable(arrayOf(shadowShape, popupShape))
                      popupLayer.setLayerInset(1, 0, 0, 0, (2 * dp).toInt())
                      background = popupLayer
                      elevation = 4f * dp
                  }
                  absoluteRoot.addView(popupView)

                  renderKeys()
                  return absoluteRoot
              }

              private fun createIosKeyDrawable(faceColor: Int, pressedColor: Int): StateListDrawable {
                  val dp = resources.displayMetrics.density
                  val radius = 5f * dp
                  val shadowHeight = (1.2f * dp).toInt() // ظل أرق لربح المساحة

                  val normalFace = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(faceColor); cornerRadius = radius }
                  val shadow = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(keyShadow); cornerRadius = radius }
                  val normalLayer = LayerDrawable(arrayOf(shadow, normalFace))
                  normalLayer.setLayerInset(1, 0, 0, 0, shadowHeight)

                  val pressedFace = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(pressedColor); cornerRadius = radius }
                  val pressedLayer = LayerDrawable(arrayOf(shadow, pressedFace))
                  pressedLayer.setLayerInset(1, 0, shadowHeight/2, 0, shadowHeight/2)

                  return StateListDrawable().apply {
                      addState(intArrayOf(android.R.attr.state_pressed), pressedLayer)
                      addState(intArrayOf(), normalLayer)
                  }
              }

              override fun onUpdateSelection(oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int, candidatesStart: Int, candidatesEnd: Int) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  // 6. تشغيل التنبؤ في الخلفية لمنع اللاج في الكتابة
                  handler.post { updatePredictions() }
              }

              private fun updatePredictions() {
                  val ic = currentInputConnection ?: return
                  val textBeforeCursor = ic.getTextBeforeCursor(20, 0)?.toString() ?: ""
                  val lastWord = textBeforeCursor.takeLastWhile { it.isLetter() }
                  val activeDict = if(currentLanguage == 0) dictionaryAr else dictionaryFr

                  val suggestions = if (lastWord.isEmpty()) {
                      if(currentLanguage == 0) listOf("أنا", "كيف", "نعم") else listOf("Je", "Comment", "Oui")
                  } else {
                      val matches = activeDict.filter { it.startsWith(lastWord, ignoreCase = true) }.take(3).toMutableList()
                      while(matches.size < 3) matches.add("")
                      matches
                  }
                  
                  predictionViews.forEachIndexed { index, tv ->
                      tv.text = suggestions[index]
                      tv.setOnTouchListener { v, event ->
                          if (event.action == MotionEvent.ACTION_DOWN && suggestions[index].isNotEmpty()) {
                              vibrateAndSound(v)
                              if (lastWord.isNotEmpty()) ic.deleteSurroundingText(lastWord.length, 0)
                              ic.commitText(suggestions[index] + " ", 1)
                          }
                          true
                      }
                  }
              }

              private fun renderKeys() {
                  keysContainer.removeAllViews()
                  val dp = resources.displayMetrics.density
                  val gap = (4 * dp).toInt() 
                  val rowGap = (10 * dp).toInt() 
                  
                  if (keyboardMode == 0) { 
                      val r1 = if(currentLanguage == 0) listOf("ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د") else listOf("a","z","e","r","t","y","u","i","o","p")
                      val r2 = if(currentLanguage == 0) listOf("ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط") else listOf("q","s","d","f","g","h","j","k","l","m")
                      val r3 = if(currentLanguage == 0) listOf("ظ","ز","و","ة","ى","لا","ر","ؤ","ء","ئ") else listOf("w","x","c","v","b","n")

                      keysContainer.addView(createKeysRow(r1, gap, 0.05f)) // هوامش شبه معدومة للوصول للحافة
                      keysContainer.addView(Space(rowGap))
                      
                      keysContainer.addView(createKeysRow(r2, gap, if(currentLanguage==0) 0.5f else 0.5f))
                      keysContainer.addView(Space(rowGap))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      
                      row3Container.addView(Space((3*dp).toInt(), true))
                      row3Container.addView(createSpecialKey("⇧", keyControlFace, keyControlPressed, 1.3f).apply {
                          setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); isShifted = !isShifted; text = if(isShifted) "⬆" else "⇧"; renderKeys() }; true }
                      })
                      row3Container.addView(Space(gap, true))
                      
                      r3.forEach { char ->
                          row3Container.addView(createKey(if(isShifted && currentLanguage == 1) char.uppercase() else char))
                          row3Container.addView(Space(gap, true))
                      }
                      
                      row3Container.addView(createBackspaceKey())
                      row3Container.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space(rowGap))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      bottomRow.addView(createSpecialKey("123", keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = 1; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey("🌐", keyControlFace, keyControlPressed, 1.2f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentLanguage = if(currentLanguage == 0) 1 else 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      val spaceLabel = if(currentLanguage == 0) "مسافة" else "espace"
                      bottomRow.addView(createSpecialKey(spaceLabel, keyNormalFace, keyNormalPressed, 5f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.commitText(" ", 1) }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey("↵", keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }; true } })
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(bottomRow)
                      
                  } else { 
                      val r1 = if(keyboardMode == 1) listOf("1","2","3","4","5","6","7","8","9","0") else listOf("[","]","{","}","#","%","^","*","+","=")
                      val r2 = if(keyboardMode == 1) listOf("-","/",":",";","(",")","$","&","@","\"") else listOf("_","\\","|","~","<",">","€","£","¥","•")
                      val r3 = listOf(".",",","?","!","'")

                      keysContainer.addView(createKeysRow(r1, gap, 0.05f))
                      keysContainer.addView(Space(rowGap))
                      keysContainer.addView(createKeysRow(r2, gap, 0.05f))
                      keysContainer.addView(Space(rowGap))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      row3Container.addView(Space((3*dp).toInt(), true))
                      val symToggle = if(keyboardMode == 1) "#+=" else "123"
                      row3Container.addView(createSpecialKey(symToggle, keyControlFace, keyControlPressed, 1.3f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = if(keyboardMode == 1) 2 else 1; renderKeys() }; true } })
                      row3Container.addView(Space(gap, true))
                      r3.forEach { char ->
                          row3Container.addView(createKey(char, weight = 1.2f))
                          row3Container.addView(Space(gap, true))
                      }
                      row3Container.addView(createBackspaceKey())
                      row3Container.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space(rowGap))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      val langLabel = if(currentLanguage == 0) "أ ب ج" else "ABC"
                      bottomRow.addView(createSpecialKey(langLabel, keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); keyboardMode = 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey("🌐", keyControlFace, keyControlPressed, 1.2f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentLanguage = if(currentLanguage == 0) 1 else 0; renderKeys() }; true } })
                      bottomRow.addView(Space(gap, true))
                      val spaceLabel = if(currentLanguage == 0) "مسافة" else "espace"
                      bottomRow.addView(createSpecialKey(spaceLabel, keyNormalFace, keyNormalPressed, 5f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.commitText(" ", 1) }; true } })
                      bottomRow.addView(Space(gap, true))
                      bottomRow.addView(createSpecialKey("↵", keyControlFace, keyControlPressed, 1.4f).apply { setOnTouchListener { v, e -> if(e.action==MotionEvent.ACTION_DOWN){ vibrateAndSound(v); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }; true } })
                      bottomRow.addView(Space((3*dp).toInt(), true))
                      keysContainer.addView(bottomRow)
                  }
              }

              // 6. Zero-Lag Typing Method
              private fun createKey(char: String, weight: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = char
                      textSize = 25f 
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight)
                      background = createIosKeyDrawable(keyNormalFace, keyNormalPressed)
                      
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  v.isPressed = true
                                  vibrateAndSound(v)
                                  
                                  // 5. الانبثاق المصغر لتوفير المساحة
                                  val loc = IntArray(2)
                                  v.getLocationInWindow(loc)
                                  val popupWidth = v.width + (8 * dp).toInt() // أعرض قليلاً من الزر فقط
                                  val popupHeight = (50 * dp).toInt() // ارتفاع مناسب جداً
                                  
                                  popupView.layoutParams = FrameLayout.LayoutParams(popupWidth, popupHeight)
                                  popupView.text = char
                                  popupView.x = loc[0].toFloat() - (popupWidth - v.width) / 2
                                  popupView.y = loc[1].toFloat() - popupHeight - (2 * dp)
                                  popupView.visibility = View.VISIBLE
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  v.isPressed = false
                                  popupView.visibility = View.GONE
                                  currentInputConnection?.commitText(text.toString(), 1) // كتابة فورية
                                  true
                              }
                              MotionEvent.ACTION_CANCEL -> {
                                  v.isPressed = false
                                  popupView.visibility = View.GONE
                                  true
                              }
                              else -> false
                          }
                      }
                  }
              }

              private fun createBackspaceKey(): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = "⌫"
                      textSize = 22f
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), 1.3f)
                      background = createIosKeyDrawable(keyControlFace, keyControlPressed)
                      
                      setOnTouchListener { v, event ->
                          if (event.action == MotionEvent.ACTION_DOWN) {
                              v.isPressed = true
                              vibrateAndSound(v)
                              currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL))
                          } else if (event.action == MotionEvent.ACTION_UP || event.action == MotionEvent.ACTION_CANCEL) {
                              v.isPressed = false
                          }
                          true
                      }
                  }
              }

              private fun createSpecialKey(label: String, faceColor: Int, pressedColor: Int, weight: Float): TextView {
                  val dp = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = label
                      textSize = if(label == "مسافة" || label == "espace") 16f else 18f
                      setTextColor(txtColor)
                      gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif", Typeface.NORMAL)
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight)
                      background = createIosKeyDrawable(faceColor, pressedColor)
                      
                      setOnTouchListener { v, event ->
                          if (event.action == MotionEvent.ACTION_DOWN) v.isPressed = true
                          else if (event.action == MotionEvent.ACTION_UP || event.action == MotionEvent.ACTION_CANCEL) v.isPressed = false
                          false 
                      }
                  }
              }

              private fun createKeysRow(keys: List<String>, gap: Int, edgeWeight: Float): LinearLayout {
                  val dp = resources.displayMetrics.density
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  
                  // الحواف الجانبية الدقيقة (حسب الصورة)
                  if (edgeWeight > 0f) row.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, edgeWeight) })
                  else row.addView(Space((3*dp).toInt(), true))

                  keys.forEachIndexed { index, char ->
                      row.addView(createKey(char))
                      if (index < keys.size - 1) row.addView(Space(gap, true))
                  }
                  
                  if (edgeWeight > 0f) row.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, edgeWeight) })
                  else row.addView(Space((3*dp).toInt(), true))
                  
                  return row
              }

              private fun vibrateAndSound(view: View) {
                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                  view.playSoundEffect(SoundEffectConstants.CLICK)
              }

              private fun Space(size: Int, isHorizontal: Boolean = false): View {
                  return View(this).apply { layoutParams = if (isHorizontal) LinearLayout.LayoutParams(size, 1) else LinearLayout.LayoutParams(1, size) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <service android:name=".KeyboardService" android:exported="true" android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro-Ultimate
          path: release-output/AI-Keyboard-Pro.apk
          retention-days: 5
