name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/layout app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 38; versionName = "31.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- ألوان iOS الأصلية ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="keyboard_bg">#D1D1D6</color>
              <color name="key_bg">#FFFFFF</color>
              <color name="key_shadow">#898A8D</color>
              <color name="key_bg_pressed">#E5E5EA</color>
              <color name="key_special_bg">#B4B8C1</color>
              <color name="key_special_shadow">#898A8D</color>
              <color name="key_special_bg_pressed">#9AA0AB</color>
              <color name="key_text">#000000</color>
              <color name="suggestion_text">#3C3C43</color>
              
              <color name="settings_bg">#F2F2F7</color>
              <color name="settings_card">#FFFFFF</color>
              <color name="settings_text">#000000</color>
              <color name="settings_subtext">#8E8E93</color>
              <color name="ios_blue">#007AFF</color>
              <color name="ios_green">#34C759</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="keyboard_bg">#1C1C1E</color>
              <color name="key_bg">#545456</color>
              <color name="key_shadow">#000000</color>
              <color name="key_bg_pressed">#3A3A3C</color>
              <color name="key_special_bg">#3A3A3C</color>
              <color name="key_special_shadow">#000000</color>
              <color name="key_special_bg_pressed">#2C2C2E</color>
              <color name="key_text">#FFFFFF</color>
              <color name="suggestion_text">#EBEBF5</color>
              
              <color name="settings_bg">#000000</color>
              <color name="settings_card">#1C1C1E</color>
              <color name="settings_text">#FFFFFF</color>
              <color name="settings_subtext">#8E8E93</color>
              <color name="ios_blue">#0A84FF</color>
              <color name="ios_green">#30D158</color>
          </resources>
          EOF

          # ---- الأزرار 3D (Layer-List) ----
          cat << 'EOF' > app/src/main/res/drawable/bg_key.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="@color/key_shadow"/><corners android:radius="5dp"/></shape></item><item android:bottom="1.2dp"><shape><solid android:color="@color/key_bg"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_pressed.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><shape><solid android:color="@color/key_bg_pressed"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_pressed" /><item android:drawable="@drawable/bg_key" /></selector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="@color/key_special_shadow"/><corners android:radius="5dp"/></shape></item><item android:bottom="1.2dp"><shape><solid android:color="@color/key_special_bg"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special_pressed.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><shape><solid android:color="@color/key_special_bg_pressed"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_special_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_special_pressed" /><item android:drawable="@drawable/bg_key_special" /></selector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:top="1dp" android:bottom="0dp"><shape><solid android:color="#005BB5"/><corners android:radius="5dp"/></shape></item><item android:bottom="1.2dp"><shape><solid android:color="@color/ios_blue"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter_pressed.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><shape><solid android:color="#005BB5"/><corners android:radius="5dp"/></shape></item></layer-list>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_enter_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_enter_pressed" /><item android:drawable="@drawable/bg_key_enter" /></selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_settings_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/settings_card"/><corners android:radius="12dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_input.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/settings_bg"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_btn_blue.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/ios_blue"/><corners android:radius="10dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_btn_green.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/ios_green"/><corners android:radius="10dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_popup_bubble.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg"/><corners android:radius="8dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1C1C1E" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,20 C35.2,20 20,35.2 20,54 C20,72.8 35.2,88 54,88 C72.8,88 88,72.8 88,54 C88,35.2 72.8,20 54,20 Z M54,80 C39.6,80 28,68.4 28,54 C28,39.6 39.6,28 54,28 C68.4,28 80,39.6 80,54 C80,68.4 68.4,80 54,80 Z"/>
              <path android:fillColor="#0A84FF" android:pathData="M54,36 L68,66 L40,66 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">AI Keyboard</string><string name="ime_name">AI Keyboard (iOS Style)</string></resources>
          EOF
          
          # ⬅️ هذا هو ملف الثيمات الذي سقط سهواً وتسبب بالخطأ! تمت إضافته.
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AIKeyboard" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowLightStatusBar">?attr/isLightTheme</item></style></resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true"><subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" /></input-method>
          EOF

          # ---- واجهة الإعدادات (iOS Settings Style) ----
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/settings_bg" android:fillViewport="true">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                  
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="32dp" android:layout_marginBottom="24dp" android:text="Settings" android:textColor="@color/settings_text" android:textSize="32sp" android:textStyle="bold" />
                  
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp" android:layout_marginStart="12dp" android:text="ACTIVATION" android:textColor="@color/settings_subtext" android:textSize="13sp" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_settings_card" android:orientation="vertical" android:padding="16dp">
                      <Button android:id="@+id/btn_enable" android:layout_width="match_parent" android:layout_height="50dp" android:background="@drawable/bg_btn_blue" android:text="1. Enable Keyboard" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
                      <Button android:id="@+id/btn_select" android:layout_width="match_parent" android:layout_height="50dp" android:layout_marginTop="12dp" android:background="@drawable/bg_btn_green" android:text="2. Select Keyboard" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
                  </LinearLayout>
                  
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp" android:layout_marginBottom="8dp" android:layout_marginStart="12dp" android:text="AI GEMINI SETUP" android:textColor="@color/settings_subtext" android:textSize="13sp" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_settings_card" android:orientation="vertical" android:padding="16dp">
                      <EditText android:id="@+id/input_api_key" android:layout_width="match_parent" android:layout_height="44dp" android:background="@drawable/bg_input" android:hint="Paste API Key here..." android:paddingHorizontal="16dp" android:textColor="@color/settings_text" android:textColorHint="@color/settings_subtext" android:textSize="14sp" android:inputType="textPassword" />
                      <Button android:id="@+id/btn_save_api" android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="12dp" android:background="@drawable/bg_btn_blue" android:text="Save Key 🔒" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
                  </LinearLayout>
                  
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp" android:layout_marginBottom="8dp" android:layout_marginStart="12dp" android:text="APPEARANCE &amp; HAPTICS" android:textColor="@color/settings_subtext" android:textSize="13sp" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="40dp" android:background="@drawable/bg_settings_card" android:orientation="vertical" android:padding="16dp">
                      
                      <TextView android:id="@+id/tv_kb_size" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Keyboard Height: 100%" android:textColor="@color/settings_text" android:textSize="15sp" />
                      <SeekBar android:id="@+id/seek_kb_size" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:layout_marginBottom="16dp" android:max="100" android:progress="50" android:progressTint="@color/ios_blue" android:thumbTint="@color/ios_blue" />
                      
                      <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E5EA" android:layout_marginBottom="16dp"/>
                      
                      <TextView android:id="@+id/tv_text_size" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Font Size: 100%" android:textColor="@color/settings_text" android:textSize="15sp" />
                      <SeekBar android:id="@+id/seek_text_size" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:layout_marginBottom="16dp" android:max="100" android:progress="50" android:progressTint="@color/ios_blue" android:thumbTint="@color/ios_blue" />

                      <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E5EA" android:layout_marginBottom="16dp"/>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center_vertical" android:orientation="horizontal">
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Haptic Feedback" android:textColor="@color/settings_text" android:textSize="15sp" />
                          <Switch android:id="@+id/switch_vibrate" android:layout_width="wrap_content" android:layout_height="wrap_content" android:thumbTint="@color/ios_green" />
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  window.statusBarColor = getColor(R.color.settings_bg)
                  
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  findViewById<Button>(R.id.btn_enable).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  findViewById<Button>(R.id.btn_select).setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  
                  val inputApi = findViewById<EditText>(R.id.input_api_key)
                  inputApi.setText(prefs.getString("api_key", ""))
                  findViewById<Button>(R.id.btn_save_api).setOnClickListener { 
                      prefs.edit().putString("api_key", inputApi.text.toString()).apply()
                      Toast.makeText(this, "Key Saved!", Toast.LENGTH_SHORT).show() 
                  }

                  val seekKbSize = findViewById<SeekBar>(R.id.seek_kb_size)
                  val tvKbSize = findViewById<TextView>(R.id.tv_kb_size)
                  val savedKbScale = prefs.getFloat("kb_scale", 1.0f)
                  seekKbSize.progress = ((savedKbScale - 0.5f) * 100).toInt()
                  tvKbSize.text = "حجم الكيبورد (الارتفاع): ${(savedKbScale * 100).toInt()}%"
                  seekKbSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          val scale = 0.5f + (progress / 100f)
                          tvKbSize.text = "حجم الكيبورد (الارتفاع): ${(scale * 100).toInt()}%"
                          prefs.edit().putFloat("kb_scale", scale).apply()
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  val seekTextSize = findViewById<SeekBar>(R.id.seek_text_size)
                  val tvTextSize = findViewById<TextView>(R.id.tv_text_size)
                  val savedTextScale = prefs.getFloat("text_scale", 1.0f)
                  seekTextSize.progress = ((savedTextScale - 0.5f) * 100).toInt()
                  tvTextSize.text = "حجم خط الحروف: ${(savedTextScale * 100).toInt()}%"
                  seekTextSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          val scale = 0.5f + (progress / 100f)
                          tvTextSize.text = "حجم خط الحروف: ${(scale * 100).toInt()}%"
                          prefs.edit().putFloat("text_scale", scale).apply()
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
                  
                  val switchVibrate = findViewById<Switch>(R.id.switch_vibrate)
                  switchVibrate.isChecked = prefs.getBoolean("vibrate", true)
                  switchVibrate.setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean("vibrate", isChecked).apply() }
              }
          }
          EOF

          # ---- الكيبورد المطابق لـ iOS بنسبة 100% (The iOS Replica) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          
          import android.content.Context
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.widget.ScrollView
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter
          import java.lang.StringBuilder

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "AR"
              
              private lateinit var rootFrame: FrameLayout
              private lateinit var mainLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var aiContainer: ScrollView
              private lateinit var keyPreviewBubble: TextView
              
              private lateinit var sug1: TextView
              private lateinit var sug2: TextView
              private lateinit var sug3: TextView
              
              private lateinit var prefs: SharedPreferences
              private lateinit var vibrator: Vibrator
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              
              private val keyViews = ArrayList<ArrayList<TextView>>()
              private val currentTypedWord = StringBuilder()
              private var userDict = mutableSetOf<String>()

              private val arDict = arrayOf("السلام", "عليكم", "مرحبا", "كيف", "حالك", "شكرا", "صباح", "الخير", "مساء", "الحمد", "لله", "اليوم", "غدا", "الآن", "ممكن", "عفوا", "جميل", "جدا", "رائع", "نعم", "لا")
              private val enDict = arrayOf("hello", "how", "are", "you", "good", "morning", "night", "thanks", "thank", "please", "what", "time", "this", "that", "have", "been", "would", "could", "should")

              data class KeyDef(val label: String, val weight: Float)
              data class LayoutData(val weightSum: Float, val rows: List<List<KeyDef>>)

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  userDict = prefs.getStringSet("user_dict", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  density = resources.displayMetrics.density
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val sugColorInt = ContextCompat.getColor(this, R.color.suggestion_text)
                  window?.window?.navigationBarColor = bgColor

                  rootFrame = FrameLayout(this).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.TRANSPARENT) 
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (44 * density).toInt())
                      setPadding((8*density).toInt(), 0, (8*density).toInt(), 0)
                  }
                  
                  val suggestionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                      gravity = Gravity.CENTER
                  }
                  
                  fun createSugView(): TextView {
                      return TextView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          gravity = Gravity.CENTER; textSize = 15f; typeface = Typeface.DEFAULT; setTextColor(sugColorInt); isClickable = true
                          setOnClickListener { applySuggestion(this.text.toString()); vibrate() }
                      }
                  }
                  
                  sug1 = createSugView(); sug2 = createSugView(); sug3 = createSugView()
                  suggestionContainer.addView(sug1); suggestionContainer.addView(sug2); suggestionContainer.addView(sug3)
                  toolbar.addView(suggestionContainer)
                  
                  val aiButton = TextView(this).apply {
                      text = "AI ✨"
                      setTextColor(Color.WHITE); textSize = 13f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(ContextCompat.getColor(this@KeyboardService, R.color.ios_blue)) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (32 * density).toInt()).apply { setMargins((8*density).toInt(), 0, 0, 0) }
                      setPadding((16*density).toInt(), 0, (16*density).toInt(), 0)
                      setOnClickListener { vibrate(); toggleAiMenu() }
                  }
                  toolbar.addView(aiButton)
                  mainLayout.addView(toolbar)

                  keysContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setPadding(0, (2*density).toInt(), 0, (6*density).toInt()) } }
                  
                  aiContainer = ScrollView(this).apply { visibility = View.GONE; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  val aiGrid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding((16*density).toInt(), (16*density).toInt(), (16*density).toInt(), (16*density).toInt()) }
                  fun addAiOption(title: String, desc: String, iconStr: String, colorStr: String, actionType: String) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setBackgroundResource(R.drawable.bg_settings_card)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, (12*density).toInt()) }
                          setPadding((16*density).toInt(), (16*density).toInt(), (16*density).toInt(), (16*density).toInt())
                          setOnClickListener { vibrate(); performAiAction(actionType, this, title) }
                      }
                      val iconView = TextView(this).apply {
                          text = iconStr; textSize = 24f; gravity = Gravity.CENTER; background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor(colorStr)); alpha = 40 }
                          layoutParams = LinearLayout.LayoutParams((48*density).toInt(), (48*density).toInt()).apply { setMargins(0, 0, (16*density).toInt(), 0) }
                      }
                      val textLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                      textLayout.addView(TextView(this).apply { text = title; textSize = 16f; setTextColor(textColorInt); typeface = Typeface.DEFAULT_BOLD })
                      textLayout.addView(TextView(this).apply { text = desc; textSize = 12f; setTextColor(sugColorInt) })
                      card.addView(iconView); card.addView(textLayout); aiGrid.addView(card)
                  }
                  addAiOption("تصحيح وتدقيق 📝", "يصلح كل الأخطاء الإملائية", "📝", "#FF9500", "FIX")
                  addAiOption("ترجمة فورية 🌍", "يترجم من وإلى الإنجليزية", "🌍", "#007AFF", "TRANSLATE")
                  addAiOption("رد ذكي ✨", "يقرأ ويكتب رداً ذكياً", "✨", "#34C759", "REPLY")
                  aiContainer.addView(aiGrid)

                  mainLayout.addView(keysContainer)
                  mainLayout.addView(aiContainer)
                  
                  keyPreviewBubble = TextView(this).apply {
                      textSize = 34f; setTextColor(textColorInt); gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 8f * density; visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams((48 * density).toInt(), (58 * density).toInt())
                  }

                  rootFrame.addView(mainLayout)
                  rootFrame.addView(keyPreviewBubble)

                  rebuildKeysLayout()
                  return rootFrame
              }

              private fun getLayoutData(): LayoutData {
                  if (isEmojiMode) {
                      return LayoutData(8f, listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍").map { KeyDef(it, 1f) },
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌").map { KeyDef(it, 1f) },
                          listOf(KeyDef("ABC", 1.5f), KeyDef("SPACE", 5f), KeyDef("DEL", 1.5f)),
                          emptyList()
                      ))
                  }

                  if (isSymbols) {
                      val isAr = currentLang == "AR"
                      val sum = if (isAr) 12f else 10f
                      val nums = if (isAr) listOf("١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "٠") else listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0")
                      return LayoutData(sum, listOf(
                          nums.map { KeyDef(it, sum / 10f) },
                          listOf("-", "/", ":", ";", "(", ")", "$", "&", "@", "\"").map { KeyDef(it, sum / 10f) },
                          listOf(KeyDef("ABC", 1.5f * (sum/10f))) + listOf(".", ",", "?", "!", "'").map { KeyDef(it, (sum - 3f*(sum/10f)) / 5f) } + listOf(KeyDef("DEL", 1.5f * (sum/10f))),
                          if (isAr) listOf(KeyDef("ABC", 2f), KeyDef("🌐", 1.25f), KeyDef("😊", 1.25f), KeyDef("SPACE", 5.5f), KeyDef("ENTER", 2f))
                          else listOf(KeyDef("ABC", 1.5f), KeyDef("🌐", 1f), KeyDef("😊", 1f), KeyDef("SPACE", 4f), KeyDef("ENTER", 2.5f))
                      ))
                  }
                  
                  return when (currentLang) {
                      "AR" -> {
                          val sum = 12f
                          val rows = if (isCaps) listOf(
                              listOf("َ", "ً", "ُ", "ٌ", "ِ", "ٍ", "ّ", "ْ", "أ", "إ", "آ", "[").map { KeyDef(it, 1f) },
                              listOf(KeyDef("SPACER", 0.5f)) + listOf("]", "{", "}", "(", ")", "<", ">", "\"", "'", ":", ";").map { KeyDef(it, 1f) } + listOf(KeyDef("SPACER", 0.5f)),
                              listOf(KeyDef("SHIFT", 1f)) + listOf("ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1f)),
                              listOf(KeyDef("?123", 1.5f), KeyDef("🌐", 1f), KeyDef("😊", 1f), KeyDef("SPACE", 7f), KeyDef("ENTER", 1.5f))
                          ) else listOf(
                              listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د").map { KeyDef(it, 1f) },
                              listOf(KeyDef("SPACER", 0.5f)) + listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط").map { KeyDef(it, 1f) } + listOf(KeyDef("SPACER", 0.5f)),
                              listOf(KeyDef("SHIFT", 1f)) + listOf("ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1f)),
                              listOf(KeyDef("?123", 1.5f), KeyDef("🌐", 1f), KeyDef("😊", 1f), KeyDef("SPACE", 7f), KeyDef("ENTER", 1.5f))
                          )
                          LayoutData(sum, rows)
                      }
                      else -> {
                          val sum = 10f
                          val rows = listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p").map { KeyDef(if (isCaps) it.uppercase() else it, 1f) },
                              listOf(KeyDef("SPACER", 0.5f)) + listOf("a", "s", "d", "f", "g", "h", "j", "k", "l").map { KeyDef(if (isCaps) it.uppercase() else it, 1f) } + listOf(KeyDef("SPACER", 0.5f)),
                              listOf(KeyDef("SHIFT", 1.5f)) + listOf("z", "x", "c", "v", "b", "n", "m").map { KeyDef(if (isCaps) it.uppercase() else it, 1f) } + listOf(KeyDef("DEL", 1.5f)),
                              listOf(KeyDef("?123", 1.5f), KeyDef("🌐", 1f), KeyDef("😊", 1f), KeyDef("SPACE", 4f), KeyDef("ENTER", 2.5f))
                          )
                          LayoutData(sum, rows)
                      }
                  }
              }

              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  rebuildKeysLayout()
              }

              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  keyViews.clear()
                  val kbScale = prefs.getFloat("kb_scale", 1.0f) 
                  val baseKeyHeight = (44 * density * kbScale).toInt() 
                  
                  for (r in 0 until 4) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight) }
                      val rowViews = ArrayList<TextView>()
                      for (c in 0 until 12) {
                          val keyView = TextView(this).apply {
                              gravity = Gravity.CENTER; isClickable = true
                              
                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> { 
                                          v.isPressed = true; vibrate()
                                          val txt = (v as TextView).tag.toString()
                                          if (txt.length == 1 && !isEmojiMode && txt != " " && txt != "😊" && txt != "🌐") {
                                              val loc = IntArray(2); v.getLocationInWindow(loc)
                                              val rootLoc = IntArray(2); rootFrame.getLocationInWindow(rootLoc)
                                              keyPreviewBubble.text = (v as TextView).text.toString()
                                              keyPreviewBubble.x = (loc[0] - rootLoc[0]).toFloat() - (keyPreviewBubble.layoutParams.width - v.width) / 2f
                                              keyPreviewBubble.y = (loc[1] - rootLoc[1]).toFloat() - keyPreviewBubble.layoutParams.height + (2*density)
                                              keyPreviewBubble.visibility = View.VISIBLE
                                          }
                                          true 
                                      }
                                      MotionEvent.ACTION_UP -> { 
                                          v.isPressed = false; keyPreviewBubble.visibility = View.GONE
                                          handleKeyClick(tag as String); true 
                                      }
                                      MotionEvent.ACTION_CANCEL -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; true }
                                      else -> false
                                  }
                              }
                          }
                          rowViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keyViews.add(rowViews)
                      keysContainer.addView(rowLayout)
                  }
                  refreshKeysData()
              }

              private fun refreshKeysData() {
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val textScale = prefs.getFloat("text_scale", 1.0f) 
                  val keyMarginHorizontal = (2f * density).toInt() 
                  val keyMarginVertical = (5f * density).toInt()

                  val layoutData = getLayoutData()

                  for (r in 0 until 4) {
                      val rowLayout = keysContainer.getChildAt(r) as LinearLayout
                      rowLayout.weightSum = layoutData.weightSum 
                      rowLayout.setPadding(0, keyMarginVertical/2, 0, keyMarginVertical/2)
                      
                      val dataRow = if (r < layoutData.rows.size) layoutData.rows[r] else emptyList()
                      val viewRow = keyViews[r]
                      
                      for (c in 0 until 12) {
                          val view = viewRow[c]
                          if (c < dataRow.size) {
                              val keyDef = dataRow[c]
                              val key = keyDef.label
                              val weight = keyDef.weight
                              
                              if (key == "SPACER") {
                                  view.visibility = View.INVISIBLE
                                  view.tag = ""
                                  (view.layoutParams as LinearLayout.LayoutParams).apply { this.weight = weight; setMargins(0,0,0,0) }
                              } else {
                                  view.visibility = View.VISIBLE
                                  view.tag = key
                                  
                                  val displayText = when (key) { "SHIFT" -> if (isCaps) "⇪" else "⇧"; "DEL" -> "⌫"; "ENTER" -> "إدخال"; "SPACE" -> "مسافة"; else -> key }
                                  view.text = displayText
                                  
                                  val baseTextSize = if (key.length > 1 && key != "😊" && key != "🌐") 13f else 22f
                                  view.textSize = baseTextSize * textScale
                                  
                                  val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT" || key == "😊"
                                  view.setBackgroundResource(when { key == "ENTER" -> R.drawable.key_enter_selector; isSpecial -> R.drawable.key_special_selector; else -> R.drawable.key_selector })
                                  view.setTextColor(if(key == "ENTER") Color.WHITE else textColorInt)
                                  view.typeface = Typeface.DEFAULT 
                                  
                                  (view.layoutParams as LinearLayout.LayoutParams).apply { this.weight = weight; setMargins(keyMarginHorizontal, 0, keyMarginHorizontal, 0) }
                              }
                          } else { view.visibility = View.GONE }
                      }
                  }
              }

              override fun onFinishInput() {
                  super.onFinishInput(); currentTypedWord.clear(); if(this::sug1.isInitialized) { sug1.text = ""; sug2.text = ""; sug3.text = "" }
                  keysContainer.visibility = View.VISIBLE; aiContainer.visibility = View.GONE
              }

              private fun updateSuggestions() {
                  if(!this::sug1.isInitialized) return
                  val word = currentTypedWord.toString()
                  if (word.length < 2 || isEmojiMode || isSymbols) { sug1.text = ""; sug2.text = ""; sug3.text = ""; return }
                  val dict = when(currentLang) { "AR" -> arDict; else -> enDict }
                  var count = 0; val matches = arrayOf("", "", "")
                  for (item in userDict) { if (item.length > word.length && item.startsWith(word, ignoreCase = true)) { matches[count] = item; count++; if (count == 3) break } }
                  if (count < 3) { for (item in dict) { if (item.length > word.length && item.startsWith(word, ignoreCase = true) && !matches.contains(item)) { matches[count] = item; count++; if (count == 3) break } } }
                  sug1.text = matches[0]; sug2.text = matches[1]; sug3.text = matches[2]
              }

              private fun applySuggestion(sug: String) {
                  if (sug.isEmpty()) return
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(currentTypedWord.length, 0); ic.commitText(sug + " ", 1); currentTypedWord.clear(); updateSuggestions()
              }

              private fun toggleAiMenu() { if (aiContainer.visibility == View.VISIBLE) { aiContainer.visibility = View.GONE; keysContainer.visibility = View.VISIBLE } else { keysContainer.visibility = View.GONE; aiContainer.visibility = View.VISIBLE } }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)); if (currentTypedWord.isNotEmpty()) currentTypedWord.deleteCharAt(currentTypedWord.length - 1) }
                      "SPACE", "ENTER" -> { 
                          if (key == "SPACE") ic.commitText(" ", 1) else { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                          val word = currentTypedWord.toString().trim()
                          if (word.length > 2 && !isEmojiMode && !isSymbols) { userDict.add(word); if (userDict.size > 500) userDict = userDict.drop(50).toMutableSet(); prefs.edit().putStringSet("user_dict", userDict).apply() }
                          currentTypedWord.clear() 
                      }
                      "SHIFT" -> { isCaps = !isCaps; refreshKeysData() }
                      "?123" -> { isSymbols = true; isEmojiMode = false; refreshKeysData() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; refreshKeysData() }
                      "🌐" -> { currentLang = if(currentLang == "EN") "AR" else "EN"; currentTypedWord.clear(); refreshKeysData() }
                      "😊" -> { isEmojiMode = true; refreshKeysData() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1); if (isCaps) { isCaps = false; refreshKeysData() }
                          if (key.length == 1 && !isSymbols && !isEmojiMode) { currentTypedWord.append(letter) }
                      }
                  }
                  updateSuggestions()
              }
              private fun vibrate() { if (!prefs.getBoolean("vibrate", true)) return; try { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) { vibrator.vibrate(VibrationEffect.createOneShot(12, VibrationEffect.DEFAULT_AMPLITUDE)) } else { @Suppress("DEPRECATION") vibrator.vibrate(12) } } catch (e: Exception) {} }
              private fun performAiAction(actionType: String, btn: LinearLayout, originalTitle: String) {
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ ضف المفتاح في الإعدادات", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  if (extractedText.isBlank() && actionType != "REPLY") { Toast.makeText(this, "لا يوجد نص", Toast.LENGTH_SHORT).show(); return }
                  val titleTextView = (btn.getChildAt(1) as LinearLayout).getChildAt(0) as TextView
                  titleTextView.text = "جاري المعالجة... ⏳"; btn.isEnabled = false; btn.alpha = 0.5f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = when (actionType) {
                                  "FIX" -> "أنت مدقق لغوي. قم بتصحيح الأخطاء الإملائية والنحوية للنص التالي، وأعد إرسال النص المصحح فقط بدون أي مقدمات: $extractedText"
                                  "TRANSLATE" -> "ترجم النص التالي. إذا كان بالعربية ترجمه للإنجليزية والعكس. أرسل الترجمة فقط: $extractedText"
                                  else -> "رد بشكل مهذب ومختصر على هذه الرسالة، أرسل الرد فقط بدون مقدمات: $extractedText"
                              }
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                          withContext(Dispatchers.Main) { 
                              if (actionType == "REPLY") { ic.commitText("\n" + reply + " ✨\n", 1) } else { ic.deleteSurroundingText(extractedText.length, 0); ic.commitText(reply, 1) }
                              toggleAiMenu() 
                          }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { Toast.makeText(this@KeyboardService, "فشل الاتصال", Toast.LENGTH_SHORT).show() } } 
                      finally { titleTextView.text = originalTitle; btn.isEnabled = true; btn.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase31.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase31.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v31.0
          name: "AI Keyboard Pro - Phase 31 (The Final Perfect iOS Replica 🍏)"
          body: "1. 🐛 إصلاح خطأ `Theme.AIKeyboard not found` الذي كان يمنع بناء التطبيق.\n2. 🍏 توزيعة الحروف العربية (12-11-10) دقيقة تماماً لتكون الأزرار عريضة ومتناسقة ومطابقة لتصميم أبل.\n3. 🧹 الشريط العلوي نظيف جداً وخالي من الأيقونات المزعجة للحفاظ على بساطة iOS.\n4. ✨ زر AI الأزرق متوفر بشكل أنيق جداً في الزاوية العلوية اليمنى.\n5. 📱 واجهة الإعدادات مطابقة لستايل (iOS Settings) مع أشرطة التمرير والتحكم بالحجم.\n6. 🌐😊 زر الإيموجي متوفر بجوار زر المسافة."
          files: release-output/AI-Keyboard-Pro-Phase31.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
