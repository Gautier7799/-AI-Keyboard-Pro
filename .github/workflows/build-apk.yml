name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/values-night app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 22; versionName = "15.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # ---- الألوان (بما في ذلك ألوان Material You الجذابة للأيقونات) ----
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="keyboard_bg">#F2F2F7</color>
              <color name="key_bg">#FFFFFF</color>
              <color name="key_bg_pressed">#D1D1D6</color>
              <color name="key_special_bg">#B3B8C1</color>
              <color name="key_special_bg_pressed">#9AA0AB</color>
              <color name="key_text">#000000</color>
              <color name="toolbar_bg">#FFFFFF</color>
              <color name="menu_pill_bg">#D1D1D6</color>
              <!-- ألوان الأيقونات الفاتحة -->
              <color name="icon_settings_bg">#D3E3FD</color>
              <color name="icon_settings_fg">#041E49</color>
              <color name="icon_emoji_bg">#FFDF99</color>
              <color name="icon_emoji_fg">#3E2723</color>
              <color name="icon_paste_bg">#C4EED0</color>
              <color name="icon_paste_fg">#072711</color>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <resources>
              <color name="keyboard_bg">#0A0C10</color>
              <color name="key_bg">#1C1C1E</color>
              <color name="key_bg_pressed">#2C2C2E</color>
              <color name="key_special_bg">#2C2C2E</color>
              <color name="key_special_bg_pressed">#3A3A3C</color>
              <color name="key_text">#FFFFFF</color>
              <color name="toolbar_bg">#1C1C1E</color>
              <color name="menu_pill_bg">#2C2C2E</color>
              <!-- ألوان الأيقونات الداكنة -->
              <color name="icon_settings_bg">#004A77</color>
              <color name="icon_settings_fg">#C2E7FF</color>
              <color name="icon_emoji_bg">#564419</color>
              <color name="icon_emoji_fg">#FFE082</color>
              <color name="icon_paste_bg">#0F5223</color>
              <color name="icon_paste_fg">#C4EECE</color>
          </resources>
          EOF

          # ---- خلفيات الأيقونات الدائرية (Material You) ----
          cat << 'EOF' > app/src/main/res/drawable/bg_icon_settings.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="@color/icon_settings_bg"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_icon_emoji.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="@color/icon_emoji_bg"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_icon_paste.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="@color/icon_paste_bg"/></shape>
          EOF

          # ---- الأيقونات نفسها بألوان Material You متناسقة ----
          cat << 'EOF' > app/src/main/res/drawable/ic_gear_colored.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_settings_fg" android:pathData="M19.4,13c0,-0.3 0,-0.7 0,-1s0,-0.7 0,-1l2.1,-1.7c0.2,-0.2 0.2,-0.4 0.1,-0.6l-2,-3.5c-0.1,-0.2 -0.4,-0.3 -0.6,-0.2l-2.5,1c-0.5,-0.4 -1.1,-0.7 -1.7,-1l-0.4,-2.6C14.4,2.2 14.2,2 14,2h-4c-0.2,0 -0.5,0.2 -0.5,0.4l-0.4,2.6c-0.6,0.3 -1.2,0.6 -1.7,1l-2.5,-1c-0.2,-0.1 -0.5,0 -0.6,0.2l-2,3.5c-0.1,0.2 -0.1,0.5 0.1,0.6l2.1,1.7c0,0.3 0,0.7 0,1s0,0.7 0,1l-2.1,1.7c-0.2,0.2 -0.2,0.4 -0.1,0.6l2,3.5c0.1,0.2 0.4,0.3 0.6,0.2l2.5,-1c0.5,0.4 1.1,0.7 1.7,1l0.4,2.6c0,0.2 0.3,0.4 0.5,0.4h4c0.2,0 0.5,-0.2 0.5,-0.4l0.4,-2.6c0.6,-0.3 1.2,-0.6 1.7,-1l2.5,1c0.2,0.1 0.5,0 0.6,-0.2l2,-3.5c0.1,-0.2 0.1,-0.5 -0.1,-0.6L19.4,13zM12,15.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5S13.9,15.5 12,15.5z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_smile_colored.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_emoji_fg" android:pathData="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8zM15.5,11c0.83,0 1.5,-0.67 1.5,-1.5S16.33,8 15.5,8 14,8.67 14,9.5s0.67,1.5 1.5,1.5zM8.5,11c0.83,0 1.5,-0.67 1.5,-1.5S9.33,8 8.5,8 7,8.67 7,9.5 7.67,11 8.5,11zM12,17.5c2.33,0 4.31,-1.46 5.11,-3.5H6.89c0.8,2.04 2.78,3.5 5.11,3.5z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_paste_colored.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="@color/icon_paste_fg" android:pathData="M19,2h-4.2C14.4,0.8 13.3,0 12,0c-1.3,0 -2.4,0.8 -2.8,2H5C3.9,2 3,2.9 3,4v16c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V4C21,2.9 20.1,2 19,2zM12,2c0.6,0 1,0.4 1,1s-0.4,1 -1,1 -1,-0.4 -1,-1S11.4,2 12,2zM19,20H5V4h2v3h10V4h2V20z"/></vector>
          EOF

          # ---- ملفات الرسم للأزرار ----
          cat << 'EOF' > app/src/main/res/drawable/bg_toolbar.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/toolbar_bg"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_menu_pill.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/menu_pill_bg"/><corners android:radius="20dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_bg_pressed"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_pressed" /><item android:drawable="@drawable/bg_key" /></selector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_special_bg"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_special_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/key_special_bg_pressed"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_special_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_special_pressed" /><item android:drawable="@drawable/bg_key_special" /></selector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#007AFF"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_key_enter_pressed.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#005BB5"/><corners android:radius="8dp"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/key_enter_selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true" android:drawable="@drawable/bg_key_enter_pressed" /><item android:drawable="@drawable/bg_key_enter" /></selector>
          EOF

          # ---- إعدادات التطبيق ----
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">AI Keyboard Pro</string><string name="ime_name">AI Keyboard Pro ✨</string></resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AIKeyboard" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowLightStatusBar">?attr/isLightTheme</item></style></resources>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#9ECAFF" android:pathData="M54,20 C54,40 40,54 20,54 C40,54 54,68 54,88 C54,68 68,54 88,54 C68,54 54,40 54,20 Z"/><path android:fillColor="#34D399" android:pathData="M75,25 C75,32 68,37 60,37 C68,37 75,44 75,52 C75,44 82,37 90,37 C82,37 75,32 75,25 Z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true"><subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" /></input-method>
          EOF

          # ---- واجهة التفعيل ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setTheme(R.style.Theme_AIKeyboard)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(60, 60, 60, 60) }
                  root.addView(TextView(this).apply { text = "AI Keyboard Pro ✨"; textSize = 28f; setTextColor(Color.GRAY); paintFlags = paintFlags or android.graphics.Paint.FAKE_BOLD_TEXT_FLAG; setPadding(0,0,0,40) })
                  val btn = Button(this).apply {
                      text = "تفعيل الكيبورد"; setTextColor(Color.WHITE); textSize = 18f
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#007AFF")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 150)
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  }
                  root.addView(btn)
                  val btn2 = Button(this).apply {
                      text = "اختيار الكيبورد"; setTextColor(Color.WHITE); textSize = 18f
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 150).apply { setMargins(0,30,0,0) }
                      setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  }
                  root.addView(btn2)
                  setContentView(root)
              }
          }
          EOF

          # ---- لوحة المفاتيح: الأيقونات الجميلة + مساحة التصحيح + حل جذري للاهتزاز (صفر لاق) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.PopupWindow
          import android.widget.Toast
          import android.widget.ScrollView
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var isEmojiMode = false
              private var currentLang = "EN"
              
              private lateinit var rootLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var menuContainer: ScrollView
              private lateinit var prefs: SharedPreferences
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              private var currentPopup: PopupWindow? = null

              private val keyViews = ArrayList<ArrayList<TextView>>()

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  density = resources.displayMetrics.density
                  
                  val bgColor = ContextCompat.getColor(this, R.color.keyboard_bg)
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  window?.window?.navigationBarColor = bgColor

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgColor)
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  // 1. شريط الأدوات (أيقونات Material You + مساحة التصحيح)
                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(bgColor) 
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (50 * density).toInt())
                      setPadding((8*density).toInt(), 0, (8*density).toInt(), 0)
                  }
                  rootLayout.addView(toolbar)
                  
                  fun addMaterialIcon(iconResId: Int, bgResId: Int, action: () -> Unit) {
                      val img = ImageView(this).apply {
                          setImageResource(iconResId)
                          setBackgroundResource(bgResId)
                          val size = (36 * density).toInt()
                          layoutParams = LinearLayout.LayoutParams(size, size).apply { setMargins(0, 0, (10*density).toInt(), 0) }
                          val p = (8 * density).toInt()
                          setPadding(p, p, p, p)
                          setOnClickListener { vibrate(this); action() }
                      }
                      toolbar.addView(img)
                  }

                  // أيقونات جميلة جداً على اليسار
                  addMaterialIcon(R.drawable.ic_gear_colored, R.drawable.bg_icon_settings) { toggleMenu() }
                  addMaterialIcon(R.drawable.ic_smile_colored, R.drawable.bg_icon_emoji) { isEmojiMode = !isEmojiMode; refreshKeysData() }
                  addMaterialIcon(R.drawable.ic_paste_colored, R.drawable.bg_icon_paste) { 
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val textToPaste = clipboard.primaryClip?.getItemAt(0)?.text
                      if (textToPaste != null) currentInputConnection?.commitText(textToPaste, 1)
                  }
                  
                  // مساحة فارغة في المنتصف (لتصحيح الكلمات و Gemini مستقبلاً)
                  val suggestionSpace = TextView(this).apply {
                      text = "" // فارغ كما طلبت لترك مساحة
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }
                  toolbar.addView(suggestionSpace)
                  
                  // زر الذكاء الاصطناعي على اليمين
                  val aiButton = TextView(this).apply {
                      text = "✨ AI Reply"
                      setTextColor(Color.WHITE); textSize = 14f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#34D399")) }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (36 * density).toInt())
                      setPadding((16*density).toInt(), 0, (16*density).toInt(), 0)
                      setOnClickListener { vibrate(this); generateAiResponse(this) }
                  }
                  toolbar.addView(aiButton)

                  // 2. حاوية الأزرار
                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(6, 6, 6, 12) }
                  }
                  
                  // 3. القائمة الداخلية (الإعدادات)
                  menuContainer = ScrollView(this).apply {
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (240 * density).toInt())
                  }
                  val menuGrid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 20, 40, 20) }
                  
                  fun addMenuPill(title: String, iconStr: String, action: () -> Unit) {
                      val pill = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          setBackgroundResource(R.drawable.bg_menu_pill)
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (56 * density).toInt()).apply { setMargins(0, 0, 0, 20) }
                          setPadding(40, 0, 40, 0)
                          setOnClickListener { vibrate(this); action() }
                      }
                      pill.addView(TextView(this).apply { text = iconStr; textSize = 22f; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply{ setMargins(0,0,40,0) } })
                      pill.addView(TextView(this).apply { text = title; textSize = 16f; setTextColor(textColorInt); typeface = Typeface.DEFAULT_BOLD })
                      menuGrid.addView(pill)
                  }
                  
                  addMenuPill("الاهتزاز (Vibration)", "📳") { 
                      val current = prefs.getBoolean("vibrate", true); prefs.edit().putBoolean("vibrate", !current).apply(); Toast.makeText(this, if(!current) "مفعل" else "معطل", Toast.LENGTH_SHORT).show()
                  }
                  addMenuPill("لصق مفتاح Gemini (API Key)", "🔑") { 
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val txt = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                      if (txt.isNotEmpty()) { prefs.edit().putString("api_key", txt).apply(); Toast.makeText(this, "تم حفظ المفتاح!", Toast.LENGTH_SHORT).show() }
                  }
                  addMenuPill("رجوع", "🔙") { toggleMenu() }
                  
                  menuContainer.addView(menuGrid)
                  
                  rootLayout.addView(keysContainer)
                  rootLayout.addView(menuContainer)

                  rebuildKeysLayout()
                  return rootLayout
              }

              private fun toggleMenu() {
                  if (keysContainer.visibility == View.VISIBLE) {
                      keysContainer.visibility = View.GONE; menuContainer.visibility = View.VISIBLE
                  } else {
                      keysContainer.visibility = View.VISIBLE; menuContainer.visibility = View.GONE
                  }
              }

              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  keyViews.clear()
                  val sizeMultiplier = 1.0f + (prefs.getInt("kb_size", 2) * 0.1f) 
                  val baseKeyHeight = (54 * density * sizeMultiplier).toInt() 
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)

                  for (r in 0 until 4) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight) }
                      val rowViews = ArrayList<TextView>()
                      for (c in 0 until 12) {
                          val keyView = TextView(this).apply {
                              gravity = Gravity.CENTER
                              typeface = Typeface.DEFAULT
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { setMargins(5, (6*sizeMultiplier).toInt(), 5, (6*sizeMultiplier).toInt()) }
                              layoutParams = lp; isClickable = true
                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> { vibrate(v); showPopup(v, text.toString(), textColorInt); false } 
                                      MotionEvent.ACTION_UP -> { currentPopup?.dismiss(); handleKeyClick(tag as String); false }
                                      MotionEvent.ACTION_CANCEL -> { currentPopup?.dismiss(); false }
                                      else -> false
                                  }
                              }
                          }
                          rowViews.add(keyView)
                          rowLayout.addView(keyView)
                      }
                      keyViews.add(rowViews)
                      keysContainer.addView(rowLayout)
                  }
                  refreshKeysData()
              }

              private fun refreshKeysData() {
                  val textColorInt = ContextCompat.getColor(this, R.color.key_text)
                  val rowsData = if (isEmojiMode) {
                      listOf(
                          listOf("😀", "😂", "🥰", "😎", "🤔", "😭", "🙏", "👍"),
                          listOf("❤️", "🔥", "✨", "💯", "🎉", "⭐", "✅", "❌"),
                          listOf("ABC", "SPACE", "DEL", "ENTER")
                      )
                  } else if (isSymbols) {
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          "AR" -> listOf(
                              listOf("ذ", "ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط", "د"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (r in 0 until 4) {
                      val dataRow = if (r < rowsData.size) rowsData[r] else emptyList()
                      val viewRow = keyViews[r]
                      for (c in 0 until 12) {
                          val view = viewRow[c]
                          if (c < dataRow.size) {
                              val key = dataRow[c]
                              view.visibility = View.VISIBLE
                              view.tag = key
                              val displayText = when (key) { "SHIFT" -> if (isCaps) "⇪" else "⇧"; "DEL" -> "⌫"; "ENTER" -> "⏎"; else -> if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key }
                              view.text = displayText
                              view.textSize = if (isEmojiMode && key.length == 2) 30f else if (key == "🌐" || key == "?123" || key == "ABC") 15f else 26f
                              
                              val isSpecial = key.length > 2 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              view.setBackgroundResource(when { key == "ENTER" -> R.drawable.key_enter_selector; isSpecial -> R.drawable.key_special_selector; else -> R.drawable.key_selector })
                              view.setTextColor(if(key == "ENTER") Color.WHITE else textColorInt)
                              
                              val weight = when (key) { "SPACE" -> 4.5f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "🌐" -> 1.2f; else -> 1f }
                              (view.layoutParams as LinearLayout.LayoutParams).weight = weight
                          } else {
                              view.visibility = View.GONE
                          }
                      }
                  }
              }

              private fun showPopup(keyView: View, text: String, txtColorInt: Int) {
                  if (!prefs.getBoolean("popup", true) || text.length > 1 || isEmojiMode) return
                  val popupView = TextView(this).apply {
                      this.text = text; textSize = 40f; setTextColor(txtColorInt); gravity = Gravity.CENTER; setBackgroundResource(R.drawable.bg_key); elevation = 8f * density
                  }
                  currentPopup = PopupWindow(popupView, (keyView.width * 1.5).toInt(), (keyView.height * 1.5).toInt()).apply { isClippingEnabled = false; showAsDropDown(keyView, -(keyView.width * 0.25).toInt(), -(keyView.height * 2.2).toInt()) }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)) }
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }
                      "SHIFT" -> { isCaps = !isCaps; refreshKeysData() }
                      "?123" -> { isSymbols = true; isEmojiMode = false; refreshKeysData() }
                      "ABC" -> { isSymbols = false; isEmojiMode = false; refreshKeysData() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; refreshKeysData() }
                      else -> {
                          val letter = if (isCaps && !isSymbols && !isEmojiMode && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }

              // السر في القضاء على اللاق (استخدام الهاردوير بدلا من السوفتوير)
              private fun vibrate(view: View) {
                  if (prefs.getBoolean("vibrate", true)) {
                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP, HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING)
                  }
              }

              private fun generateAiResponse(btn: TextView) {
                  val apiKey = prefs.getString("api_key", "")
                  if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "⚠️ ضع المفتاح في الإعدادات أولاً", Toast.LENGTH_LONG).show(); return }
                  val ic = currentInputConnection ?: return
                  val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  btn.text = "⏳ Typing..."; btn.isEnabled = false; btn.alpha = 0.7f
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) {
                              val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true
                              val prompt = if (extractedText.isNotBlank()) "You are an AI keyboard assistant. Reply naturally to: $extractedText" else "Write a short greeting."
                              val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }
                              OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                              conn.inputStream.bufferedReader().use { it.readText() }
                          }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          withContext(Dispatchers.Main) { ic.commitText("\n" + reply.trim() + " ✨\n", 1) }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { ic.commitText("\n[AI Error]\n", 1) } } 
                      finally { btn.text = "✨ AI Reply"; btn.isEnabled = true; btn.alpha = 1.0f }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase15.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase15.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v15.0
          name: "AI Keyboard Pro - Phase 15 (Material You Icons & Zero Lag ✨)"
          body: "1. أيقونات Material You أصلية (دائرية ملونة) تتفوق على تصميم iOS.\n2. ترك مساحة فارغة واسعة في شريط الأدوات تمهيداً لإضافة تصحيح الكلمات و Gemini.\n3. القضاء التام على ה-Lag عن طريق استخدام Hardware Haptic Feedback بدلاً من Software Vibrator."
          files: release-output/AI-Keyboard-Pro-Phase15.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
