name: Build AI Keyboard Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AI Keyboard Pro
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/java/com/aikeyboard/pro

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 6; versionName = "4.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard</string>
              <string name="ime_name">AI Keyboard Pro ✨</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#9ECAFF" android:pathData="M54,20 C54,40 40,54 20,54 C40,54 54,68 54,88 C54,68 68,54 88,54 C68,54 54,40 54,20 Z"/>
              <path android:fillColor="#34D399" android:pathData="M75,25 C75,32 68,37 60,37 C68,37 75,44 75,52 C75,44 82,37 90,37 C82,37 75,32 75,25 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="en_US" android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # ---- تطبيق الإعدادات المطور ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  val scrollView = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0A0C10")) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 100, 60, 100)
                  }
                  scrollView.addView(root)

                  val title = TextView(this).apply {
                      text = "إعدادات AI Keyboard ✨"
                      setTextColor(Color.WHITE)
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 80)
                  }
                  root.addView(title)
                  
                  fun createButton(textStr: String, colorStr: String, action: () -> Unit) {
                      val btn = Button(this).apply {
                          text = textStr; setTextColor(Color.parseColor("#0A0C10")); textSize = 16f
                          background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 100f; setColor(Color.parseColor(colorStr)) }
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 150).apply { setMargins(0, 0, 0, 40) }
                          setOnClickListener { action() }
                      }
                      root.addView(btn)
                  }

                  createButton("1. تفعيل اللوحة (Activer)", "#9ECAFF") { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  createButton("2. اختيار اللوحة (Sélectionner)", "#34D399") { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }

                  val settingsCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 30f; setColor(Color.parseColor("#14171E")) }
                      setPadding(50, 50, 50, 50)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 40, 0, 0) }
                  }

                  fun createSwitch(title: String, key: String, default: Boolean) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 120) }
                      val tv = TextView(this).apply { text = title; setTextColor(Color.WHITE); textSize = 16f; layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                      val sw = Switch(this).apply {
                          isChecked = prefs.getBoolean(key, default)
                          setOnCheckedChangeListener { _, isChecked -> prefs.edit().putBoolean(key, isChecked).apply() }
                      }
                      row.addView(tv); row.addView(sw); settingsCard.addView(row)
                  }

                  createSwitch("المظهر الفاتح (Thème Clair)", "light_theme", false)
                  createSwitch("اهتزاز (Vibreur)", "vibrate", true)
                  createSwitch("انبثاق الحرف (Pop-up)", "popup", true)

                  // شريط التحكم بالحجم
                  val sizeLabel = TextView(this).apply {
                      text = "حجم اللوحة (Taille du clavier)"; setTextColor(Color.WHITE); textSize = 16f; setPadding(0, 40, 0, 20)
                  }
                  settingsCard.addView(sizeLabel)

                  val sizeSeekBar = SeekBar(this).apply {
                      max = 4 // 0 to 4 (2 is default/normal)
                      progress = prefs.getInt("kb_size", 2)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              prefs.edit().putInt("kb_size", progress).apply()
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  settingsCard.addView(sizeSeekBar)

                  root.addView(settingsCard)
                  setContentView(scrollView)
              }
          }
          EOF

          # ---- لوحة المفاتيح المطورة ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          import android.content.Context
          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.widget.HorizontalScrollView
          import android.widget.PopupWindow

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var currentLang = "EN"
              private var rootLayout: LinearLayout? = null
              private var keysContainer: LinearLayout? = null
              private var currentPopup: PopupWindow? = null
              private lateinit var vibrator: Vibrator

              // Theme Variables
              private var isLight = false
              private var bgColor = ""
              private var keyNormalColor = ""
              private var keySpecialColor = ""
              private var textColor = ""

              override fun onCreateInputView(): View {
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  val density = resources.displayMetrics.density
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  // Load Theme
                  isLight = prefs.getBoolean("light_theme", false)
                  bgColor = if (isLight) "#D1D4D9" else "#0A0C10" // خلفية رمادية فاتحة لـ iOS Light أو أسود
                  keyNormalColor = if (isLight) "#FFFFFF" else "#43464D"
                  keySpecialColor = if (isLight) "#B3B8C1" else "#2C2F36"
                  textColor = if (isLight) "#000000" else "#FFFFFF"

                  window?.window?.navigationBarColor = Color.parseColor(bgColor)

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(Color.parseColor(bgColor))
                          cornerRadii = floatArrayOf(24f*density, 24f*density, 24f*density, 24f*density, 0f, 0f, 0f, 0f)
                      }
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  val suggestionsBar = HorizontalScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (45 * density).toInt())
                      isFillViewport = true
                      isHorizontalScrollBarEnabled = false
                  }
                  
                  val suggestionsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setPadding(20, 0, 20, 0)
                  }
                  
                  val settingsBtn = TextView(this).apply {
                      text = "⚙️"; textSize = 18f; setPadding(40, 0, 40, 0); gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setOnClickListener {
                          vibrate()
                          val intent = Intent(this@KeyboardService, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          startActivity(intent)
                      }
                  }
                  suggestionsContainer.addView(settingsBtn)
                  
                  val dummySuggestions = listOf("مرحباً", "كيف حالك؟", "أنا قادم", "✨ AI Reply")
                  for (word in dummySuggestions) {
                      val tv = TextView(this).apply {
                          text = word; setTextColor(Color.parseColor(if(word.contains("✨")) "#34D399" else textColor)); textSize = 15f
                          setPadding(40, 0, 40, 0); gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT)
                          setOnClickListener { vibrate(); currentInputConnection?.commitText("$word ", 1) }
                      }
                      suggestionsContainer.addView(tv)
                  }
                  suggestionsBar.addView(suggestionsContainer)
                  rootLayout?.addView(suggestionsBar)

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(10, 10, 10, 10) }
                  }
                  rootLayout?.addView(keysContainer)

                  buildKeys()
                  return rootLayout!!
              }

              private fun vibrate() {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vibrate", true)) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createOneShot(20, 100))
                      else vibrator.vibrate(20)
                  }
              }

              private fun showPopup(keyView: View, text: String, density: Float) {
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("popup", true) || text.length > 1) return

                  val popupView = TextView(this).apply {
                      this.text = text; textSize = 36f; setTextColor(Color.parseColor(textColor)); gravity = Gravity.CENTER
                      background = GradientDrawable().apply { setColor(Color.parseColor(keyNormalColor)); cornerRadius = 16f * density }
                      elevation = 10f
                  }
                  currentPopup = PopupWindow(popupView, (keyView.width * 1.5).toInt(), (keyView.height * 1.5).toInt()).apply {
                      isClippingEnabled = false
                      showAsDropDown(keyView, -(keyView.width * 0.25).toInt(), -(keyView.height * 2.2).toInt())
                  }
              }

              private fun buildKeys() {
                  keysContainer?.removeAllViews()
                  val density = resources.displayMetrics.density
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  
                  // حساب حجم الأزرار بناءً على الإعدادات (0 = صغير جداً, 2 = طبيعي, 4 = كبير جداً)
                  val sizeMultiplier = 0.8f + (prefs.getInt("kb_size", 2) * 0.1f)
                  val baseKeyHeight = (62 * density * sizeMultiplier).toInt()

                  val rows = if (isSymbols) {
                      listOf(
                          listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0"),
                          listOf("@", "#", "$", "_", "&", "-", "+", "(", ")", "/"),
                          listOf("=", "*", "\"", "'", ":", ";", "!", "?", "DEL"),
                          listOf("ABC", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                      )
                  } else {
                      when (currentLang) {
                          "AR" -> listOf(
                              listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"),
                              listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"),
                              listOf("SHIFT", "ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                          "FR" -> listOf(
                              listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m"),
                              listOf("SHIFT", "w", "x", "c", "v", "b", "n", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                          else -> listOf(
                              listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p"),
                              listOf("a", "s", "d", "f", "g", "h", "j", "k", "l"),
                              listOf("SHIFT", "z", "x", "c", "v", "b", "n", "m", "DEL"),
                              listOf("?123", "🌐", "AI ✨", "SPACE", ".", "ENTER")
                          )
                      }
                  }

                  for (rowKeys in rows) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight)
                      }
                      for (key in rowKeys) {
                          val keyView = TextView(this).apply {
                              // تحويل النصوص إلى أيقونات iOS
                              val displayText = when (key) {
                                  "SHIFT" -> if (isCaps) "⇪" else "⇧"
                                  "DEL" -> "⌫"
                                  "ENTER" -> "⏎"
                                  else -> if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key
                              }

                              text = displayText
                              textSize = if (key == "AI ✨" || key == "🌐" || key == "?123" || key == "ABC") 15f else 24f
                              gravity = Gravity.CENTER
                              
                              val isSpecial = key.length > 1 || key == "🌐" || key == "DEL" || key == "SHIFT"
                              val keyBgColorStr = when (key) { 
                                  "AI ✨" -> if(isLight) "#FFFFFF" else "#1C202B"
                                  "ENTER" -> "#007AFF"
                                  else -> if (isSpecial) keySpecialColor else keyNormalColor 
                              }
                              val keyBgColor = Color.parseColor(keyBgColorStr)

                              setTextColor(Color.parseColor(if(key == "AI ✨") "#34D399" else if(key == "ENTER") "#FFFFFF" else textColor))
                              background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 12f * density; setColor(keyBgColor) }

                              val weight = when (key) { "SPACE" -> 4f; "ENTER" -> 1.8f; "SHIFT", "DEL", "?123", "ABC" -> 1.5f; "AI ✨", "🌐" -> 1.2f; else -> 1f }
                              val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, weight)
                              lp.setMargins(6, (8*sizeMultiplier).toInt(), 6, (8*sizeMultiplier).toInt()); layoutParams = lp; isClickable = true

                              setOnTouchListener { v, event ->
                                  when (event.action) {
                                      MotionEvent.ACTION_DOWN -> {
                                          vibrate(); showPopup(v, displayText, density)
                                          (v.background as GradientDrawable).setColor(Color.parseColor(if(isLight) "#B3B8C1" else "#5A5D66"))
                                          true
                                      }
                                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                          currentPopup?.dismiss(); currentPopup = null
                                          (v.background as GradientDrawable).setColor(keyBgColor)
                                          if (event.action == MotionEvent.ACTION_UP) handleKeyClick(key)
                                          true
                                      }
                                      else -> false
                                  }
                              }
                          }
                          rowLayout.addView(keyView)
                      }
                      keysContainer?.addView(rowLayout)
                  }
              }

              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> ic.deleteSurroundingText(1, 0)
                      "SPACE" -> ic.commitText(" ", 1)
                      "ENTER" -> { ic.performEditorAction(android.view.inputmethod.EditorInfo.IME_ACTION_GO); ic.commitText("\n", 1) }
                      "SHIFT" -> { isCaps = !isCaps; buildKeys() }
                      "?123" -> { isSymbols = true; buildKeys() }
                      "ABC" -> { isSymbols = false; buildKeys() }
                      "🌐" -> { currentLang = when(currentLang) { "EN" -> "AR"; "AR" -> "FR"; else -> "EN" }; buildKeys() }
                      "AI ✨" -> { ic.commitText(" [AI Magic!] ", 1) }
                      else -> {
                          val letter = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key
                          ic.commitText(letter, 1)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/AI-Keyboard-Pro-Phase4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Keyboard-Pro
          path: release-output/AI-Keyboard-Pro-Phase4.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: aikeyboard-v4.0
          name: "AI Keyboard Pro - Phase 4 (iOS Icons & Pro Settings)"
          body: "1. تحويل النصوص (SHIFT, DEL, ENTER) إلى أيقونات iOS (⇧, ⌫, ⏎).\n2. إضافة الثيم الفاتح (Light Theme) بألوان iOS.\n3. إضافة شريط للتحكم بحجم اللوحة وتكبيرها."
          files: release-output/AI-Keyboard-Pro-Phase4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
