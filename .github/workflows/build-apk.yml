name: Build AI Keyboard Pro Ultimate

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for AI Keyboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Ultimate Keyboard Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/aikeyboard/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AIKeyboardPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aikeyboard.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.aikeyboard.pro"; minSdk = 28; targetSdk = 34; versionCode = 11; versionName = "11.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Keyboard Pro</string>
              <string name="ime_name">iOS 26 Keyboard</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1C1C1E"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#007AFF" android:pathData="M34,54h40v10h-40zM34,34h40v10h-40zM34,74h20v10h-20z"/></vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/kb_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#101010" />
              <corners android:topLeftRadius="16dp" android:topRightRadius="16dp" />
          </shape>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" android:supportsInlineSuggestions="true">
              <subtype android:imeSubtypeLocale="ar_AE" android:imeSubtypeMode="keyboard" />
              <subtype android:imeSubtypeLocale="fr_FR" android:imeSubtypeMode="keyboard" />
          </input-method>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.PopupWindow
          import android.widget.TextView

          class KeyboardService : InputMethodService() {
              private val iosKeyNormalBg = Color.parseColor("#3A3A3C")
              private val iosKeyControlBg = Color.parseColor("#2C2C2E")
              private val iosActionBlueColor = Color.parseColor("#007AFF")
              private val iosTxtWhiteColor = Color.parseColor("#FFFFFF")
              
              private var isArabic = false
              private var isShifted = false
              private var keyboardMode = 0 // 0: Text, 1: Numbers, 2: Symbols
              private var keyHeightDp = 42f
              
              private lateinit var prefs: SharedPreferences
              private lateinit var vibrator: Vibrator
              private val handler = Handler(Looper.getMainLooper())
              
              private lateinit var rootLayout: LinearLayout
              private lateinit var headerContainer: LinearLayout
              private lateinit var predictionContainer: LinearLayout
              private lateinit var toolbarContainer: LinearLayout
              private lateinit var sliderContainer: View
              private lateinit var keysContainer: LinearLayout
              
              private val keyViews = mutableListOf<View>()
              private var popupWindow: PopupWindow? = null
              private var popupTextView: TextView? = null
              private var altPopupWindow: PopupWindow? = null
              private val altViews = mutableListOf<TextView>()

              // Mini Dictionary
              private val arabicDict = listOf("مرحبا", "شكرا", "السلام", "عليكم", "نعم", "لا", "كيف", "حالك", "إن", "شاء", "الله")
              private val frenchDict = listOf("bonjour", "merci", "oui", "non", "comment", "ça", "va", "salut", "bien", "pourquoi")

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("kb_settings", Context.MODE_PRIVATE)
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              }

              override fun onCreateInputView(): View {
                  keyViews.clear()
                  keyHeightDp = prefs.getFloat("key_height", 42f)
                  val dp = resources.displayMetrics.density

                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundResource(R.drawable.kb_background)
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding((4 * dp).toInt(), (8 * dp).toInt(), (4 * dp).toInt(), (8 * dp).toInt())
                  }

                  // Top Header Container (holds Toggle + Predictions/Toolbar)
                  headerContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (40 * dp).toInt())
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  // Material You Square Toggle Button
                  val toggleBtn = TextView(this).apply {
                      text = "⊞"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams((40 * dp).toInt(), (40 * dp).toInt()).apply {
                          setMargins(0, 0, (8 * dp).toInt(), 0)
                      }
                      background = getRoundRect(iosKeyControlBg, 12f * dp) // Material You Square-ish
                      setOnClickListener {
                          vibrate()
                          if (toolbarContainer.visibility == View.VISIBLE) {
                              toolbarContainer.visibility = View.GONE
                              predictionContainer.visibility = View.VISIBLE
                          } else {
                              toolbarContainer.visibility = View.VISIBLE
                              predictionContainer.visibility = View.GONE
                              sliderContainer.visibility = View.GONE
                          }
                      }
                  }

                  val dynamicArea = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                  }

                  // 1. Predictions Container
                  predictionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  
                  // 2. Toolbar Container (Hidden by default)
                  toolbarContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER_VERTICAL
                      visibility = View.GONE
                  }
                  toolbarContainer.addView(createQuickSettingPill("😊", "رموز") {})
                  toolbarContainer.addView(createQuickSettingPill("✨", "ذكاء") { 
                      updatePredictionsUi(listOf("🤖 تفكير..."), "") 
                      toolbarContainer.visibility = View.GONE
                      predictionContainer.visibility = View.VISIBLE
                  })
                  toolbarContainer.addView(createQuickSettingPill("🎚️", "حجم") { 
                      toolbarContainer.visibility = View.GONE
                      sliderContainer.visibility = View.VISIBLE
                  })
                  toolbarContainer.addView(createQuickSettingPill("⚙️", "ضبط") { openSettings() })

                  // 3. Slider Container (Hidden by default)
                  sliderContainer = createMaterialSlider(this, keyHeightDp, 35f, 65f) { newVal ->
                      keyHeightDp = newVal
                      prefs.edit().putFloat("key_height", newVal).apply()
                      val px = (newVal * dp).toInt()
                      keyViews.forEach { 
                          it.layoutParams.height = px
                          it.requestLayout()
                      }
                  }.apply { visibility = View.GONE }

                  dynamicArea.addView(predictionContainer)
                  dynamicArea.addView(toolbarContainer)
                  dynamicArea.addView(sliderContainer)

                  headerContainer.addView(toggleBtn)
                  headerContainer.addView(dynamicArea)
                  rootLayout.addView(headerContainer)
                  rootLayout.addView(Space((8 * dp).toInt()))

                  keysContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  rootLayout.addView(keysContainer)

                  updateSmartPredictions()
                  renderKeys()

                  return rootLayout
              }

              private fun renderKeys() {
                  keysContainer.removeAllViews()
                  keyViews.clear()
                  val dp = resources.displayMetrics.density

                  if (keyboardMode == 0) { // Text Mode
                      val r1 = if(isArabic) listOf("ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د") else listOf("a", "z", "e", "r", "t", "y", "u", "i", "o", "p")
                      val r2 = if(isArabic) listOf("ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط") else listOf("q", "s", "d", "f", "g", "h", "j", "k", "l", "m")
                      val r3 = if(isArabic) listOf("ذ","ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ") else listOf("w", "x", "c", "v", "b", "n")

                      val finalR1 = if(isShifted && !isArabic) r1.map { it.uppercase() } else r1
                      val finalR2 = if(isShifted && !isArabic) r2.map { it.uppercase() } else r2
                      val finalR3 = if(isShifted && !isArabic) r3.map { it.uppercase() } else r3

                      keysContainer.addView(createKeysRow(finalR1, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))
                      keysContainer.addView(createKeysRow(finalR2, 0f, if(isArabic) 12 else 16))
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      
                      val shiftBg = if(isShifted) Color.WHITE else iosKeyControlBg
                      val shiftTxtColor = if(isShifted) Color.BLACK else iosTxtWhiteColor
                      row3Container.addView(createSpecialKey(if(isShifted) "⬆" else "⇧", shiftBg, 1.2f).apply {
                          setTextColor(shiftTxtColor)
                          setOnClickListener { vibrate(); isShifted = !isShifted; renderKeys() }
                      })
                      row3Container.addView(createKeysRow(finalR3, finalR3.size.toFloat(), 6))
                      row3Container.addView(createSpecialKey("⌫", iosKeyControlBg, 1.2f).apply {
                          setOnClickListener { 
                              vibrate()
                              currentInputConnection?.deleteSurroundingText(1, 0)
                              updateSmartPredictions()
                          }
                      })
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      // الأوزان الجديدة لتصغير return وتكبير space
                      bottomRow.addView(createSpecialKey("?123", iosKeyControlBg, 1.2f).apply {
                          setOnClickListener { vibrate(); keyboardMode = 1; renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey("🌐", iosKeyControlBg, 1.2f).apply {
                          setOnClickListener { vibrate(); isArabic = !isArabic; isShifted = false; updateSmartPredictions(); renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", iosKeyNormalBg, 5f, 0.4f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1); updateSmartPredictions() }
                      })
                      bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 1.5f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                      })
                      keysContainer.addView(bottomRow)
                      
                  } else { // Numbers and Symbols Mode
                      val r1 = if(keyboardMode == 1) listOf("1","2","3","4","5","6","7","8","9","0") else listOf("[","]","{","}","#","%","^","*","+","=")
                      val r2 = if(keyboardMode == 1) listOf("-","/",":",";","(",")","$","&","@","\"") else listOf("_","\\","|","~","<",">","€","£","¥","•")
                      val r3 = listOf(".",",","?","!","'")

                      keysContainer.addView(createKeysRow(r1, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))
                      keysContainer.addView(createKeysRow(r2, 0f, 0))
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val row3Container = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      val symToggle = if(keyboardMode == 1) "#+=" else "123"
                      row3Container.addView(createSpecialKey(symToggle, iosKeyControlBg, 1.5f).apply {
                          setOnClickListener { vibrate(); keyboardMode = if(keyboardMode == 1) 2 else 1; renderKeys() }
                      })
                      row3Container.addView(createKeysRow(r3, r3.size.toFloat(), 6))
                      row3Container.addView(createSpecialKey("⌫", iosKeyControlBg, 1.5f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.deleteSurroundingText(1, 0); updateSmartPredictions() }
                      })
                      keysContainer.addView(row3Container)
                      keysContainer.addView(Space((10 * dp).toInt()))

                      val bottomRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      bottomRow.addView(createSpecialKey("ABC", iosKeyControlBg, 1.2f).apply {
                          setOnClickListener { vibrate(); keyboardMode = 0; renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey("🌐", iosKeyControlBg, 1.2f).apply {
                          setOnClickListener { vibrate(); isArabic = !isArabic; keyboardMode = 0; renderKeys() }
                      })
                      bottomRow.addView(createSpecialKey(if(isArabic) "مسافة" else "espace", iosKeyNormalBg, 5f, 0.4f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.commitText(" ", 1) }
                      })
                      bottomRow.addView(createSpecialKey("return", iosActionBlueColor, 1.5f).apply {
                          setOnClickListener { vibrate(); currentInputConnection?.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)) }
                      })
                      keysContainer.addView(bottomRow)
                  }
              }

              // Dictionary Engine
              private fun updateSmartPredictions() {
                  val textBeforeCursor = currentInputConnection?.getTextBeforeCursor(30, 0)?.toString() ?: ""
                  val lastWord = textBeforeCursor.split(Regex("\\s+")).lastOrNull() ?: ""

                  val suggestions = if (lastWord.isEmpty()) {
                      if (isArabic) listOf("مرحبا", "نعم", "شكرا") else listOf("bonjour", "merci", "oui")
                  } else {
                      val dict = if (isArabic) arabicDict else frenchDict
                      val matches = dict.filter { it.startsWith(lastWord, ignoreCase = true) }.take(3)
                      if (matches.isEmpty()) listOf(lastWord) else matches
                  }
                  updatePredictionsUi(suggestions, lastWord)
              }

              private fun updatePredictionsUi(words: List<String>, wordToReplace: String) {
                  predictionContainer.removeAllViews()
                  val dp = resources.displayMetrics.density
                  words.forEach { word ->
                      predictionContainer.addView(TextView(this).apply {
                          text = word
                          textSize = 16f
                          setTextColor(Color.argb((255 * 0.9f).toInt(), 255, 255, 255))
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)
                          isClickable = true
                          background = getRoundRect(Color.TRANSPARENT, 8f * dp)
                          
                          setOnClickListener {
                              vibrate()
                              if (wordToReplace.isNotEmpty()) {
                                  currentInputConnection?.deleteSurroundingText(wordToReplace.length, 0)
                              }
                              currentInputConnection?.commitText("$word ", 1)
                              updateSmartPredictions()
                          }
                      })
                  }
              }

              private fun getAltChars(base: String): List<String> {
                  val lower = base.lowercase()
                  val map = mapOf(
                      "ا" to listOf("أ", "إ", "آ", "ا"),
                      "ى" to listOf("ئ", "ى"),
                      "ي" to listOf("ئ", "ي"),
                      "و" to listOf("ؤ", "و"),
                      "ه" to listOf("ة", "ه"),
                      "a" to listOf("à", "â", "æ", "ä", "a"),
                      "e" to listOf("é", "è", "ê", "ë", "e"),
                      "i" to listOf("î", "ï", "i"),
                      "o" to listOf("ô", "œ", "ö", "o"),
                      "u" to listOf("ù", "û", "ü", "u"),
                      "c" to listOf("ç", "c")
                  )
                  val list = map[lower] ?: emptyList()
                  if (base.isNotEmpty() && base[0].isUpperCase()) {
                      return list.map { it.uppercase() }
                  }
                  return list
              }

              private fun showAltPopup(view: View, alts: List<String>) {
                  val dp = resources.displayMetrics.density
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = getRoundRect(Color.parseColor("#2C2C2E"), 12f * dp)
                      setPadding((6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt(), (6*dp).toInt())
                  }
                  altViews.clear()
                  alts.forEach { char ->
                      val tv = TextView(this).apply {
                          text = char
                          textSize = 24f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams((44*dp).toInt(), (50*dp).toInt()).apply {
                              setMargins((2*dp).toInt(), 0, (2*dp).toInt(), 0)
                          }
                          background = getRoundRect(Color.parseColor("#3A3A3C"), 8f * dp)
                      }
                      altViews.add(tv)
                      container.addView(tv)
                  }
                  altPopupWindow = PopupWindow(container, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      isClippingEnabled = false
                  }
                  val loc = IntArray(2)
                  view.getLocationOnScreen(loc)
                  val popupWidth = alts.size * (48 * dp) + (12 * dp)
                  val xOffset = loc[0] - (popupWidth / 2) + (view.width / 2)
                  altPopupWindow?.showAtLocation(view, Gravity.NO_GRAVITY, xOffset.toInt(), loc[1] - (70 * dp).toInt())
              }

              private fun createKey(char: String): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = char
                      textSize = 21f
                      setTextColor(iosTxtWhiteColor)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), 1f)
                      background = getRoundRect(iosKeyNormalBg, 6f * dp)
                      isClickable = true
                      
                      var isLongPressing = false
                      var hoveredIndex = -1
                      var longPressRunnable: Runnable? = null

                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  vibrate()
                                  isLongPressing = false
                                  hoveredIndex = -1
                                  
                                  showPopup(v, char)
                                  v.background = getRoundRect(Color.LTGRAY, 6f * dp)
                                  (v as TextView).setTextColor(Color.BLACK)

                                  val alts = getAltChars(char)
                                  if (alts.isNotEmpty()) {
                                      longPressRunnable = Runnable {
                                          isLongPressing = true
                                          dismissPopup()
                                          showAltPopup(v, alts)
                                      }
                                      handler.postDelayed(longPressRunnable!!, 350)
                                  }
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  if (isLongPressing && altPopupWindow != null) {
                                      val rawX = event.rawX
                                      altViews.forEachIndexed { index, tv ->
                                          val loc = IntArray(2)
                                          tv.getLocationOnScreen(loc)
                                          if (rawX >= loc[0] && rawX <= loc[0] + tv.width) {
                                              tv.setBackgroundColor(Color.LTGRAY)
                                              tv.setTextColor(Color.BLACK)
                                              hoveredIndex = index
                                          } else {
                                              tv.background = getRoundRect(Color.parseColor("#3A3A3C"), 8f * dp)
                                              tv.setTextColor(Color.WHITE)
                                          }
                                      }
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  longPressRunnable?.let { handler.removeCallbacks(it) }
                                  v.background = getRoundRect(iosKeyNormalBg, 6f * dp)
                                  (v as TextView).setTextColor(iosTxtWhiteColor)

                                  if (isLongPressing) {
                                      if (hoveredIndex != -1 && event.action == MotionEvent.ACTION_UP) {
                                          currentInputConnection?.commitText(altViews[hoveredIndex].text.toString(), 1)
                                      } else if (event.action == MotionEvent.ACTION_UP) {
                                          val alts = getAltChars(char)
                                          if (alts.isNotEmpty()) currentInputConnection?.commitText(alts[0], 1)
                                      }
                                      altPopupWindow?.dismiss()
                                      altPopupWindow = null
                                  } else {
                                      dismissPopup()
                                      if (event.action == MotionEvent.ACTION_UP) {
                                          currentInputConnection?.commitText(char, 1)
                                          if (isShifted) {
                                              isShifted = false
                                              renderKeys()
                                          }
                                      }
                                  }
                                  if (event.action == MotionEvent.ACTION_UP) {
                                      updateSmartPredictions()
                                  }
                              }
                          }
                          true
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun createKeysRow(keys: List<String>, weightInParent: Float = 0f, sidePaddingDp: Int = 0): LinearLayout {
                  val dp = resources.displayMetrics.density
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = if (weightInParent > 0f) {
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, weightInParent)
                      } else {
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      }
                      if (sidePaddingDp > 0) {
                          val padding = (sidePaddingDp * dp).toInt()
                          setPadding(padding, 0, padding, 0)
                      }
                  }
                  keys.forEachIndexed { index, char ->
                      row.addView(createKey(char))
                      if (index < keys.size - 1) row.addView(Space((4 * dp).toInt(), true))
                  }
                  return row
              }

              private fun vibrate() {
                  try { vibrator.vibrate(VibrationEffect.createOneShot(15, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }
              
              private fun createQuickSettingPill(icon: String, text: String, onClick: () -> Unit): View {
                  val dp = resources.displayMetrics.density
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      background = getRoundRect(Color.parseColor("#2D322F"), 100f * dp)
                      layoutParams = LinearLayout.LayoutParams(0, (36 * dp).toInt(), 1f).apply {
                          setMargins((2*dp).toInt(), 0, (2*dp).toInt(), 0)
                      }
                      setPadding((4*dp).toInt(), 0, (4*dp).toInt(), 0)
                      
                      addView(TextView(context).apply {
                          this.text = icon
                          textSize = 14f
                          setTextColor(Color.parseColor("#BCEBCE"))
                      })
                      addView(Space((4*dp).toInt(), true))
                      addView(TextView(context).apply {
                          this.text = text
                          textSize = 12f
                          setTextColor(Color.parseColor("#E0E3E0"))
                          setTypeface(null, Typeface.BOLD)
                      })
                      setOnClickListener { onClick() }
                  }
              }

              private fun showPopup(view: View, char: String) {
                  val dp = resources.displayMetrics.density
                  if (popupWindow == null) {
                      popupTextView = TextView(this).apply {
                          textSize = 32f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          background = getRoundRect(Color.parseColor("#5A5A5C"), 8f * dp)
                          setPadding(0, 0, 0, (8 * dp).toInt())
                      }
                      popupWindow = PopupWindow(popupTextView, (view.width * 1.5).toInt(), (view.height * 1.8).toInt()).apply {
                          isClippingEnabled = false
                      }
                  }
                  popupTextView?.text = char
                  val location = IntArray(2)
                  view.getLocationOnScreen(location)
                  popupWindow?.showAtLocation(view, Gravity.NO_GRAVITY, location[0] - view.width/4, location[1] - (view.height * 1.2).toInt())
              }

              private fun dismissPopup() { popupWindow?.dismiss() }

              private fun createSpecialKey(label: String, bgColor: Int, weight: Float, textAlpha: Float = 1f): TextView {
                  val dp = resources.displayMetrics.density
                  val key = TextView(this).apply {
                      text = label
                      textSize = 16f
                      setTextColor(Color.argb((255 * textAlpha).toInt(), 255, 255, 255))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, (keyHeightDp * dp).toInt(), weight).apply {
                          if (label != "?123" && label != "⇧" && label != "ABC" && label != "⬆" && label != "#+=") setMargins((4 * dp).toInt(), 0, 0, 0)
                      }
                      background = getRoundRect(bgColor, 6f * dp)
                      isClickable = true
                      setTypeface(null, if (label == "return") Typeface.BOLD else Typeface.NORMAL)
                      
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { vibrate(); v.alpha = 0.5f }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.alpha = 1f }
                          }
                          false
                      }
                  }
                  keyViews.add(key)
                  return key
              }

              private fun getRoundRect(bgColor: Int, radius: Float): GradientDrawable {
                  return GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(bgColor); cornerRadius = radius }
              }
              
              private fun createMaterialSlider(context: Context, currentVal: Float, min: Float, max: Float, onUpdate: (Float) -> Unit): View {
                  val dp = context.resources.displayMetrics.density
                  val containerHeight = (36 * dp).toInt()
                  
                  val bgCol = Color.parseColor("#2D322F")
                  val fillCol = Color.parseColor("#BCEBCE")
                  val iconCol = Color.parseColor("#102015")

                  val container = FrameLayout(context).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, containerHeight)
                      background = getRoundRect(bgCol, containerHeight / 2f)
                  }
                  
                  val fillView = View(context).apply {
                      layoutParams = FrameLayout.LayoutParams(containerHeight, ViewGroup.LayoutParams.MATCH_PARENT)
                      background = getRoundRect(fillCol, containerHeight / 2f)
                  }
                  
                  val textLabel = TextView(context).apply {
                      text = "الحجم: ${currentVal.toInt()}"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      setTypeface(null, Typeface.BOLD)
                  }

                  val icon = TextView(context).apply {
                      text = "↔"
                      textSize = 18f
                      setTextColor(iconCol)
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(containerHeight, ViewGroup.LayoutParams.MATCH_PARENT)
                  }

                  container.addView(fillView)
                  container.addView(textLabel)
                  container.addView(icon)

                  var currentWidth = currentVal

                  fun updateFillWidth(totalWidth: Int) {
                      if (totalWidth <= 0) return
                      val progress = ((currentWidth - min) / (max - min)).coerceIn(0f, 1f)
                      val fillWidth = (containerHeight + progress * (totalWidth - containerHeight)).toInt()
                      fillView.layoutParams = FrameLayout.LayoutParams(fillWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                      textLabel.text = "الحجم: ${currentWidth.toInt()}"
                  }

                  container.addOnLayoutChangeListener { _, left, _, right, _, oldLeft, _, oldRight, _ ->
                      val width = right - left
                      val oldWidth = oldRight - oldLeft
                      if (width > 0 && width != oldWidth) {
                          updateFillWidth(width)
                      }
                  }
                  container.post { updateFillWidth(container.width) }

                  container.setOnTouchListener { v, event ->
                      val totalWidth = v.width
                      if (totalWidth <= 0) return@setOnTouchListener false
                      var newWidth = event.x.toInt()
                      if (newWidth < containerHeight) newWidth = containerHeight
                      if (newWidth > totalWidth) newWidth = totalWidth
                      
                      fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                      fillView.requestLayout()
                      
                      val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                      currentWidth = min + (progress * (max - min))
                      textLabel.text = "الحجم: ${currentWidth.toInt()}"
                      onUpdate(currentWidth)
                      true
                  }
                  return container
              }

              private fun Space(size: Int, isHorizontal: Boolean = false): View {
                  return View(this).apply { layoutParams = if (isHorizontal) LinearLayout.LayoutParams(size, 1) else LinearLayout.LayoutParams(1, size) }
              }
              
              private fun openSettings() {
                  startActivity(Intent(this, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
              }
          }
